://arxiv.org/abs/2302.13971\n- 《Llama 2: Open Foundation and Fine-Tuned Chat Models》 — https://arxiv.org/abs/2307.09288\n- vLLM 官方文档 — https://docs.vllm.ai/en/latest/", "review_md": "# 审校记录 · 2026-11-03-transformer-foundation-2\n\n## verdict\n\nrevise\n\n## summary\n\n教学结构完整（课前自测、核心概念、worked example、误区、一句话总结、术语卡、下一步、来源齐备），绝大多数术语都有内联注释，来源与论文事实（LLaMA2-70B 的 64 头/8 套 KV、8/3d 中间维度、RoPE θ 公式等）核对无误；我逐个数重算了 worked example：①—③、⑥—⑦ 及头 1 的两行输出（[0.20,1.33]、[0.33,0.80]）均正确。但步骤 ④ 把头 2 旋转后的 K 当成 V 使用，与自身定义 v=X̂（RoPE 只转 Q/K）及头 1 的算法矛盾，导致表格两格与 ⑤ 的 t1/t2 两行及其二次归一全部算错，属于必须修改的概念性错误；另有几处表述需加限定或补充定义。\n\n## issues\n\n### Issue 1 · severity: high\n\n- **claim**: 步骤④的 o₂=0.05·[1,1]+0.05·[1,1]+0.90·[−√2,√2]≈[−1.16,1.37]，以及表格中 t1 头2=[1,1]、t2 头2=[−1.16,1.37]\n- **problem**: 把头 2 旋转后的 k 当成了 v：讲义自己定义 v=X̂ 不旋转（RoPE 只作用于 Q/K），头 2 的 v₁ 应为未旋转的 [√2,0]、v₂ 应为 [√2,√2]，而不是旋转后的 [1,1]、[−√2,√2]。作者在头 1 用了未旋转 v（所以 t1=[0.20,1.33] 是对的），头 2 却用旋转后的 k 作 v，两处算法互相矛盾。重算（标准做法，v 不旋转）：头2 t1 = 0.5·[1,1]+0.5·[√2,0] = [1.21, 0.50]；头2 t2 = 0.05·[1,1]+0.05·[√2,0]+0.89·[√2,√2] ≈ [1.39, 1.32]。\n- **fix**: 在步骤③补一句「RoPE 只旋转 Q、K；v 保持 X̂ 不旋转」；把表格中 t1 头2 改为 [1.21, 0.50]、t2 头2 改为 [1.39, 1.32]；随之重算⑤：A(t1)=[0.20, 2.75, 2.62, 0.50]→再归一≈[0.10, 1.43, 1.37, 0.26]；A(t2)=[0.33, 0.80, 2.81, 2.74]→再归一≈[0.16, 0.40, 1.40, 1.36]。\n\n### Issue 2 · severity: medium\n\n- **claim**: 「上集搭好了注意力骨架……但它还不能直接训出能用的 LLM：没有位置信息、深层训练不稳定、ReLU 前馈表达能力有限、推理时 KV 缓存太大。」\n- **problem**: 把四个组件写成训练 LLM 的必要条件，与事实不符：GPT-2/GPT-3 用学习式位置编码 + LayerNorm + GELU（非 SwiGLU）也训出了可用模型；且「KV 缓存太大」是推理成本问题，与「能不能训出」无关。属于把存疑/推测写成事实。\n- **fix**: 改为「难以高效、稳定、低成本地训出并部署」：这四个组件是效率/稳定性/质量改进，不是硬性前提。\n\n### Issue 3 · severity: medium\n\n- **claim**: KV cache 大小公式（课前自测答案、GQA 节、术语卡共出现 3 次）中的「head_dim」「字节数」\n- **problem**: 这两个符号从未定义：head_dim 是每个注意力头的维度；字节数是每个元素的 dtype 字节数（fp16/bf16=2、fp32=4）。基础较弱的读者拿到公式也无法代入计算，且这是课前自测 Q3 的官方答案。\n- **fix**: 在首次出现处标注：head_dim=每头维度；字节数=每元素字节数（fp16/bf16 为 2，fp32 为 4），并给一个数字例子（如 70B 模型：64 层 × 8 KV 头 × head_dim 128 × 1024 序列 × 2 字节 × batch 1 ≈ 256MB）。\n\n### Issue 4 · severity: medium\n\n- **claim**: 模块目标「能解释 attention 在做什么（对比 RNN）」在本课完全未出现；目标「能写出公式并说明每一项」也只解释了 √d 的作用\n- **problem**: 本课确实覆盖了其余三个模块目标（公式出现 ✓、RoPE/RMSNorm/SwiGLU/GQA ✓、decoder-only ✓），但 RNN 对比缺席，Q/K/V 的语义仅靠术语卡一行带过。若上集已覆盖 RNN 对比与逐项说明则此条作废。\n- **fix**: 确认上集是否覆盖；若未覆盖，在「为什么需要它」或课前自测答案补 2-3 句：RNN 靠逐步传递隐藏状态（长距离信息易衰减、只能串行），attention 用 Q·K 直接算任意两个位置的关联（路径短、可并行）。\n\n### Issue 5 · severity: low\n\n- **claim**: 步骤④「权重≈[0.05, 0.05, 0.90]」与「o₂≈[−1.16, 1.37]」\n- **problem**: 四舍五入前后不一致：16.9/(16.9+2)=0.894≈0.89，写成 0.90；若按 0.90 计算，o₂ 首维应为 −1.17 而非 −1.16（−1.16 对应的是 0.89）。初学者跟着手算会被这 0.01 卡住。\n- **fix**: 统一用权重 [0.05, 0.05, 0.89]（或保留 0.894），再据此写 o₂。\n\n### Issue 6 · severity: low\n\n- **claim**: 「LLaMA 把中间维度从 4d 缩到约 8/3·d（向上取整到 256 的倍数）」\n- **problem**: 只对 Llama 1/2 成立；Llama 3 系列用的中间维度比例不同（如 8B 为 14336 ≈ 3.5×4096），说「LLaMA」而不限定版本不准确。\n- **fix**: 加限定「（Llama 1/2 的做法）」或改为「LLaMA 1/2 系」。\n\n### Issue 7 · severity: low\n\n- **claim**: 玩具模型符号「d_ff=2」、RoPE 机制公式中的「r、α」\n- **problem**: d_ff（FFN 中间层宽度）与 r、α（二维向量极坐标的幅长、幅角）没有解释就使用，基础较弱的读者会卡住。\n- **fix**: 各补半句：玩具模型处写「d_ff=2 表示 FFN 中间层宽度为 2」；RoPE 机制处写「把旋转前每对 (x₂ᵢ, x₂ᵢ₊₁) 写成极坐标 (r, α)」。\n\n### Issue 8 · severity: low\n\n- **claim**: GQA 直觉「找书质量几乎不受影响」\n- **problem**: 这句话紧跟在 g=1（MQA）的定义之后，容易让读者误以为 MQA 也几乎无损；GQA 论文显示组数太少（尤其 MQA）有可见的质量损失。\n- **fix**: 改为「组数不太少时质量几乎不受影响（g=1 的 MQA 会有可见损失）」。\n", "term_count": 10, "source_count": 8, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-transformer-foundation", "date": "2026-11-03", "title": "第 3 课 · Transformer 与 decoder-only 范式（上）", "main_thread": "解释 attention 在做什么，以及它如何解决 RNN 的串行与长距离短板 · 写出 scaled dot-product attention 公式并逐项说明每一项，能手算一个注意力输出 · 说清多头注意力与残差连接各自解决什么问题，并正确读出注意力权重矩阵的行/列语义", "domain": "模型演进", "module": "Transformer 与 decoder-only 范式", "module_id": "transformer-foundation", "lesson_no": 3, "tags": ["transformer", "attention", "QKV", "multi-head attention", "残差连接", "模型演进"], "markdown": "# 第 3 课 · Transformer 与 decoder-only 范式（上）\n\n> 学完今天，你能：\n> 1. 解释 attention 在做什么，以及它如何解决 RNN 的串行与长距离短板；\n> 2. 写出 scaled dot-product attention 公式并逐项说明每一项，能手算一个注意力输出；\n> 3. 说清多头注意力与残差连接各自解决什么问题，并正确读出注意力权重矩阵的行/列语义。\n\n## 课前自测\n\n先回忆前两课（nn-basics-1/2）的工具：张量与矩阵乘法；线性层 y = xW + b；softmax 把实数向量变成「非负、和为 1」的概率分布；损失函数与梯度下降。自测 4 题：\n\n1. RNN 处理长度为 n 的序列为什么必须走 n 步？这会带来什么问题？\n2. softmax([2, 0, 1]) 的三个输出有什么共同性质？（不必算出精确值）\n3. 两个向量点积越大，几何上说明什么？\n4. 若某层输出定义为 F(x) + x，而 F 完全没学到东西（F(x) = 0），此时层的输出是什么？\n\n（本集覆盖模块目标 1–2：attention 在做什么 / 公式逐项；目标 3–4 由下集覆盖。）\n\n## 为什么需要它\n\n前两课的网络吃「固定长度的一条输入」。但句子长度不固定、词与词有依赖：「他拿起___喝了」里，空格处要知道前文指的是「水杯」。序列模型要建模这种跨位置依赖。\n\n最朴素的做法是 RNN（循环神经网络）：按顺序读入 token（文本切分出的最小处理单元，词或子词），每一步把「当前 token + 上一步的隐藏状态（hidden state，压缩历史的向量）」算成新状态。像逐字读信，历史全压进一个不断更新的记忆。两个致命短板：\n\n- 串行：第 t 步依赖第 t-1 步，n 步只能一步步算，长文本又慢又无法并行；\n- 长距离：第 1 个词的信息传到第 1000 个词要经过 999 次「压缩—传递」，容易丢；训练时还伴随梯度消失（反向传播时靠前位置几乎收不到梯度信号，参数学不动）。\n\nTransformer（Vaswani 等，2017）的答案：放弃一步步传，让每个位置直接和所有位置比一次「相关程度」，一步到位。直觉类比：找资料不是逐页读完一本书，而是拿关键词查索引、直接翻到相关页——这就是 attention（注意力）。attention 任意两位置的计算路径长度是 1，没有中间传递损耗；而且全是矩阵运算，天生适合并行硬件。\n\n工程上这直接决定推理形态：attention 是推理中最重的计算之一——vLLM 怎么调度它，下一模块再讲。\n\n## 核心概念\n\n### attention（注意力）\n\n直觉：在图书馆找资料。你手里有「我要找什么」（query），每本书贴着「标签」（key）并有「正文」（value）。你拿 query 和每本书的标签比对，按匹配程度决定读多少。\n\n定义：给定一个 query 与一组 key–value 对，输出是全部 value 的加权和；第 i 个 value 的权重由「query 与第 i 个 key 的相似度」经 softmax 归一得到。\n\n机制：序列里每个位置同时扮演三个角色，用三套参数矩阵投影出来（下一节），再按公式批量计算——本质是「可学习的加权检索」。\n\n### Q / K / V\n\n直觉：一句话里，每个 token 同时有三种身份：「我想找什么信息」（Query）、「别人拿我当什么检索标签」（Key）、「我真正携带的内容」（Value）。\n\n定义：输入 X 形状 (n, d_model)：n 个 token、每个 d_model 维。Q = XW_Q、K = XW_K、V = XW_V，W_Q/W_K/W_V 是训练中学习的投影矩阵，把每个 token 投成 d_k 维（Q、K）或 d_v 维（V）。注意：Q、K、V 不是三份不同数据，是同一份数据的三种投影。\n\n机制：每个 token 用自己的 Q 和所有 token 的 K 算相似度，再按权重从所有 token 的 V 里抄信息。W 在训练中学会「按什么标准相关、抄什么内容」。\n\n### scaled dot-product attention（缩放点积注意力）\n\n直觉：「打分、归一、加权求和」三步，外加一个防数值爆炸的缩放。\n\n定义与公式：\n\nAttention(Q, K, V) = softmax(QKᵀ / √d_k) V\n\n逐项拆解（记 n 个 token）：\n\n1. QKᵀ：形状 (n, n)，第 i 行第 j 列 = 第 i 个 query 与第 j 个 key 的点积。点积几何意义：两向量越同向值越大，这里当「相关分数」用。分数还没归一，可以是任意实数。\n2. ÷√d_k：缩放。论文论证：若 q、k 各维独立且均值 0、方差 1，则点积的方差是 d_k——d_k 越大分数越大，softmax 会被推入「饱和区」，该处梯度几乎为 0。除以 √d_k 把方差拉回 1，训练才稳定。\n3. softmax：按行把分数变成非负、和为 1 的权重（nn-basics-2 学过）。\n4. ×V：每个位置的输出 = 所有 token 的 V 按权重加权平均，形状 (n, d_v)。输出向量「汇集」了全序列的信息。\n\n（在只按从左到右逐 token 生成文本的 decoder（解码器）模型中，还会加因果 mask——把「未来」token 的分数置为负无穷再 softmax，使权重为 0；decoder 与 decoder-only 是什么，下集展开。）\n\n### 多头注意力（multi-head attention）\n\n直觉：只找一个「专家」看句子有盲区——有的头学会盯前一个词，有的头看指代关系。多找几个专家从不同侧面同时看。\n\n定义：每头用一套小投影矩阵把 Q/K/V 投成 d_model/h 维，独立做 scaled dot-product attention（等价于把一个大头切成 h 个小头），h 个输出拼接后经 W^O 投影：\n\nhead_i = Attention(QW_i^Q, KW_i^K, VW_i^V)\nMultiHead(Q, K, V) = Concat(head_1, …, head_h) W^O\n\n机制：总参数量和单头同阶，但模型能在 h 个子空间里学 h 种不同的「相关方式」。论文可视化观察到不同头确实呈现不同模式（有的盯相邻位置、有的看远距离指代）。主流模型都沿用（如 LLaMA-7B 有 32 个头）。\n\n### 残差连接（residual connection）\n\n直觉：高速公路的应急车道——主路（新子层）没修好，车流仍沿原路通过。\n\n定义：子层输出 = F(x) + x，其中 x 是本层输入，F 是注意力或前馈网络。\n\n机制：反向传播时，恒等路径 x 的梯度恒为 1，不随层数加深衰减，深层网络因此训得动（He 等 2015 年在 ResNet 中提出，Transformer 每个子层都套用）。Transformer 的完整子层是「F(x) + x → 归一化」，归一化是 LayerNorm（层归一化），下集讲它的省算力变体均方根归一化（RMSNorm）。\n\n## 一步一步理解\n\n用 3 个 token「我 / 爱 / 昇腾」，取 d_model = 4、d_k = d_v = 2、单头，手算一遍。token 先经 embedding（把离散 token 查表变成稠密向量的层）得到输入 X。设 X（形状 (3, 4)）：\n\n```\n我：  [1, 0, 1, 0]\n爱：  [0, 1, 0, 1]\n昇腾：[1, 1, 0, 0]\n```\n\n第 1 步：投影。为便于手算取 W_Q = W_K = W_V = [[1,0],[0,1],[1,0],[0,1]]（真实模型三者不同且可学习）。按「X 第 i 行与 W 第 j 列点积」得：\n\n```\nQ = K = V：\n我：  [2, 0]\n爱：  [0, 2]\n昇腾：[1, 1]\n```\n\n第 2 步：分数矩阵 QKᵀ（第 i 行第 j 列 = Q_i · K_j）：\n\n```\n[[4, 0, 2],\n [0, 4, 2],\n [2, 2, 2]]\n```\n\n第 3 步：除以 √d_k = √2 ≈ 1.414：\n\n```\n[[2.828, 0,     1.414],\n [0,     2.828, 1.414],\n [1.414, 1.414, 1.414]]\n```\n\n第 4 步：逐行 softmax（e^2.828 ≈ 16.9，e^1.414 ≈ 4.11，e^0 = 1）：\n\n```\n第 1 行：[16.9, 1, 4.11] / 22.0   ≈ [0.768, 0.045, 0.187]\n第 2 行：[1, 16.9, 4.11] / 22.0   ≈ [0.045, 0.768, 0.187]\n第 3 行：[4.11, 4.11, 4.11] / 12.3 ≈ [0.333, 0.333, 0.333]\n```\n\n第 5 步：输出 = 权重 × V：\n\n```\n「我」：  0.768·[2,0] + 0.045·[0,2] + 0.187·[1,1] ≈ [1.72, 0.28]\n「爱」：  0.045·[2,0] + 0.768·[0,2] + 0.187·[1,1] ≈ [0.28, 1.72]\n「昇腾」：0.333·[2,0] + 0.333·[0,2] + 0.333·[1,1] = [1.0, 1.0]\n```\n\n怎么读结果：「我」的输出 76.8% 来自自己（第 1 行权重大头压在自己身上）；「昇腾」所在第 3 行的权重对三个 token 都是 1/3——它从每个位置等量取信息，所以它的输出是三个 V 的平均，和谁都没有突出的「专属相关」。记住行/列语义：第 i 行 = 第 i 个 token 的 query 把注意力分给各 key 的权重；第 j 列 = 第 j 个 token 作为 key 被各 query 读取的权重——例如第 3 列 [0.187, 0.187, 0.333] 表示「昇腾」作为 key 被三个 query 读取的比例，并不均匀。真实模型的权重由训练出的 W 决定，但流程就是这 5 步；随后做残差（输出 + 原输入 X）再归一化。\n\n工程视角（落到昇腾 + vLLM）：vLLM 把 Q、K、V 三个线性层合并成一次大矩阵乘法（GEMM，NPU/GPU 上最核心的算子），attention 部分则优先用融合算子——中间的 (n, n) 分数矩阵不写回显存，省带宽；昇腾后端（vllm-ascend 开源项目）通过 CANN（Compute Architecture for Neural Networks，昇腾计算架构）的融合算子实现同样效果。记住：上面 5 步是「数学定义」，工程实现会重排、融合这些计算；下一模块再展开 vLLM 怎么调度。\n\n## 常见误区\n\n1. 「attention 像人一样读懂了语义」。错。机制只是「算相似度 → 加权平均」，是可学习的检索，不是理解；有意义的注意力来自 W_Q/W_K/W_V 在海量数据上的训练。把机制当智能，是新手最常见的错觉。\n2. 「Q、K、V 是三种不同的输入数据」。错。三者都来自同一份 X，只是乘了三套参数矩阵；「谁查、谁被查、取什么内容」这些角色完全由训练决定，不是先验语义。\n3. 「÷√d_k 只是调温度的玄学，去掉也没事」。错。不缩放时点积方差随 d_k 线性变大，softmax 输出趋近 one-hot（只有一个位置权重接近 1、其余接近 0），该处梯度趋近 0，训练不稳。这是论文的数值稳定性设计，不是可选项。\n4. 「注意力权重大 = 两个词语义相似」。不全对。权重表示「当前这一步该抄谁的信息」，受位置、层数、头的功能影响，还随上下文变化；注意力权重能否当「解释」用学界仍有争论，别直接当语义相似度读。\n\n## 一句话总结\n\nAttention 用「QK 点积打分 → softmax 归一 → 对 V 加权平均」取代 RNN 的串行传递，让每个 token 一步直达全体 token；√d_k 缩放保数值稳定，多头提供多个并行视角，残差连接让深层网络训得动。\n\n## 自测题\n\n### 1. attention 相对 RNN 解决了哪两个核心问题？\n<details><summary>查看答案<\/summary>串行：RNN 第 t 步依赖第 t-1 步，n 个 token 必须走 n 步、无法并行；attention 用矩阵运算一次算完所有两两相关，适合并行硬件。长距离：RNN 第 1 个词传到第 1000 个词要经 999 次压缩传递，易丢信息、伴随梯度消失；attention 任意两位置路径长度是 1，没有中间损耗。<\/details>\n\n### 2. 写出 scaled dot-product attention 的公式，并说明 √d_k 缩放的作用。\n<details><summary>查看答案<\/summary>Attention(Q, K, V) = softmax(QKᵀ/√d_k)V。若 q、k 各维独立且均值 0、方差 1，点积的方差是 d_k——d_k 越大分数越大，softmax 被推入饱和区、该处梯度几乎为 0；除以 √d_k 把方差拉回 1，训练才稳定。<\/details>\n\n### 3. 注意力权重矩阵某一行是 [0.1, 0.8, 0.1]（序列 A/B/C），这一行表示什么？对应 token 的输出向量怎么算？\n<details><summary>查看答案<\/summary>按行读：第 i 行 = 第 i 个 token 的 query 分给各 key 的权重。这一行表示「我这个 token」把 80% 注意力放在 B 上。它的输出 = 0.1·V_A + 0.8·V_B + 0.1·V_C。列语义不同：第 j 列是第 j 个 token 作为 key 被各 query 读取的比例，两者不要混。<\/details>\n\n### 4. Q、K、V 是三份不同数据吗？多头相比单头参数量为什么没有数量级差异？\n<details><summary>查看答案<\/summary>不是。Q = XW_Q、K = XW_K、V = XW_V，三者都来自同一份 X 的三套投影，角色由训练决定。多头把每头维度缩到 d_model/h，h 个头拼接后总参数量与单头同阶，却能在 h 个子空间学 h 种「相关方式」。<\/details>\n\n### 5. 残差连接 F(x) + x 为什么能让深层网络训得动？\n<details><summary>查看答案<\/summary>反向传播时恒等路径 x 的梯度恒为 1，不随层数衰减，梯度能一路传回浅层；即使 F 没学好（F(x) = 0），层输出仍等于输入，网络不会立刻崩。Transformer 每个子层都套用「F(x) + x → 归一化」。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| token | 文本切分出的最小处理单元（词或子词），先经 embedding 变成向量 |\n| RNN（循环神经网络） | 按顺序读序列、用隐藏状态逐字传历史的网络；串行、长距离易丢信息 |\n| attention（注意力） | 用 query 与各 key 的相似度做权重、对 values 加权求和，让每个位置一步直达全部位置 |\n| Q / K / V | 同一输入 X 分别乘三套可学习矩阵得到的 Query / Key / Value 投影 |\n| 点积 | 两向量对应位置相乘再求和，几何上度量「同向程度」 |\n| scaled dot-product attention | softmax(QKᵀ/√d_k)V：点积打分、√d_k 缩放、softmax 归一、加权求和 |\n| softmax | 把实数向量变成非负、和为 1 的概率分布（nn-basics-2 已学） |\n| 多头注意力 | 每头用一套小投影矩阵把 Q/K/V 投成 d_model/h 维独立做 attention，h 个输出拼接后经 W^O 投影，学多种相关模式 |\n| 残差连接 | 子层输出 F(x) + x，恒等捷径保住信息与梯度，深层可训 |\n| decoder（解码器） | 按从左到右逐 token 生成文本的模型结构；decoder-only 是什么，下集展开 |\n| d_model / d_k / d_v | 模型隐藏维度 / Q、K 的维度 / V 的维度 |\n| GEMM | General Matrix Multiply，通用矩阵乘，NPU/GPU 上最核心的算子 |\n| embedding | 把离散 token 查表变成稠密向量的层（nn-basics 已学） |\n\n## 下一步\n\n明天（第 3 课下集）先补齐三件事：位置信息从哪来（旋转位置编码 RoPE）、归一化怎么做省（均方根归一化 RMSNorm）、前馈层用什么激活（SwiGLU 激活函数），并解释分组查询注意力（GQA）与「为什么主流都做 decoder-only」；之后进入下一模块「推理服务基础：prefill/decode 与 KV cache」。\n\n## 来源\n\n- Attention Is All You Need — https://arxiv.org/abs/1706.03762\n- The Illustrated Transformer — https://jalammar.github.io/illustrated-transformer/\n- LLaMA: Open and Efficient Foundation Language Models — https://arxiv.org/abs/2302.13971\n- Deep Residual Learning for Image Recognition — https://arxiv.org/abs/1512.03385\n- Dive into Deep Learning，第 11 章 Attention Mechanisms and Transformers — https://d2l.ai/chapter_attention-mechanisms-and-transformers/index.html\n- vLLM 官方文档 — https://docs.vllm.ai/en/stable/\n- vLLM Ascend 后端文档 — https://docs.vllm.ai/projects/ascend/en/latest/", "review_md": "# 审校记录 · 2026-11-03 · transformer-foundation\n\n## 结论（verdict）\n\nrevise\n\n## 总结（summary）\n\n结构与覆盖基本达标：课前自测、动机（对比 RNN）、核心概念、可手算的 worked example、常见误区、一句话总结、术语卡、下一步、来源八块齐全；scaled dot-product attention 公式、多头、残差连接与论文一致，因果 mask 描述正确。worked example 的 5 步全部重算无误（投影 [2,0]/[0,2]/[1,1]、QKᵀ、÷√2、softmax：e^2.828≈16.9、e^1.414≈4.11、行和 22.0/12.3、权重与最终输出 [1.72,0.28]/[0.28,1.72]/[1.0,1.0] 均正确），÷√d_k 的方差论证（方差=d_k、除以 √d_k 拉回 1）正确，LLaMA-7B 32 个头、ResNet 归属等事实无误，「注意力权重≠语义相似度」的存疑表述处理得当。主要问题集中在初学者表述层：结果解读段把注意力矩阵的行/列语义说混；decoder 未定义先使用；另有梯度消失、RoPE/RMSNorm/SwiGLU/GQA 缩写未展开、模块目标映射缺失、多头「切片 vs 投影」表述不一致等低severity问题。无 high 级概念错误。\n\n## 问题清单（issues）\n\n### 1. [medium]\n\n- **claim**：怎么读结果：「我」的输出 76.8% 来自自己；「昇腾」对谁都贡献 1/3，于是它的输出是三个向量的平均。\n- **problem**：注意力权重矩阵要按行读：第 i 行是第 i 个 token 的 query 分给各 key 的权重。「昇腾对谁都贡献 1/3」说的是列语义（昇腾给别人贡献多少），而第 3 列实际是 [0.187, 0.187, 0.333]，并不均匀；均匀的是第 3 行（昇腾从每个 token 各取 1/3）。行列说混恰好落在初学者最容易出错的地方，会种下错误直觉。\n- **fix**：改为「『昇腾』这一行的注意力权重对三个 token 都是 1/3——它从每个位置等量地取信息，所以它的输出是三个 V 的平均」；顺手加一句「行 = 我这个 query 把注意力分给谁，列 = 每个 key 被多少个 query 读取」帮助读者建立行/列对应。\n\n### 2. [medium]\n\n- **claim**：（decoder 里还会加因果 mask——把「未来」token 的分数置为负无穷再 softmax，使权重为 0；下集讲 decoder-only 时展开。）\n- **problem**：decoder 是全篇第一次出现且没有任何定义或铺垫；目标读者是基础较弱的工程师，刚学完 RNN/attention，不知道 decoder 指什么——而本模块的主题恰恰是 decoder-only，这个词不能悬空到下一集。\n- **fix**：补一句最小定义，如「（在只按从左到右逐字生成的 decoder（解码器）模型中，还要加因果 mask……；decoder 与 decoder-only 是什么，下集展开）」，或在术语卡中先给 decoder 一条占位解释。\n\n### 3. [low]\n\n- **claim**：- 长距离：第 1 个词的信息传到第 1000 个词要经过 999 次「压缩—传递」，容易丢；训练时还伴随梯度消失。\n- **problem**：「梯度消失」未解释就使用；课前自测确认过的基础只有损失函数与梯度下降，梯度消失不在其列，弱基础读者会卡住。\n- **fix**：补半句白话：「梯度消失（反向传播时靠前位置几乎收不到梯度信号，参数学不动）」；或删去此半句，把梯度问题留给训练相关章节。\n\n### 4. [low]\n\n- **claim**：## 下一步 …位置信息从哪来（RoPE）、归一化怎么做省（RMSNorm）、前馈层用什么激活（SwiGLU），并解释 GQA 与「为什么主流都做 decoder-only」。\n- **problem**：RoPE/RMSNorm/SwiGLU/GQA 四个缩写在本课零解释地出现；弱基础读者在「下一步」就卡壳，而这些正是模块目标 3 要考察的名词。\n- **fix**：首次出现时给出全称：旋转位置编码（RoPE）、均方根归一化（RMSNorm）、SwiGLU 激活函数、分组查询注意力（GQA），并注明下集展开。\n\n### 5. [low]\n\n- **claim**：本课整体结构（无模块目标映射标注）。\n- **problem**：模块目标 3、4（RoPE/RMSNorm/SwiGLU/GQA、为什么主流是 decoder-only）全部落在下集，本集只覆盖目标 1、2；讲义没有显式标出「本集对应哪几条目标」，学生无法对号入座确认覆盖与缺口。\n- **fix**：在课前自测开头或「下一步」处加一行目标映射，如「本集覆盖模块目标 1–2（attention 在做什么 / 公式逐项）；目标 3–4 由下集覆盖」。\n\n### 6. [low]\n\n- **claim**：定义：把 Q、K、V 各切成 h 份，每份 d_model/h 维，独立做 scaled dot-product attention，h 个输出拼接后经 W^O 投影。\n- **problem**：与紧接的公式（每头分别乘 W_i^Q/W_i^K/W_i^V）表述不一致：论文做法是每头用自己的一套投影矩阵投到 d_k = d_v = d_model/h，「切成 h 份」只是等价简化的说法；直接说「切」容易让初学者误以为多头是无参数的切片操作。\n- **fix**：改为「每头用一套小投影矩阵把 Q/K/V 投成 d_model/h 维再独立做 attention（等价于把一个大头切成 h 个小头）」，与公式对齐。\n", "term_count": 13, "source_count": 7, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-nn-basics-2", "date": "2026-11-03", "title": "第 2 课 · 反向传播与优化器", "main_thread": "解释反向传播为什么就是链式法则在计算图上的反向应用 · 画出一个两层网络的反向传播数据流，覆盖每个参数的分支 · 说出 Adam 相比 SGD 改进的两点：每参数自适应步长、对梯度尺度不敏感", "domain": "基础", "module": "反向传播与优化器", "module_id": "nn-basics-2", "lesson_no": 2, "tags": ["反向传播", "链式法则", "梯度下降", "优化器", "Adam", "深度学习基础"], "markdown": "# 第 2 课 · 反向传播与优化器\n\n> 学完今天，你能：\n> 1. 解释反向传播为什么就是链式法则在计算图上的反向应用；\n> 2. 画出一个两层网络的反向传播数据流，覆盖每个参数的分支；\n> 3. 说出 Adam 相比 SGD 改进的两点：每参数自适应步长、对梯度尺度不敏感。\n\n## 课前自测\n\n1. 网络真正「学习」的是什么量？\n2. f(x)=g(h(x))，f 对 x 的导数怎么写？\n3. 梯度下降为什么沿负梯度方向走？\n4. Adam 比朴素 SGD 多维护了什么？\n\n## 为什么需要它\n\n第 1 课讲过：前向传播把输入逐层变换为输出，损失函数——一个标量（单个数值）——衡量输出与目标的差距。但只算差距不够：得知道每个参数各该为差距负多少责。反向传播负责「算账」：用链式法则把损失对每个参数的梯度一次算清；优化器负责「行动」：按梯度决定每个参数改多少。两者合起来才是完整的「学习」闭环。\n\n这有一层直接意义：在昇腾 NPU 上用 vLLM 跑推理时，只做前向、权重只读、不做反向传播——这是推理比训练便宜的原因之一；一旦微调，反向传播与优化器的选择直接决定训练耗时与效果。只会调框架接口的话，这一课让你看得懂 loss.backward() 到底发生了什么。一句话记住：训练每步一次前向加一次反向，推理只有前向，所以任何硬件上训练都比推理慢，NPU 也不例外。\n\n## 核心概念\n\n先理清关系：链式法则是数学工具；反向传播是把它套到网络上的算法；梯度是它算出的结果；优化器消费梯度；参数更新是最后一步。\n\n### 链式法则\n\n定义：复合函数求导规则。若 L 是 y 的函数、y 是 x 的函数，则 ∂L/∂x = ∂L/∂y·∂y/∂x，多层复合逐层连乘。∂L/∂x 读作「L 对 x 的偏导数」：把其它变量当常数、只对 x 求导；L 同时依赖多个量，所以用 ∂ 而不用 d。\n\n直觉：误差像水流过一串管道，每节被该节的「放大倍数」（局部导数）缩放一次，总效果是各节倍数之积。\n\n机制：前向时存下每层中间值，反向时从末层起逐层相乘，每层只算自己的局部导数。\n\n### 反向传播\n\n定义：在前向计算图上，从损失出发、沿与计算相反的方向，用链式法则逐层求出每个参数梯度的算法。\n\n直觉：传话游戏倒着玩——最后一人知道自己差多少，把「误差」按每人贡献比例逐级往回传。\n\n机制：先做前向并缓存中间值（加权和 z、激活输出 a），再从输出端算 ∂L/∂输出，逐层乘本层局部导数（乘权重、乘激活函数导数），累加到对应参数的梯度缓存（.grad）上——同一参数被多条路径使用时各路径梯度相加，但参数值此刻不被修改。框架里 loss.backward() 做的自动微分（框架按计算图自动求导）就是这个流程。每个神经元只做两件事：算自己的局部导数，把上游误差传下去。\n\n### 梯度\n\n定义：损失对各参数求偏导组成的向量，指向损失上升最快的方向。\n\n直觉：站在山上，梯度是脚下最陡的上坡方向；想下山就走它的反方向。\n\n机制：每个分量回答「这个参数变一点点，损失变多少」。例如某分量是 3，参数加 0.01，损失约增 0.03；一次反向传播算齐全部分量。\n\n### SGD / Momentum / Adam\n\n定义：三种最常用的参数更新规则，统称优化器。\n\n- SGD（随机梯度下降）：θ←θ−α·g。用小批量（随机抽的一批样本）估计梯度 g，α 是学习率（步长系数）。\n- Momentum：给更新加惯性。v←β·v+g，θ←θ−α·v，β 常取 0.9：一致方向加速、来回抖动被抵消。\n- Adam：维护梯度的一阶矩 m 与二阶矩 v——一阶矩≈梯度的滑动平均（反映方向/趋势），二阶矩≈梯度平方的滑动平均（反映幅度/波动）：m←β₁m+(1−β₁)g，v←β₂v+(1−β₂)g²；偏置修正（除以 1−βᵗ，抵消从 0 起步的偏差）后 θ←θ−α·m̂/(√v̂+ε)，ε 防除零，默认 10⁻⁸。\n\n直觉：SGD 是每次按当前地形迈固定一步；Momentum 是滚下山的小球；Adam 给每个参数配「自动档」：梯度大就缩小步长、梯度小就放大步长。\n\n机制：Adam 的 m̂/√v̂ 把梯度按自身历史幅度归一化；当梯度幅度大致稳定时 m̂/√v̂≈1，每个参数的更新幅度被约束在 α 的量级——这正是它相比 SGD 的改进：每参数自适应步长、对梯度尺度不敏感。\n\n### 参数更新\n\n定义：把优化器算出的更新量写回参数：θ←θ+Δθ。\n\n直觉：下完一盘棋，按复盘结论调整策略权重。\n\n机制：每批数据重复一轮：前向 → 算损失 → 反向求梯度 → 优化器算 Δθ → 更新参数。「训练」就是这五步循环几十万次。\n\n## 一步一步理解\n\n两层网络：输入 x=1，目标 y=0；隐层一个神经元 z₁=w₁x+b₁，激活 ReLU（输出 max(0,z)）；输出层线性 ŷ=w₂a₁+b₂；损失 L=½(ŷ−y)²。初始 w₁=2，b₁=−1，w₂=1，b₂=0。\n\n前向：z₁=2×1−1=1；a₁=ReLU(1)=1；ŷ=1；L=½(1−0)²=0.5。\n\n反向（从右往左，每步是链式法则的一环）：\n1. ∂L/∂ŷ = ŷ−y = 1\n2. ∂L/∂w₂ = ∂L/∂ŷ·∂ŷ/∂w₂ = 1×a₁ = 1；∂L/∂b₂ = 1\n3. ∂L/∂a₁ = ∂L/∂ŷ·∂ŷ/∂a₁ = 1×w₂ = 1\n4. ∂L/∂z₁ = ∂L/∂a₁·ReLU′(z₁) = 1（z₁>0）\n5. ∂L/∂w₁ = ∂L/∂z₁·∂z₁/∂w₁ = 1×x = 1；∂L/∂b₁ = 1\n\n反向数据流（每个分叉点分出对应分支）：\n\n```\nL → ∂L/∂ŷ ─┬─ ×a₁ ───────────→ ∂L/∂w₂\n           ├─ ×1 ────────────→ ∂L/∂b₂\n           └─ ×w₂ → ∂L/∂a₁ ─ ×ReLU′ → ∂L/∂z₁ ─┬─ ×x → ∂L/∂w₁\n                                               └─ ×1 → ∂L/∂b₁\n```\n\nSGD 更新，α=0.1：w₁=1.9，b₁=−1.1，w₂=0.9，b₂=−0.1。再前向验证：z₁=0.8，a₁=0.8，ŷ=0.9×0.8−0.1=0.62，L≈0.19<0.5，损失确实变小。\n\n换 Adam 更新 w₂（g=1，β₁=0.9，β₂=0.999，第一步 t=1）：m=0.1，v=0.001；修正后 m̂=0.1/(1−0.9)=1，v̂=0.001/(1−0.999)=1；更新量=−0.1×1/(1+10⁻⁸)≈−0.1。若某参数梯度为 0.01，第一步的 m̂/√v̂ 仍是 1，更新仍≈0.1——这就是「对梯度尺度不敏感」的来源。该性质只在梯度幅度大致稳定时成立：若相邻两步梯度从 100 骤降到 0.01，第二步 m̂/√v̂≈0.67，更新会明显小于 α。\n\n## 常见误区\n\n1. 「反向传播会自动找最优参数。」错：它只做一次精确的「按贡献记账」，算出当前位置的梯度；往哪走、走多远由优化器决定，能否到达最优解由整个训练过程决定。\n2. 「梯度为 0 就说明训练好了。」错：可能停在鞍点（梯度为零但不是最低点的位置）或平坦区，也可能是 ReLU 死区（z₁≤0 时 ReLU′=0，该神经元从此收不到梯度）。要看损失曲线与验证集指标。\n3. 「Adam 一定比 SGD 好。」错：Adam 收敛通常更快、对学习率相对不敏感（仍需选择，常以 1e-3 起步，微调时更小），但带 Momentum 的 SGD 在部分任务上泛化（在新数据上的表现）更好。没有绝对最优。\n4. 「优化器配置越花哨越好。」错：多数任务用 SGD 或 Adam 的默认超参（需人预先设置的量，如学习率）、配一个合适的学习率就能跑通；先跑通基线，再谈调参。\n\n## 一句话总结\n\n反向传播 = 链式法则在计算图上的反向应用，一次算出全部参数的梯度；优化器决定怎么用梯度更新参数——先有梯度，才有更新。\n\n## 自测题\n\n### 1. 反向传播和链式法则是什么关系？为什么一次反向能算完所有参数的梯度？\n\n<details><summary>查看答案<\/summary>反向传播就是把链式法则套到前向计算图上：从损失出发，沿计算反方向逐层乘局部导数。每个参数的梯度对应图上路径的连乘，中间量（如 ∂L/∂a₁）可被多条路径复用，所以一次反向就能算完全部参数的梯度。<\/details>\n\n### 2. 画出本课两层网络的反向数据流：∂L/∂ŷ 与 ∂L/∂z₁ 各分出哪些分支？\n\n<details><summary>查看答案<\/summary>L → ∂L/∂ŷ，在此分叉：×a₁→∂L/∂w₂、×1→∂L/∂b₂，主干继续 ×w₂→∂L/∂a₁→×ReLU′→∂L/∂z₁；∂L/∂z₁ 再分叉：×x→∂L/∂w₁、×1→∂L/∂b₁。规律：权重梯度乘该连接的输入（∂ŷ/∂w₂=a₁，∂z₁/∂w₁=x），偏置梯度乘 1（∂ŷ/∂b₂=∂z₁/∂b₁=1）。<\/details>\n\n### 3. SGD、Momentum、Adam 的更新公式各是什么？Adam 相比 SGD 改进了什么？\n\n<details><summary>查看答案<\/summary>SGD：θ←θ−α·g，只用当前梯度。Momentum：v←β·v+g，θ←θ−α·v，用历史梯度滑动平均加惯性，一致方向加速、抖动抵消。Adam：m←β₁m+(1−β₁)g，v←β₂v+(1−β₂)g²，偏置修正后 θ←θ−α·m̂/(√v̂+ε)。改进：m̂/√v̂ 按梯度自身历史幅度归一化，梯度大小不同仍得到幅度相近（α 量级）的更新——每参数自适应步长、对梯度尺度不敏感。<\/details>\n\n### 4. 梯度分量为 0，能说明训练完成吗？举两个反例。\n\n<details><summary>查看答案<\/summary>不能。反例一：鞍点——梯度为零但不是最低点的位置，沿某个方向损失还能继续下降。反例二：ReLU 死区——z≤0 时 ReLU′=0，该神经元从此收不到梯度、不再更新，但整个网络未必训练好。判断依据是损失曲线与验证集指标，而非单点梯度是否为零。<\/details>\n\n### 5. 「反向传播会修改参数」错在哪？完整的一步训练是哪五步？\n\n<details><summary>查看答案<\/summary>反向传播只把各路径的梯度累加写入参数的梯度缓存（.grad），参数值此刻不被修改；真正改参数的是优化器：算出更新量 Δθ 后执行 θ←θ+Δθ。完整一步：前向 → 算损失 → 反向求梯度 → 优化器算 Δθ → 更新参数。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| 前向传播 | 输入逐层加权求和与激活变换得到输出、进而算出损失 |\n| 损失函数 | 衡量输出与目标差距的标量函数，训练目标是让它变小 |\n| 链式法则 | 复合函数求导规则：外层导数乘内层导数，多层连乘 |\n| 梯度 | 损失对各参数偏导组成的向量，指向上升最快的方向 |\n| 反向传播 | 沿计算图反向用链式法则逐层求每个参数梯度的算法 |\n| 学习率 | 更新步长系数 α：太大震荡、太小收敛慢 |\n| SGD | 随机梯度下降：用小批量样本估计梯度，θ←θ−α·g |\n| Momentum | 更新加惯性（历史梯度滑动平均），一致方向加速 |\n| Adam | 按梯度一阶矩/二阶矩归一化，每参数各有自适应步长 |\n| 参数更新 | 执行 θ←θ+Δθ 的步骤，是「学习」的实际落点 |\n\n## 下一步\n\n第 3 课进入 Transformer 与 decoder-only 范式：自注意力让每个 token 直接看到其它 token，decoder-only（只用解码器架构）成为主流 LLM 的骨架。\n\n## 来源\n\n1. [3Blue1Brown《反向传播微积分》](https://www.3blue1brown.com/lessons/backpropagation)\n2. [《深度学习》第 6.5 节](https://www.deeplearningbook.org/contents/mlp.html)\n3. [Karpathy micrograd](https://github.com/karpathy/micrograd)\n4. [Kingma & Ba《Adam》](https://arxiv.org/abs/1412.6980)\n5. [PyTorch 文档 torch.optim](https://docs.pytorch.org/docs/stable/optim.html)\n6. [vllm-ascend 昇腾插件](https://github.com/vllm-project/vllm-ascend)", "review_md": "# 审校记录 · 2026-11-03-nn-basics-2\n\n- date: 2026-11-03\n- module_id: nn-basics-2\n- module: 反向传播与优化器\n\nverdict: revise\n\nsummary: 数学层面全部核实通过：前向（z₁=1、a₁=1、ŷ=1、L=0.5）、5 步梯度、SGD 更新（w₁=1.9、b₁=−1.1、w₂=0.9、b₂=−0.1）与再前向验证（z₁=0.8、ŷ=0.62、L≈0.19）以及 Adam 第 1 步手算（m=0.1、v=0.001、m̂=v̂=1、更新量≈−0.1）逐个数重算均正确；8 项教学结构（自测/概念/例子/误区/总结/术语卡/下一步/来源）齐全；三个模块目标均有覆盖。无 high 级概念错误。主要问题是初学者友好度与几处过度断言：∂ 偏导记号与「一阶矩/二阶矩」从未解释、反向数据流只画了单链缺三个分支、个别措辞把「算梯度」和「改参数」混在一起、Adam「对学习率不敏感」等表述需要加限定。建议按 medium 项修改后再使用。\n\n## issues\n\n### 1\n\n- severity: medium\n- claim: 「反向数据流：L → ∂L/∂ŷ → ×w₂ → ∂L/∂a₁ → ×ReLU′ → ∂L/∂z₁ → ×x → ∂L/∂w₁」\n- problem: 只画了通往 w₁ 的一条单链，漏掉了 ∂L/∂w₂、∂L/∂b₂、∂L/∂b₁ 三个分支，与上方已算出的 4 个参数梯度不一致；模块目标要求「能画出一个两层网络的反向传播数据流」，学生照此临摹会漏掉一半梯度。\n- fix: 补成分支图：∂L/∂ŷ 分出「×a₁→∂L/∂w₂」和「×1→∂L/∂b₂」两条支线并继续「×w₂→∂L/∂a₁」；∂L/∂z₁ 再分出「×x→∂L/∂w₁」和「×1→∂L/∂b₁」。\n\n### 2\n\n- severity: medium\n- claim: 「梯度的一阶矩与二阶矩」「维护梯度的一阶矩 m 与二阶矩 v」\n- problem: 「矩」是统计术语，在课前自测答案、Adam 定义和术语卡中出现三次却从未解释；基础较弱的工程师只能死记名词，无法对应到公式。\n- fix: 首次出现时补一句：一阶矩≈梯度的滑动平均（反映方向/趋势），二阶矩≈梯度平方的滑动平均（反映幅度/波动），并指出正因如此 m̂/√v̂ 才有归一化作用。\n\n### 3\n\n- severity: medium\n- claim: 正文从课前自测的 f′=g′·h′ 记法直接跳到 ∂L/∂x=∂L/∂y·∂y/∂x\n- problem: 偏导数概念与 ∂ 符号从未引入；没学过偏导的读者面对链式法则公式和后续全部推导会完全卡壳。\n- fix: 在链式法则小节开头加一句：「∂L/∂x 读作 L 对 x 的偏导数：把其它变量当常数、只对 x 求导；因为 L 同时依赖多个量，所以用 ∂ 而不用 d」。\n\n### 4\n\n- severity: medium\n- claim: 「逐层乘本层局部导数……累加到对应参数上」\n- problem: 「累加到参数上」容易被初学者读成反向传播在修改参数，与本课自己强调的「反向只算账、优化器才行动」以及「参数更新是最后一步」矛盾；精确语义是写入参数的 .grad 梯度缓存。\n- fix: 改为「累加到参数的梯度缓存（.grad）上——同一参数被多条路径使用时各路径梯度相加，但参数值此刻不被修改」。\n\n### 5\n\n- severity: medium\n- claim: 「Adam 收敛通常更快、对学习率不敏感」\n- problem: 过度断言：Adam 只是比 SGD 对学习率相对不敏感，学习率仍是它最重要的超参之一；且文中随后说「用 Adam 微调大模型也常用更小学习率」，前后口径不一致。\n- fix: 改为「对学习率相对不敏感（仍需选择，常以 1e-3 起步，微调时更小）」。\n\n### 6\n\n- severity: low\n- claim: 「每个参数的更新幅度稳定在 α 附近」\n- problem: 只在梯度幅度恒定（含 t=1 的首次更新）时 m̂/√v̂≈1 才成立；梯度幅度波动时该比值会明显偏离 1（例如 g₁=100、g₂=0.01，t=2 时 m̂/√v̂≈0.67，更新量约为 0.67α 而非 α）。\n- fix: 加限定改为「当梯度幅度大致稳定时 m̂/√v̂≈1，每个参数的更新幅度被约束在 α 的量级」。\n\n### 7\n\n- severity: low\n- claim: 「所以 NPU 上『训练慢、推理快』是常态」\n- problem: 表述暗示这是 NPU 的特性；实际上训练含前向+反向+更新、计算量必然大于纯前向的推理，在任何硬件上都成立，NPU 只是把两者都加速。\n- fix: 改为「任何硬件上训练都比推理慢，NPU 也不例外」或直接删去「NPU 上」的限定。\n\n### 8\n\n- severity: low\n- claim: 「损失函数（一个标量）」「默认超参」「自动微分」\n- problem: 标量、超参（超参数）、自动微分三词均为首次出现且无注释，目标读者可能卡壳。\n- fix: 首次出现处各加半句注释：标量（单个数值）、超参（需人预先设置的量，如学习率）、自动微分（框架按计算图自动求导）。\n", "term_count": 10, "source_count": 6, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-nn-basics-1", "date": "2026-11-03", "title": "第 1 课 · 神经网络在算什么", "main_thread": "学完今天，你能手工算出一个两层网络的前向传播结果 · 学完今天，你能说清损失函数到底在衡量什么 · 学完今天，你能解释梯度下降每一步在做什么，以及学习率过大/过小各有什么后果", "domain": "基础", "module": "神经网络前向传播与梯度下降", "module_id": "nn-basics-1", "lesson_no": 1, "tags": ["神经网络", "前向传播", "损失函数", "梯度下降", "激活函数", "学习率"], "markdown": "# 第 1 课 · 神经网络在算什么\n\n> 学完今天，你能：\n> 1. 手工算出一个两层网络的前向传播结果\n> 2. 说清损失函数到底在衡量什么\n> 3. 解释梯度下降每一步在做什么，以及学习率过大/过小各有什么后果\n\n## 课前自测\n\n先不查资料，凭直觉回答（答错没关系，带着问题读正文）：\n1. 一个三层（2 个隐藏层 + 1 个输出层，全课约定输入层不算层）、但没有任何激活函数的网络，能力上等价于什么？\n2. 均方误差为零，说明模型在训练数据上表现如何？这能保证它在新数据上也一样好吗？\n3. 梯度方向是损失上升最快的方向，那更新参数时为什么要「减去」梯度？学习率设得特别大会发生什么？\n\n## 为什么需要它\n\n你每天在昇腾 NPU（神经网络专用处理器）上用 vLLM（大模型推理引擎）跑的服务，本质是每秒做成千上万次前向传播：输入文本，逐层算出下一个词元（token，文本被切分出的最小单位）的概率。这一课把三件事说透：网络在算什么（前向传播）、预测离目标多远怎么量（损失函数）、参数靠什么改（梯度下降）。这是全课程第一块地基：下一课的反向传播，只是把「算梯度」这件事变得高效。\n\n## 核心概念\n\n### 感知机（神经元）\n\n定义：一个神经元接收输入 x₁…xₙ，先加权求和、加偏置，再过激活函数：\n\nz = w₁x₁ + w₂x₂ + … + wₙxₙ + b\ny = f(z)\n\nw 叫权重（weight），b 叫偏置（bias），f 是激活函数。名称来自 1958 年 Rosenblatt 的工作，当时 f 是阶跃函数；今天的神经元沿用同一骨架，只是换了更实用的 f。\n\n直觉：想象评委打分。每个输入是单项成绩，权重是这项的重要性，偏置是评委心里的基础分，z 是加权总分；激活函数决定总分如何变成最终信号。\n\n机制：权重和偏置就是参数，是训练要改的对象。改权重 = 改变某项输入的话语权；改偏置 = 把激活的「分界线」整体平移。真实网络中上亿个神经元同时做这件事，被组织成矩阵乘法。\n\n### 激活函数\n\n定义：施加在加权和 z 上的函数 f。最常用的是 ReLU（Rectified Linear Unit，线性整流单元）：f(z) = max(0, z)，正数原样通过、负数置零。\n\n直觉：线性变换（输出是输入的加权和，最多加个常数）在几何上包括拉伸、旋转、平移等，但直线永远是直线，分界线永远是直的。激活函数给计算加入「弯曲」，像把纸折一下，本来分不开的点就能分开了。\n\n机制（为什么必须有）：先约定符号——ŷ（读作 y-hat）表示模型预测值，y 表示真实目标，戴帽子的都是模型算出来的量。两层不带激活函数的网络 ŷ = W₂(W₁x + b₁) + b₂，展开就是 (W₂W₁)x + (W₂b₁ + b₂)，仍是「加权求和 + 偏置」。线性变换复合线性变换还是线性变换，深度变得毫无意义。非线性能力全部来自激活函数。例如 XOR（异或）问题：四个点用一条直线分不开，但一层带 ReLU 的隐藏层可以。\n\n### 损失函数\n\n定义：把「预测与目标差多远」压缩成一个标量的函数 L(ŷ, y)。训练的目标就是不断调参数把 L 压低。\n\n直觉：考试扣分。目标 y 是标准答案，预测 ŷ 是你的答案，损失是扣了多少分；扣分规则越严，模型越不敢犯大错。\n\n机制：回归任务最常用 MSE（Mean Squared Error，均方误差）：\n\nL = (1/n) Σ (ŷᵢ − yᵢ)²\n\n平方带来两个好性质：大误差惩罚按平方放大（差 2 罚 4，差 10 罚 100），模型被逼着优先消除大误差；且 L ≥ 0，只有全部命中才等于 0。分类任务（含大语言模型预测下一个词）常用交叉熵（度量两个概率分布差多远），第 2、3 课讲。\n\n### 梯度下降与学习率\n\n定义：把 L 对每个参数求偏导（partial derivative，偏导 = 把其他参数当常数、只对其中一个参数求导数，衡量「只动这一个参数时损失怎么变」），所有偏导拼成的向量叫梯度 ∇L。梯度指向损失上升最快的方向；每步沿负梯度方向更新：\n\nθ ← θ − η·∇L(θ)\n\nη 叫学习率（learning rate），决定这一步迈多大。\n\n直觉：蒙眼下山。只能摸到脚下地形的坡度（梯度），就往最陡的下坡方向挪一小步；挪完重新摸，再挪。每一步的方向只是当前位置的局部最陡下坡，不保证全局最优，但小步重复通常能走到谷底附近。\n\n机制（为什么沿负梯度下降）：先用一维例子 L(w) = w²（梯度 2w），从 w = 1 出发：\n\n- η = 0.1：w ← 1 − 0.2 = 0.8，慢慢逼近 0，安全但慢；\n- η = 1：w ← 1 − 2 = −1，下一步又回 1，永远在 ±1 震荡，不收敛；\n- η = 1.5：w ← 1 − 3 = −2，下一步跳到 4，越跳越远，发散。\n\n> 进阶附注（可跳过）：为什么负梯度方向必然降损失？把 L 在当前位置做一阶近似（泰勒展开只留线性项，即用一条切线近似曲线）：L(θ − ηg) ≈ L(θ) − η‖g‖²，其中 ‖g‖² 是梯度这个向量的长度平方，恒 ≥ 0。只要 g ≠ 0 且 η 足够小，第二项恒正，损失必然变小；但一阶近似只在步长小时成立，η 太大就失真——这就是 η = 1.5 发散的原因。\n\n## 一步一步理解\n\n目标：手工算一个两层网络的前向传播加一步梯度更新。约定：输入层不算层（没有参数），「两层」= 1 个隐藏层 + 1 个输出层。\n\n输入 x = (1, 2)，目标 y = 1，激活函数用 ReLU。\n\n第一步，隐藏层两个神经元。\n神经元 1（w = (0.4, −0.3)，b = 0.5）：z₁ = 0.4×1 + (−0.3)×2 + 0.5 = 0.3 → h₁ = max(0, 0.3) = 0.3\n神经元 2（w = (0.8, 0.1)，b = −0.2）：z₂ = 0.8×1 + 0.1×2 + (−0.2) = 0.8 → h₂ = 0.8\n\n第二步，输出层一个神经元（w = (0.7, −0.2)，b = 0.1）：ẑ = 0.7×0.3 + (−0.2)×0.8 + 0.1 = 0.15\n\n第三步，算损失（MSE，单样本）：L = (0.15 − 1)² = 0.7225\n\n第四步，更新一个权重。只看输出层第一个权重 w₀ = 0.7，用链式法则（复合函数求导的连乘规则，下一课细讲）：∂L/∂w₀ = 2(ẑ − y)·h₁ = 2×(−0.85)×0.3 = −0.51。梯度为负 → w₀ 应变大，预测朝 1 靠拢。取 η = 0.1：w₀ ← 0.7 − 0.1×(−0.51) = 0.751\n\n第五步，验证损失变小：新预测 ẑ' = 0.751×0.3 − 0.16 + 0.1 = 0.1653，新损失约 0.697 < 0.7225。✓\n\n两点注意：(1) 真实训练同时更新所有参数，这里只演示一个；(2) 参数上亿时不可能手算梯度——下一课的反向传播用链式法则一次算完。工程上推理只有前向传播、没有损失和梯度：这是推理显存远小于训练显存的原因之一（训练还要存每层中间输出、梯度和优化器状态）。\n\n## 常见误区\n\n误区一：「激活函数的作用是把输出压到 0–1」。纠正：压到 0–1 只是 sigmoid（S 形函数）这类函数的性质，ReLU 输出可以任意大。激活函数真正的作用是引入非线性，没有它网络退化成一层线性变换。\n\n误区二：「没有激活函数，靠堆更多层也能拟合复杂函数」。纠正：多层线性变换复合后仍是线性变换，层数再多只是把同一件事重新编码一遍，表达能力没有增加。\n\n误区三：「学习率越大收敛越快，越大越好」。纠正：学习率要和损失曲面的弯曲程度匹配。太大时一步跨过谷底落到对面更高处，表现是震荡甚至发散（w² 例子 η = 1 永远震荡）。工程上训练日志里 loss（损失）曲线剧烈抖动、或直接变成 NaN（Not a Number，非数），第一时间怀疑学习率过大。\n\n误区四：「训练损失越低越好，压到接近零就成功了」。纠正：损失低只说明模型记住了训练数据；若是死记硬背而没学到规律，遇到新数据反而差，这叫过拟合（overfitting）。评估要看模型在没参与训练的数据上的表现，后面课程专门讲。\n\n## 一句话总结\n\n前向传播算预测，损失函数量差距，梯度下降改参数：「算—量—改」三件事闭环，就是神经网络学习的全部骨架。\n\n## 自测题\n\n### 1. 手工算前向传播\n一个神经元，输入 x = (1, 2)，权重 w = (0.4, −0.3)，偏置 b = 0.5，激活函数 ReLU。算出加权和 z 与输出 h。\n<details><summary>查看答案<\/summary>\n\nz = 0.4×1 + (−0.3)×2 + 0.5 = 0.3；h = f(z) = max(0, 0.3) = 0.3（z > 0，正数原样通过）。\n\n<\/details>\n\n### 2. 损失函数在衡量什么\nMSE 为零说明模型在训练数据上表现如何？能保证新数据也准吗？\n<details><summary>查看答案<\/summary>\n\nMSE = (1/n)Σ(ŷᵢ − yᵢ)² ≥ 0，等于零说明每个预测都和训练目标完全一致，训练误差为零。但不能保证新数据也准：模型可能只是死记硬背训练数据（过拟合），没学到规律，在新数据上反而差。所以评估要看模型在未参与训练的数据上的表现。\n\n<\/details>\n\n### 3. 学习率过大/过小\n在 L(w) = w²（梯度 2w）、从 w = 1 出发的例子中，η = 0.1 / 1 / 1.5 各发生什么？各对应「过大」还是「过小」？\n<details><summary>查看答案<\/summary>\n\nη = 0.1（过小）：w ← 1 − 0.2 = 0.8，逐步逼近 0，安全但慢；η = 1（过大）：w ← 1 − 2 = −1，下一步又回 1，在 ±1 间永远震荡，不收敛；η = 1.5（过大）：w ← 1 − 3 = −2，下一步跳到 4，越跳越远，发散。学习率要和损失曲面的弯曲程度匹配：太大一步跨过谷底，太小进展太慢。\n\n<\/details>\n\n### 4. 无激活函数的网络\n三层网络（2 个隐藏层 + 1 个输出层，输入层不算层）但没有任何激活函数，表达能力上等价于什么？\n<details><summary>查看答案<\/summary>\n\n等价于一层线性变换（加权求和 + 偏置）。线性变换复合线性变换还是线性变换：ŷ = W₂(W₁x + b₁) + b₂ 展开仍是「权重矩阵 × 输入 + 常数」，深度没有带来表达能力提升。非线性能力全部来自激活函数。\n\n<\/details>\n\n### 5. 为什么要「减」梯度\n梯度指向损失上升最快的方向，为什么更新要「减」梯度？用本课手算例子的数字说明。\n<details><summary>查看答案<\/summary>\n\n减梯度 = 沿最陡的下坡方向走。手算例子里 ∂L/∂w₀ = 2(ẑ − y)·h₁ = 2×(−0.85)×0.3 = −0.51 为负，说明 w₀ 增大时损失下降，所以更新要往反方向（增大 w₀）走：w₀ ← 0.7 − 0.1×(−0.51) = 0.751。新预测 ẑ' = 0.1653，新损失约 0.697 < 0.7225，确实变小了。✓\n\n<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| 神经元（感知机） | 把输入加权求和、加偏置、再过激活函数的最小计算单元 |\n| 权重 | 每个输入对神经元输出的影响力系数，训练要更新的参数 |\n| 偏置 | 不依赖输入的常数项，把激活的分界线整体平移 |\n| 激活函数 | 施加在加权和上的非线性函数，非线性能力的唯一来源 |\n| ReLU | 线性整流单元 f(z)=max(0,z)：正数通过、负数置零，计算便宜、应用最广 |\n| 前向传播 | 输入从输入层逐层算到输出层、得到预测值的过程 |\n| 隐藏层 | 输入层与输出层之间的层，把原始输入变换成更有用的表示 |\n| 损失函数 | 把预测与目标的差距压缩成一个标量，训练目标是压低它 |\n| MSE | 均方误差，误差平方的平均；平方让大误差受更重的惩罚 |\n| 梯度 | 损失对每个参数求偏导得到的向量，指向损失上升最快的方向 |\n| 梯度下降 | 沿负梯度方向、以学习率为步长反复更新参数的算法 |\n| 学习率 | 每步沿负梯度方向迈出的步长，过大震荡、过小太慢 |\n| 线性变换 | 输出是输入的加权和（可加常数），包括拉伸、旋转、平移等，直线仍是直线 |\n| 过拟合 | 模型死记训练数据、对新数据泛化差的现象 |\n\n## 下一步\n\n下一课《反向传播与优化器》（nn-basics-2）：上亿参数的梯度如何靠链式法则一次算完；SGD（随机梯度下降）、Momentum（动量法）、Adam（一种自适应调整学习率的优化器）这些优化器比朴素梯度下降改进了什么。学有余力可先看来源里的 3Blue1Brown 两集视频。\n\n## 来源\n\n1. 3Blue1Brown《But what is a neural network?》— https://www.youtube.com/watch?v=aircAruvnKk\n2. 3Blue1Brown《Gradient descent, how neural networks learn》— https://www.youtube.com/watch?v=IHZwWFHWa-w\n3. Goodfellow、Bengio、Courville《深度学习》（花书）第 6 章 深度前馈网络 — https://www.deeplearningbook.org/contents/mlp.html\n4. Rosenblatt《The Perceptron: A Probabilistic Model for Information Storage and Organization in the Brain》(1958) — https://doi.org/10.1037/h0042519\n5. PyTorch 官方《Deep Learning with PyTorch: A 60 Minute Blitz》— https://pytorch.org/tutorials/beginner/deep_learning_60min_blitz.html", "review_md": "# 审校记录 · 2026-11-03 · nn-basics-1 · 第 1 课 · 神经网络在算什么\n\n## verdict\n\nrevise\n\n## summary\n\n概念与数学全部核对无误：前向传播手算（z₁=0.3、h₂=0.8、ẑ=0.15、L=0.7225）、梯度 ∂L/∂w₀=2(ẑ−y)h₁=−0.51、更新后 ẑ′=0.1653、L′≈0.697，以及 w² 例子中 η=0.1/1/1.5 三种行为、一阶泰勒式 L(θ−ηg)≈L(θ)−η‖g‖²、XOR 结论、Rosenblatt 1958、来源 URL/DOI 均正确，无 high 级概念错误。主要问题是：结构上缺课后自测题（只有课前自测且答案在文末），以及若干对基础较弱读者未解释就使用的数学术语与符号（偏导、‖g‖²、泰勒一阶近似、ŷ/ẑ、Adam、层数口径），另有两处表述可打磨。\n\n## issues\n\n### 1\n\n- **severity**: medium\n-
