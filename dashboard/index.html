讲 · 2026-11-03\n\n> 本轮四课：第 1 课 · 神经网络在算什么、第 2 课 · 反向传播与优化器、第 3 课 · Transformer 与 decoder-only 范式（上）、第 4 课 · Transformer 与 decoder-only 范式（下）\n\n## 一张图串起来\n\n前两课讲「怎么学」，后两课讲「学的是什么结构」，接起来是一条闭环：\n\n```\ntoken → embedding → ┌ 一层 decoder（重复 N 次）─────────────────┐\n                    │ 归一化 → 因果注意力(Q,K,V + RoPE) → 残差    │\n                    │        → 归一化 → SwiGLU 前馈      → 残差    │\n                    └───────────────────────────────────────────┘\n                    → 输出头 → softmax → 下一个 token 的概率\n                    → 交叉熵 → 损失 L          【第 1 课：量差距】\n                    → 链式法则反向            【第 2 课：算梯度】\n                    → SGD / Momentum / Adam   【第 2 课：改参数】\n                    → 新的 W_Q、W_K、W_V、γ、W_gate… ┘ 回到最左边\n```\n\n依赖是逐层加码的：\n\n- **第 1 课**给出最小闭环「算—量—改」，并定义了后面所有零件：线性层 `z=Wx+b`、ReLU、softmax、梯度、学习率。\n- **第 2 课**把「手算一个参数的偏导」升级成「一次反向算完全部梯度」，再补上优化器。第 1 课是单参数手工作坊，第 2 课是上亿参数流水线。\n- **第 3 课**把抽象的「层」换成 Transformer 层：注意力用 `softmax(QKᵀ/√d_k)V` 一步重排全序列，多头给多个视角，残差让深层训得动——用的全是前两课的工具。\n- **第 4 课**把骨架打磨成能训、能部署的形状：RoPE 补位置、RMSNorm 补稳定、SwiGLU 补表达、GQA 补成本，收敛到 decoder-only + KV cache。\n\n一句话的因果链：**没有激活函数就退化成线性 → 要有非线性；有非线性才谈梯度 → 所以有反向传播；会反向才能训深 → 所以有残差；能训深才堆得出 Transformer；一上线成本成为新问题 → 所以有 GQA 与 KV cache。**\n\n## 模块速览表\n\n| 课 | 一句话核心 | 关键公式/概念 | 与其他课的关系 |\n| --- | --- | --- | --- |\n| 1 · 神经网络在算什么 | 前向算预测、损失量差距、梯度下降改参数 | `z=Wx+b`、`h=ReLU(z)`；`L=(1/n)Σ(ŷ−y)²`；`θ←θ−η∇L` | 定义全书最小学习闭环；给第 2 课提供「要算的梯度」，给第 3、4 课提供线性层、ReLU、softmax |\n| 2 · 反向传播与优化器 | 反向传播 = 链式法则在计算图上的反向应用，一次算全梯度；优化器决定怎么用 | `∂L/∂x=∂L/∂y·∂y/∂x`；SGD `θ←θ−αg`；Momentum `v←βv+g`；Adam `m̂/√v̂` | 把第 1 课的手算变成自动化；五步循环是「算—量—改」的工程版 |\n| 3 · Transformer（上） | 用「打分—归一—加权」的注意力取代 RNN 串行传递，每个 token 一步看到全体 | `Attention=softmax(QKᵀ/√d_k)V`；`Concat(head₁…head_h)W^O`；`F(x)+x` | 复用第 1 课的线性层与 softmax；残差为何训得动要用第 2 课链式法则解释 |\n| 4 · Transformer（下） | 用 RoPE/RMSNorm/SwiGLU/GQA 补齐位置、稳定、质量、成本 | RoPE 旋转 `mθ`；`x/RMS(x)·γ`；`(Swish(xW_g)⊙xW_u)W_d`；`KV≈2·层数·n_kv·head_dim·L·字节·batch` | 复用第 3 课的注意力与残差；KV cache 是第 1 课「推理只有前向」的显存后果 |\n\n## 综合自测\n\n### 1. 推理显存远小于训练显存，但推理又有个 KV cache 吃掉一大块——矛盾吗？\n\n<details><summary>查看答案<\/summary>\n\n不矛盾，是两类不同开销。训练除参数外还要存每层中间激活（前向缓存给反向用）、每个参数的梯度、以及优化器状态（Adam 的一阶矩 m 和二阶矩 v）——常是权重十几倍量级。推理权重只读、只做前向，没有激活缓存、梯度、优化器状态，多出来的是「不重算历史 K/V」的 KV cache。\n\n所以：训练多出来的开销是为了**改参数**，KV cache 是为了**省重算**。后者随序列长与 batch 线性长，长上下文时会变成主项。\n\n<\/details>\n\n### 2. 设 `L=½(ŷ−y)²`、`ŷ=w·a`，当前 `ŷ=0.9`、`y=1`、`a>0`。`w` 该变大还是变小？学习率特别大会怎样？\n\n<details><summary>查看答案<\/summary>\n\n`∂L/∂ŷ = ŷ−y = −0.1`，`∂L/∂w = −0.1·a < 0`。梯度为负 = 增大 w 会让损失下降，所以 `w ← w − η·(负数)` 使 w **变大**，预测从 0.9 朝 1 靠。\n\n学习率过大的后果见第 1 课的 `L(w)=w²`：一步跨过谷底落到对面更高处，在最优值两侧震荡；再大就发散，loss 剧烈抖动或直接 NaN。注意每步只沿当前点的局部最陡方向，不保证一步到位。\n\n<\/details>\n\n### 3. `√d_k` 缩放、学习率过大、softmax 饱和，是同一类问题吗？\n\n<details><summary>查看答案<\/summary>\n\n是同一类：都是「尺度没匹配」导致训练不稳，症状都从 loss 曲线上读。\n\n- `√d_k`：q、k 各维独立且均值 0 方差 1 时，点积方差是 d_k。d_k 越大分数越极端，softmax 进饱和区（近 one-hot），该处梯度近 0、学不动。除以 `√d_k` 把方差拉回 1。\n- 学习率过大：一阶近似 `L(θ−ηg) ≈ L(θ) − η‖g‖²` 只在步长小时成立，η 太大越过有效区间。\n\n区别：`√d_k` 是写进架构的固定设计，η 是可调超参。病根相同——数值尺度失控。\n\n<\/details>\n\n### 4. 残差 `F(x)+x` 为什么让深层网络训得动？用链式法则写出来。\n\n<details><summary>查看答案<\/summary>\n\n设 `y = x + F(x)`，则 `∂y/∂x = 1 + ∂F/∂x`。反向时上游梯度乘这个因子往回传，关键就是常数 1：即使 `∂F/∂x` 接近 0，总梯度也不会被衰减成 0，能原样穿回浅层。对比 RNN 的隐藏状态连乘，每环都小于 1，乘几十上百次就消失。\n\n额外保险：F 没学好（`F(x)=0`）时层输出仍等于输入，网络不会立刻崩。Transformer 每个子层都是「`F(x)+x` → 归一化」。\n\n<\/details>\n\n### 5. 一层 decoder 里的非线性来自哪几处？把激活都换成恒等会怎样？\n\n<details><summary>查看答案<\/summary>\n\n主要两处：注意力的 **softmax**（把任意实数分数变成非负、和为 1 的权重）和前馈层的 **Swish / ReLU**（`Swish(z)=z·σ(z)`）。RMSNorm 的除法严格说也非线性，但它的职责是压尺度，不承担表达力。\n\n若全换成恒等：一层只剩矩阵乘与加法，复合后仍是线性变换，堆 100 层等于堆 1 层，深度失去意义。\n\n补一句：SwiGLU 的逐元素乘 `⊙` 本身也带来非线性，所以门控结构不完全依赖 Swish；但少了 Swish 就丢掉负值区的小梯度，优化更差。\n\n<\/details>\n\n### 6. 配置：80 层、64 个 Q 头、8 组 KV、head_dim=128、fp16，序列 4096、batch=1。KV cache 多大？若用 64 组 KV 的 MHA 呢？\n\n<details><summary>查看答案<\/summary>\n\n公式：`2 × 层数 × n_kv_heads × head_dim × 序列长 × 字节数 × batch`。\n\n代入 `2×80×8×128×4096×2×1` ≈ **1.3 GB**。换成 MHA（`n_kv_heads=64`，8 倍）≈ **10.7 GB**。\n\n省下的 9 GB 多可换更大 batch 或更长上下文——这正是 GQA 的意义：Q 头数不变（表达不变），只把 KV 份数从 `n_heads` 降到 `g`，缓存缩到 `n_heads/g`。另注意 `num_key_value_heads` 由权重决定、写在配置里，运行时改不了，规划 NPU 显存要按它算。\n\n<\/details>\n\n### 7. decode 阶段为什么合并三个线性层为一次 GEMM、并尽量不让 (n,n) 分数矩阵写回显存？这与 KV cache 同一动机吗？\n\n<details><summary>查看答案<\/summary>\n\n同源但不相同，都围绕带宽。decode 每步只进 1 个新 token，算术量很小，却要把整个 KV cache 读一遍——访存受限，卡在带宽而非算力。合并 GEMM 减少 kernel 启动与重复访存；融合算子让分数矩阵不落地，少一次写回再读出。\n\nKV cache 省的是**重算**（不缓存则每步重算历史 K/V，计算量随序列长平方增长），算子融合省的是**搬运**。两者都在回答：decode 的瓶颈是内存带宽，不是 FLOPs。\n\n<\/details>\n\n### 8. MSE 和交叉熵各适合什么？LLM 为什么用交叉熵？\n\n<details><summary>查看答案<\/summary>\n\nMSE 适合回归：输出连续值，平方让大误差被按平方放大（差 2 罚 4、差 10 罚 100），模型被迫优先消大误差。\n\n交叉熵衡量两个概率分布的差距，适合分类——包括「在词表上分类」的下一个 token 预测：输出头映射到词表维度、softmax 成分布，再与真实 token 的 one-hot 算交叉熵。实操原因是梯度干净：对 logits 的梯度就是「预测概率 − 目标概率」，不会像「MSE + softmax」那样在饱和区梯度趋 0——这和第 3 题是同一件事的两种解法。\n\n<\/details>\n\n## 易混淆对照表\n\n| 容易混的概念 | 区别一句话 |\n| --- | --- |\n| 前向传播 / 反向传播 | 前者算预测，后者算「每个参数该为误差负多少责」；推理只有前者 |\n| 梯度 / 优化器 | 梯度是账本（往哪动、动多少的原始信息），优化器是行动方案（实际动多少） |\n| 反向传播 / 参数更新 | 反向只把梯度累加进 `.grad`，参数值不变；真正改参数的是优化器那步 `θ←θ+Δθ` |\n| 学习率 α / `√d_k` 缩放 | 都是尺度旋钮，但 α 可调，`√d_k` 是写进架构的固定设计 |\n| 激活函数 / 归一化 | 激活提供非线性（深度才有意义），归一化只压尺度，不提供表达力 |\n| 多头注意力 / GQA | 多头是「多个 Q 头各看一个子空间」（影响表达），GQA 是「多 Q 头共用 K/V」（影响显存） |\n| Q 头数 / KV 头数 | Q 头数决定输出维度与表达，KV 头数决定 KV cache 大小 |\n| RoPE / 绝对位置编码 | 前者旋转 Q、K 让分数只依赖相对距离 `m−n`，后者往 embedding 上「加」位置向量 |\n| 残差 / 归一化 | 残差保「信息与梯度的直通路」，归一化保「尺度不失控」，互不替代 |\n| 注意力里的 softmax / 输出层 softmax | 前者在「序列位置」上分配权重，后者在「整个词表」上给每个候选词概率 |\n| 训练损失低 / 模型好 | 损失低只说明记住了训练数据；好不好看它在没参与训练的数据上的表现 |\n| MSE / 交叉熵 | MSE 罚连续值偏差，交叉熵罚分布差距；LLM 用后者 |\n\n## 自查问题\n\n1. 不看笔记，把「token → 预测 → 损失 → 梯度 → 新参数」说一遍，并指出每步对应哪课、哪个公式？（说不全 → 回看第 1 课「核心概念」+ 第 2 课「一步一步理解」的五步循环）\n2. `KV ≈ 2×层数×n_kv_heads×head_dim×序列长×字节数×batch` 每个符号都解释得出吗？GQA 改的是哪项？batch 为什么在里面？（卡住 → 回看第 4 课 GQA 节）\n3. 为什么「`√d_k` 缩放」「学习率过大」「softmax 饱和」是同一类问题？各自症状是什么？（答不上 → 回看第 1 课「梯度下降与学习率」和第 3 课 scaled dot-product attention）\n\n## 下一轮预告\n\n第 2 轮串讲覆盖第 5–8 课，主线是**推理服务基础**：prefill 与 decode 为什么一个算力受限、一个访存受限；KV cache 怎么被 PagedAttention 按页管理起来省碎片；这些如何映射到昇腾 NPU 上 vLLM 的实际参数。\n\n本轮四课会在下一轮以「显存—带宽—吞吐」三个工程量的形式再出现：第 2 课的五步循环解释了训练为什么比推理贵，第 4 课的 KV cache 公式会直接变成 batch 上限的估算式，第 3、4 课注意力的计算量则决定 prefill 耗时。建议收尾前把自测第 6 题的 KV cache 自己在纸上重算一遍——下一轮会从它开始。"}, {"date": "2026-11-03", "round": 2, "title": "第 2 轮串讲 · 2026-11-03", "tags": ["串讲", "复习"], "markdown": "# 第 2 轮串讲 · 2026-11-03\n\n> 本轮四课：第 5 课 · 推理服务基础：prefill/decode 与 KV cache、第 6 课 · vLLM 引擎架构、第 7 课 · 昇腾 NPU 架构与 CANN 生态（上）、第 8 课 · 昇腾 NPU 架构与 CANN 生态（下）\n\n## 一张图串起来\n\n四课是同一个问题的四层：一个 token 怎么又快又便宜地出来。\n\n```text\n请求→API Server(分词)→Engine Core(token 预算+KV 块表)→NPU Worker\n                          ↑______ 每 token 回调度器 ______│\n空间账：KV 池=显存−权重−激活      时间账：prefill 计算受限／decode 带宽受限\nCANN(AscendCL/算子库) → 驱动/固件 → AI Core(Cube 16³) + HBM\n```\n\n因果链这样读：decode 带宽受限（读 14 GB 权重 8.75 ms，算术强度 1 FLOP/字节，平衡点约 188），单请求仅 114 token/s，只能加 batch——8 个请求共用一次读取，吞吐 ×8、延迟不变。可 batch 上限是 KV 显存（每 token 约 512 KB，2048 token 就吃 1 GB，一个 100+200 token 的请求也要 150 MB），于是 PagedAttention 按 16 token 分块省显存；省下来才敢按 token 预算随进随出、长 prompt 切块混批，prefill 吃算力、decode 吃带宽，正好互相填坑。算子落到 AI Core 靠 CANN，融合少写回一次 HBM 就是还回带宽。一句话：**第 5 课定指标，第 6 课把这些指标做成可调的旋钮，第 7、8 课解释旋钮为什么有上限。**\n\n## 模块速览表\n\n| 课 | 一句话核心 | 关键公式/概念 | 与其他课的关系 |\n| --- | --- | --- | --- |\n| 第 5 课 服务基础 | prefill 并行吃 prompt、decode 串行吐 token，KV cache 用显存换重算 | TTFT≈排队+prefill；TPOT≈decode 单步；KV/token/层＝2×头×维×字节 | 给出全部时间账，是后三课的度量语言 |\n| 第 6 课 vLLM 架构 | 页式 KV 池 + token 预算 + 前缀缓存把卡吃满，显式权衡延迟与吞吐 | block=16 token、块表、抢占、`--max-num-batched-tokens` | 把第 5 课概念落成进程与参数 |\n| 第 7 课 昇腾（上） | Cube 一周期 16×16×16 矩阵乘加，带宽才是 decode 天花板 | 4096 MAC；376 TFLOPS／64 GB／约 1.2 TB/s；计算受限 vs 带宽受限 | 给「带宽受限」两个实数 |\n| 第 8 课 昇腾（下） | CANN 是 NPU 的操作系统，瓶颈靠 profiler 定位、靠 batch 化解 | AscendCL／torch-npu／GE+MindRT；算术强度 1 vs 188 | 把 worker 展开成调用栈，让瓶颈可测 |\n\n## 综合自测\n\n### 1. decode 的 batch 从 1 加到 8，为何吞吐约 ×8 而单请求延迟不变？\n<details><summary>查看答案<\/summary>8.75 ms 的权重读取是固定成本：batch=1 只服务 1 个 token（114 token/s），batch=8 时同一遍读取服务 8 个（914 token/s），每人分到的延迟没变。对应 `--max-num-seqs`。但两头封顶：KV 爆了会抢占重算，batch 够大后翻转为计算受限、吞吐趋平——结论只在带宽受限区间成立。<\/details>\n\n### 2. 64 GB 的 910B 跑 7B FP16、显存配额 0.9，KV 池多大、能装几个 2048 token 请求？为何别开到 1.0？\n<details><summary>查看答案<\/summary>配额约 57.6 GB，减权重 14 GB，KV 池约 43 GB（再扣激活更小）；每请求 512 KB×2048≈1 GB，约 40 个并发，是粗算上界。开到 1.0 会挤掉系统缓冲、有 OOM 风险：权重、激活、KV、通信缓冲共用这份配额；且并发还被算力与 `--max-model-len` 约束。<\/details>\n\n### 3. 用户 A 说「首字 3 秒才出来」，B 说「每个字都慢」，各查哪个指标？\n<details><summary>查看答案<\/summary>A 是 TTFT，落在 prefill 与排队：查 prompt 是否过长、是否排长队、prefix caching 是否命中（长系统提示词没命中就每请求重算）。B 是 TPOT，落在 decode 单步：查同批请求数是否过大、带宽是否打满。用 profiler 验：利用率高=算力瓶颈（偏 A），利用率低但拷贝多=带宽瓶颈（偏 B）。<\/details>\n\n### 4. 100 个请求共享 1000 token 系统提示词，prefix caching 省多少？若各自生成 2000 token 还值得开？\n<details><summary>查看答案<\/summary>省约 99 次 prefill：2·N·P≈2×7×10⁹×1000≈1.4×10¹³ FLOP/次，99 次约 1.4×10¹⁵，按 100 TFLOPS 估算约 14 秒。但它只省 prefill 与 KV 内存，不省 decode，每个请求仍要串行生成 2000 token。仍值得开（零成本），只是收益随共享前缀占比上升、随输出长度下降。<\/details>\n\n### 5. chunked prefill 为什么能提升整卡效率？它化解了哪两课的两个瓶颈？\n<details><summary>查看答案<\/summary>它把长 prompt 切块与 decode 同批提交。按第 7 课判据：prefill 的 M 大、计算受限（Cube 忙带宽闲），decode 的 M=1、带宽受限（带宽忙 Cube 闲），混批让两条流水线互相填坑。同时解决第 5 课「长请求卡住整批」：长 prompt 不再独占设备，短请求的 TTFT 不被拖死。<\/details>\n\n### 6. 一次 `torch.mm` 从 Python 到 AI Core 穿过哪几层？报 `CANN not found` 按什么顺序查？\n<details><summary>查看答案<\/summary>`torch.mm`→torch-npu（注册 npu 设备、映射算子）→AscendCL（设备、显存、搬运、执行，角色≈CUDA Runtime）→CANN 算子库（取或现编译二进制）→Runtime→驱动/固件→AI Core。排查自底向上：驱动→CANN→torch-npu；「能 import、一跑就报错」正是下层缺失或版本不配套。注意 MindSpore 不走这条路：它由 CANN 图引擎 GE 编译、自有运行时 MindRT 调度，与 PyTorch 线平级。<\/details>\n\n### 7. 算子融合为什么能提 decode 吞吐？这和算术强度是一件事吗？\n<details><summary>查看答案<\/summary>是一件事的两面。融合让中间结果留在片上 UB（每核约 192 KB）不写回 HBM，省的是字节而不是 FLOP；算术强度＝FLOP÷字节，省了字节就等于抬高算术强度，让 decode 的 1 FLOP/字节更靠近平衡点 188，在带宽受限区间直接换成吞吐。反之若某算子已计算受限（大 batch 的 prefill），融合省带宽的收益就很小——这也解释了为什么第 8 课说融合对 vLLM 尤其重要：主力负载恰好是带宽受限的 decode。<\/details>\n\n### 8. 「把 `--max-num-seqs` 拉到 64，吞吐一定更高」错在哪？抢占与 prefix caching 怎么互相救场？\n<details><summary>查看答案<\/summary>错在忽略两道墙：显存上并发超出 KV 池后调度器频繁抢占，被抢占的请求释放块、回等待队列、重算 prefill，产生重复计算，有效吞吐反而降；延迟上场 batch 越大单步越慢，TPOT 恶化。救场关系：prefix caching 让被抢占的请求重算时可能直接命中前缀、恢复一部分进度；反过来，抢占造成的重算需求也让前缀缓存更值钱。默认策略 FCFS，可用 `--scheduling-policy priority` 按优先级抢占。<\/details>\n\n## 易混淆对照表\n\n| 容易混的概念 | 区别一句话 |\n| --- | --- |\n| prefill vs decode | 一次并行算完 prompt（计算受限）vs 每步只出一个 token（带宽受限）。 |\n| TTFT vs TPOT vs 吞吐 | 首字体感（排队+prefill）／后续字间隔（decode 单步）／系统总产能。 |\n| 计算受限 vs 带宽受限 | 看算术强度到没到「算力÷带宽」平衡点：89 ns 算 vs 28 µs 搬就是带宽受限。 |\n| KV cache vs prefix caching | 自己的历史 K/V vs 跨请求按内容哈希复用相同前缀的块。 |\n| continuous batching vs chunked prefill | 请求级随进随出 vs token 级把长 prompt 切块混批。 |\n| `--max-num-seqs` vs `--max-num-batched-tokens` | 限同批请求数 vs 限每步 token 数，V1 以 token 预算为主。 |\n| `--gpu-memory-utilization` vs KV 池 | 总配额（权重+激活+KV 共用）vs 扣完剩下的那块。 |\n| AIC vs AIV | 带 Cube 的矩阵核 vs 向量核；初代 910 的 Vector 还在 AI Core 内。 |\n| CANN vs AscendCL vs torch-npu | 整套底座 vs 暴露的 C 接口 vs 把 PyTorch 接上去的插件。 |\n\n## 自查问题\n\n1. 手算 7B FP16 的 decode 单请求吞吐上限，说明 batch=8 为何翻 8 倍、这个数离真实整卡吞吐差在哪。卡住回第 7、8 课。\n2. 从 HTTP 到首个 token 的 5 个环节，采样与调度各在哪个进程；V1 与 V0 调度差在哪。卡住回第 6 课。\n3. 默画 CANN 层次图、标出 torch-npu 与 MindSpore 的分叉；再用 msprof 三指标判瓶颈。卡住回第 8 课。\n\n## 下一轮预告\n\n第 9 课《昇腾上的 vLLM：vllm-ascend 部署与调优》把本轮的账落成真实部署：插件接管 NPU 后端、HCCL 多卡与 `--tensor-parallel-size`、continuous batching 与 KV cache 如何决定吞吐、拿到 profiler 结论后调哪个参数。带三问进课：TP 切分后每卡 KV 池怎么变？`--max-num-batched-tokens` 调大对 TTFT、TPOT 各是什么方向？利用率低时改 batch 还是改算子？第 3 轮串讲会把第 5–9 课合成一棵调参决策树。"}, {"date": "2026-11-03", "round": 3, "title": "第 3 轮串讲 · 2026-11-03", "tags": ["串讲", "复习"], "markdown": "# 第 3 轮串讲 · 2026-11-03\n\n> 本轮四课：第 9 课 · 昇腾上的 vLLM：vllm-ascend 部署与调优（上）、第 10 课 · 昇腾上的 vLLM：vllm-ascend 部署与调优（下）、第 11 课 · 量化与编译基础、第 12 课 · 投机解码\n\n## 一张图串起来\n\n四课是同一本账的四个动作：**先算账、再测准、最后从三个位置把账砍下去**。\n\n```text\n              一个 token 的账（第 5–8 课留下的老账）\n     一步耗时 ≈ (权重字节 + KV 字节) ÷ HBM 带宽      ← decode 天生带宽受限\n                              │\n     ┌────────────────────────┼─────────────────────────┐\n  ①先能跑                  ②先测准                  ③再省字节/次数/摊薄\n  第 9 课                  第 10 课                 第 11、12 课\n  vllm-ascend              profiler 两步            量化    编译/融合   投机\n  CANN→torch-npu→插件      算子级 vs 调度级         ÷2÷4   少往返      K+1 个\n  版本矩阵整行锁           三步定位法              省带宽  省带宽      摊薄带宽\n```\n\n因果链这样读。\n\n**① 能不能跑。** 原生 vLLM 没有昇腾后端，它不认识 `npu`、也不会为 NPU 编译 kernel——缺的不是加速包，而是**设备后端**；由 vllm-ascend 通过 entry point 注册进 `vllm.platform_plugins` 接管，压在 CANN 与 torch-npu 之上，三层版本必须整行锁。这一课顺手给出**第一个数**：Qwen3-0.6B 每 token KV 114,688 B（≈112 KiB），64 GB 卡 4096 上下文装 114 条，32768 只剩 14 条。\n\n**② 是不是真在 NPU 上、快不快。** 能跑通不等于算子在昇腾上：fallback 有组合重写（一个拆成五个，仍在 NPU、正确但慢）和直接 `NotImplementedError`，torch-npu **不会**悄悄搬 CPU 替算。只能靠 profiler：算子级看 `kernel_details.csv`，服务级看 `batch.csv`。这一课把 decode 一步拆成四笔账——权重 16 GB÷1.6 TB/s = 10 ms、每 token KV 144 KB、算力 0.213 ms、通信 72×30 μs ≈ 2.2 ms——并给出**第二个数**：拐点 B\\*≈47，只在 512 token 这种短上下文成立；8k 时 KV（38 GB）反超权重（16 GB），一步下界 34 ms，加并发就直接涨时间。\n\n**③ 三个位置砍同一本账。** 第 11 课动**分子**：量化把字节减半（7B：14 → 7 → 3.5 GB），融合与编译省**往返**（少启动 kernel、中间张量留片上不写回 HBM），都在治访存浪费。第 12 课动**每次读取的产出**：K 个草稿接在前缀后，因果掩码让一次前向得出 K+1 组分布，一次读取服务最多 K+1 个 token，拒绝采样保证分布不变。\n\n暗线：第 10 课的 B\\* 与第 12 课的保本 `L > 1+K·c_d/c_t` 都是**平衡点**——一个问「加 batch 还赚不赚」，一个问「加草稿还赚不赚」，都不许背常数，要用实测效率项代进去重算。而第 11 课的量化减小 c_t，正好把投机的门槛抬高（见自测 4、5 题）。\n\n## 模块速览表\n\n| 课 | 一句话核心 | 关键公式/概念 | 与其他课的关系 |\n| --- | --- | --- | --- |\n| 第 9 课 vllm-ascend（上） | 插件把 vLLM 的设备抽象层实现到 NPU，版本必须整行锁 | 三层栈；KV/token = 2×8×128×2 B×28 = 114,688 B；并发 = 53.6 GB ÷ 单条 KV | 给出本轮所有算账的起点 |\n| 第 10 课 vllm-ascend（下） | 性能八成取决于算子融合、精度路径、有没有 profiler 归因 | T_mem=(权重+KV)÷带宽；B\\*≈235×MFU≈47（带宽 70% 时约 67）；TP=4 仅约 2.1× | 把第 9 课从「能不能装」升级成「堵在哪」 |\n| 第 11 课 量化与编译 | 量化赢在带宽（少字节），编译赢在开销（少往返） | q=round(x/s)+z；AWQ/GPTQ/SmoothQuant；PTQ vs QAT；融合省 HBM 往返 | 直接改第 10 课四笔账的第一笔 |\n| 第 12 课 投机解码 | 一次读取摊到 K+1 个 token，草稿够便宜才净赚 | L=1+Σαⁱ；保本 L>1+K·c_d/c_t；α 与聚合接受率不是同一个量 | 与第 11 课相乘而非相加 |\n\n## 综合自测\n\n### 1. 64 GB 卡跑 Qwen3-8B（BF16）、`--max-model-len 4096`，KV 池多大、能装几条？为什么别把 `--gpu-memory-utilization` 拉到 1.0？\n<details><summary>查看答案<\/summary>配额 64×0.9 = 57.6 GB，扣运行时与图捕获约 4 GB 得 53.6 GB；权重 8×10⁹×2 B = 16 GB，剩 37.6 GB。每 token 每层 KV = 2×8 头×128 维×2 B = 4 KB，36 层共 144 KB/token；一条 4096 token 请求约 0.56 GB，于是 37.6÷0.56 ≈ 66 条（KV 侧上界）。对照第 9 课 0.6B 的 114 条：模型大 13 倍，权重只多吃 15 GB，KV/token 却从 112 KiB 涨到 144 KB。拉到 1.0 会挤掉运行时、通信缓冲与图捕获的预留，典型是启动失败或运行中 OOM，0.8–0.9 是稳妥起点。<\/details>\n\n### 2. B=32、512 token 上下文，实测每步 20 ms 而下界 11.5 ms。按什么顺序捞这 42%？若 `kernel_details.csv` 榜首是五个串联的逐元素小算子，说明什么？\n<details><summary>查看答案<\/summary>先复算：(16+2.4)÷1.6 TB/s = 11.5 ms（32×144 KB×512 ≈ 2.4 GB KV），带宽利用率约 58%。归因三步：矩阵乘占比低 → 融合不足或回退；内核间空隙大 → 下发/调度，先试 `TASK_QUEUE_ENABLE=2`、`CPU_AFFINITY_CONF=1`；all-reduce 占比高 → 查 TP 与 HCCL。五个小算子串联正是**组合重写式 fallback**：每拆一次多一次 kernel 启动（几微秒）和一轮中间张量写回 HBM。这就是第 11 课说的融合收益——省的是字节而非 FLOP，中间结果留在片上就把带宽还回来。正确性从不报警，只有 profiler 报警。<\/details>\n\n### 3. 同一个原生 FP8 checkpoint，为什么在 950PR 上显存减半、换张卡就「开了没变」？量化收益为何随上下文变长而衰减？\n<details><summary>查看答案<\/summary>昇腾三条路：ModelSlim 产 W8A8 加 `--quantization ascend`；LLM-Compressor 产 compressed-tensors 格式；直接吃原生 FP8 checkpoint。只有**块级缩放且硬件是 950PR/950DT** 才真走 FP8 矩阵乘，其它代际把权重摊回 BF16 再算，显存按 BF16 规划。衰减看第 10 课的账：512 token 时 (8+2.4)÷1.6 = 6.5 ms 对 11.5 ms 约 1.8×；8k 时 (8+38)÷1.6 = 29 ms 对 34 ms 只有 1.2×。量化压的是权重，**KV 一字节没省**，上下文越长 KV 占比越高。第 9 课的 114,688 B/token 就是量化动不了的那一半。<\/details>\n\n### 4. c_t=30 ms、c_d=3 ms、K=4、α=0.7 时加速 1.98×。若先做 weight-only INT8 把 c_t 压到 15 ms、草稿几乎没变，收益变成多少？\n<details><summary>查看答案<\/summary>原配置 L = 1+0.7+0.49+0.343+0.2401 = 2.7731，一轮 12+30 = 42 ms，15.1 ms/token，1.98×。量化后保本门槛 L > 1+K·c_d/c_t = 1+4×3/15 = 1.8，实际 2.77 仍高于门槛，还赚；但一轮 12+15 = 27 ms，27÷2.7731 ≈ 9.7 ms/token，相对 15 ms 只有 **1.54×**（相对原始 30 ms 是 3.1×）。结论：两个优化**不同乘**。量化只压 c_t 不压 c_d，`c_d/c_t` 从 0.1 恶化到 0.2，门槛从 1.4 抬到 1.8，K 也该跟着调小：K=2 时 L=2.19、一轮 21 ms、9.6 ms/token，几乎持平但少花草稿算力。参数不是独立旋钮。<\/details>\n\n### 5. 第 10 课算出 TP=4 把 decode 从 10 ms 压到 4.7 ms。此时叠加投机解码（c_d=3、K=4、α=0.7）划算吗？\n<details><summary>查看答案<\/summary>不划算，甚至更慢。门槛变成 L > 1+4×3/4.7 ≈ 3.55，而 α=0.7 只有 2.77；一轮 12+4.7 = 16.7 ms，16.7÷2.7731 ≈ 6.0 ms/token，比不投机的 4.7 ms 更慢。要让 K=4 保本，α 得爬到约 0.83（α=0.85 时 L≈3.71）。机制是两者砍**同一笔权重读取**：TP 靠切分把每卡读取摊薄 4 倍，投机靠 K+1 个位置摊薄同一次读取，叠加时省下的空间被重复占用，2.2 ms 通信固定延迟却一分不少。真要叠加就选 c_d 极小的方案（n-gram 近乎零成本、EAGLE 薄头），而不是独立 draft model。<\/details>\n\n### 6. 五个现象各落三层栈哪一层、下一步查什么：① `npu-smi` 看不到卡；② `torch.npu.is_available()` 为 False；③ 日志没有 `Platform plugin ascend is activated`；④ `import torch_npu` 抛错；⑤ 服务起来却报 CUDA 错误。\n<details><summary>查看答案<\/summary>① 驱动/固件或容器映射，查 `--device /dev/davinci0`，别急装 Python 包；② CANN 或 torch-npu 版本段，`pip list` 对矩阵；③ 插件没接管，查 vllm-ascend 与 vLLM 版本；④ torch 与 torch_npu 的 ABI 不匹配，通常在 import 或首个 npu 算子处报「找不到符号」，修法是换整行；⑤ 仍是插件没加载，vLLM 在按 CUDA 找设备。规律：**报错位置常离真正原因很远**，三层各有独立的存在性检查，永远自底向上查。第 10 课补一点：`vllm_ascend/patch` 会在 import 时替换少数函数，「参数不按文档生效」可能出自补丁层。<\/details>\n\n### 7. 线上 Qwen3-8B、8k 上下文、TP=4，TPOT 55 ms。按什么顺序动旋钮，每步预期与代价是什么？\n<details><summary>查看答案<\/summary>先算账：8k 时每卡 (4+9.5)÷1.6 ≈ 8.4 ms，加通信约 10.6 ms，即应在 10 ms 量级；55 ms 意味着 5 倍水分，先别调参、先 profile。① 归因：矩阵乘占比低 → 回退/融合不足；空隙大 → 下发，试 `TASK_QUEUE_ENABLE=2`、`CPU_AFFINITY_CONF=1`；all-reduce 占比高 → 查 HCCL 与 TP 拓扑。② 若是算子问题走 W8A8（ModelSlim + `--quantization ascend`），预期权重读取减半、8k 下约 1.2×，代价是精度与量化后端必须验；别指望 FP8 checkpoint 在非 950PR 上省显存。③ 若是组批问题看 `batch.csv`，batch 长期起不来是并发预算问题，与量化无关。④ 投机放最后：TP 已把 c_t 压到 4.7 ms，独立 draft model 基本必亏（见第 5 题），只有 n-gram 或极薄的头可能保本。顺序即 **profiler → 融合/下发 → 量化 → 并行与投机，每步重算门槛，不套模板**。<\/details>\n\n## 易混淆对照表\n\n| 容易混的概念 | 区别一句话 |\n| --- | --- |\n| vLLM vs vllm-ascend | 引擎本体（API、调度、PagedAttention 全原装）vs 只替换「跟硬件打交道那层」的插件。 |\n| CANN vs torch-npu vs vllm-ascend | 运行时+算子库+通信库 vs PyTorch 的 `npu` 后端 vs 用这套后端写出来的插件。 |\n| 组合重写 vs `NotImplementedError` | 一个算子拆成五个、仍在 NPU 上跑（正确但慢）vs 直接报错；**都不会自动搬 CPU**。 |\n| B\\*≈47 vs 投机保本 L\\* | 「算力下界追上带宽下界」的 batch vs 「一轮成本追平单步成本」的接受长度。 |\n| 条件接受率 αᵢ vs 聚合接受率 | 「前 i−1 个都过了之后第 i 个通过」（α=0.7 连过 4 个只有 24%）vs 监控的 accepted/drafted（本例约 44%）。 |\n| L（接受长度）vs 加速比 | L=1+Σαⁱ 是一轮产出几个 token vs 加速比还要除上草稿成本。 |\n| W8A8 vs W4A16 | 权重激活都 8 位、要 SmoothQuant 搬激活离群值 vs 只压权重、激活仍 FP16，配 AWQ/GPTQ 与分组。 |\n| 量化省显存 vs 一定变快 | 省显存基本确定；变快只在带宽受限区间成立，prefill 或大 batch 时 INT4 现场反量化可能更慢。 |\n| FP8 checkpoint vs ModelSlim W8A8 | 前者要块级缩放且 950PR/950DT 才真走 FP8，否则摊回 BF16 vs 后者是明确的量化后端。 |\n| 量化 vs 编译 | 少用字节（省带宽）vs 少往返次数（省启动与 HBM 写回），都治访存浪费。 |\n| PTQ vs QAT | 几百条样本跑前向、分钟到小时 vs 插伪量化节点加 STE 训练、小时到天；W4A4 只能靠后者。 |\n| `--max-model-len` 大 vs 启动失败 | 只有单条 max-model-len 的 KV 装不进池子才报错；小模型上表现为并发骤降（114→14）。 |\n| TTFT 差 vs TPOT 差 | 前者查排队与 prefill（prefix caching、chunked prefill）vs 后者查 decode 单步（权重量化、融合、TP、投机）。 |\n\n## 自查问题\n\n1. **不看笔记**，用 64 GB 卡 + Qwen3-8B BF16 手算：KV 池多大、4096 与 8192 各能装几条，为什么 `--max-model-len` 大并不直接导致启动失败。答不上回第 9 课第 1–6 步。\n2. **不看笔记**，把 decode 一步拆成权重/KV/算力/通信四笔账，说出 B\\*≈47 何时失效、失效后该改哪个旋钮。答不上回第 10 课第 1–6 步与「张量并行的补充账」。\n3. 给定 c_t、c_d、K、α 判断该不该开投机；再说明「先量化」或「先 TP」之后判断为何翻转。答不上回第 12 课第 5、6 步，并对照第 11 课「误区 1」。\n\n## 下一轮预告\n\n第 13 课《Prefill/Decode 分离与长上下文》接棒：本轮四课优化的都是**同一实例内的单步成本**，下一课把 prefill（吃算力）与 decode（吃带宽）拆到不同实例——混在一起互相抢资源，拆开才谈得上分别配置与扩缩容。带三问进课：① 第 10 课那笔 KV 账在 PD 分离后要搬几次、走哪条链路？② 「带宽受限」在 prefill 实例上还成立吗？③ 长上下文把 KV 推到 38 GB 时，量化与投机各能救多少？\n\n第 4 轮串讲把第 9–13 课合成一棵**调参决策树**：从 TTFT/TPOT/吞吐三个症状出发，按 profiler 证据分叉到算子、精度、并行、调度四条路，每条都标「先算哪个下界、验哪个门槛」。这一轮请把三道自查题做到能默写——下一轮不再重复算账。"}], "news": [], "supplements": [{"type": "supplement", "date": "2026-11-03", "title": "补课 · RNN 与 attention 的取舍", "domain": "", "tags": ["RNN", "attention", "序列模型", "并行", "Mamba"], "markdown": "# 补课 · RNN 与 attention 的取舍\n\n> 读完这篇，你能：\n> 1. 说清 RNN 的 h_t 为什么天然串行；\n> 2. 用「并行度 / 显存 / 长程记忆」三个维度比较 RNN、attention、SSM；\n> 3. 理解 Mamba 为什么是「线性 RNN + 并行 scan」，以及它换走了什么。\n\n## 为什么需要它\n\n序列模型要回答一个问题：读到第 100 个 token 时，怎么记住前 99 个？\n\n- **RNN 的答案**：维护一个递推状态 h，每读一个 token 更新一次：`h_t = tanh(W_h·h_{t-1} + W_x·x_t)`；\n- **attention 的答案**：把历史全部留着（K/V），每个新 token 直接「回看」所有历史。\n\n2017 年 Transformer 用 attention 取代 RNN，主因不是「更聪明」，而是**能并行**。但 attention 留下了 KV cache 越写越长的账单；Mamba 又把 RNN 捡回来，用「线性化 + 并行 scan」把并行度买回来。不理解 RNN 的串行，就理解不了 Mamba 在解决什么。\n\n## 核心概念\n\n### RNN 的串行：链式数据依赖\n\n递推式 `h_t = tanh(W_h·h_{t-1} + W_x·x_t)` 里，h_t 直接依赖 h_{t-1}。要算第 100 步，必须先算完第 1…99 步。GPU 有几千个核，但这里**没有可同时做的独立工作**——只有沿时间轴的串行链。\n\n直觉：接力赛，下一棒必须等上一棒交棒；而 attention 像把所有运动员叫到同一块场地，各自同时跑。\n\n### 线性 RNN 为什么能并行：结合律 + scan\n\n如果递推是**线性**的：`h_t = a_t·h_{t-1} + b_t`，就把它看成一次仿射变换 `(a_t, b_t)`。两个仿射变换复合仍是仿射变换：\n\n`(a₂,b₂) ∘ (a₁,b₁) = (a₂a₁, a₂b₁+b₂)`\n\n复合满足**结合律**，于是可以两两合并、树形归约——这就是并行前缀和（scan）：O(n) 总计算、O(log n) 深度。\n\n**关键**：scan 要求「线性 + 结合律」。RNN 的 tanh 是非线性的，破坏了结合律，只能串行。Mamba 的「选择」让 a_t、b_t 随输入变（仍保持线性递推），所以训练能 scan、推理能递推——这是它同时拿到并行和 O(1) 推理的原因。\n\n### attention 的并行：没有时间依赖\n\n`QK^T` 一次算出所有 token 对的关系，序列维上没有依赖（因果 mask 只是把未来遮掉，不改变可并行性）。所以 prefill 能把整段 prompt 一次并行算完，GPU 吃满。\n\n### 三者的账\n\n| 维度 | RNN | attention | 线性 SSM（Mamba） |\n| --- | --- | --- | --- |\n| 训练并行度 | O(n) 串行（非线性时） | O(1) 深度，全并行 | O(log n) 深度（scan） |\n| 训练显存（激活） | O(n) | O(n²)（attention 矩阵） | O(n) |\n| 推理每 token 成本 | O(1) 计算 + O(1) 状态 | 读全部 KV，O(n) 带宽 | O(1) 计算 + O(1) 状态 |\n| 长程记忆 | 压缩进状态，会衰减 | 精确检索，不丢 | 压缩进状态，可学习遗忘 |\n| 可解释 / 可编辑 | 弱 | 强（KV 可查、可改） | 弱 |\n\n一句话：**并行度、显存、长程记忆，三者不可兼得**。attention 用显存换并行与精确记忆；RNN 用串行换 O(1) 成本；Mamba 想用「线性 + scan」同时拿并行与 O(1)，代价是记忆被压缩、只能近似检索。\n\n## 一步一步理解\n\n设序列长 n = 4096，隐藏维 d = 512。\n\n1. **RNN 训练**：4096 个时间步串行。每一步是一次 512×512 的矩阵乘（外加 batch 维并行）。GPU 每个时间步只有很小的并行度，利用率低，墙钟时间长。\n2. **attention 训练**：QK^T 是 4096×4096×512 的矩阵乘，切成几万个 128×128 的小块，GPU 满负荷；代价是 4096² 的 attention 矩阵要进显存（bf16 约 32 MiB/头，层数一多就爆）。\n3. **推理**：attention 每生成一个 token，要把历史 KV 全读一遍——32 层、8 个 KV 头、128 维、fp16，每 token 128 KiB；4096 上下文就是 512 MiB，且每步都要读。RNN / Mamba 每步只读写一个定长状态（Mamba-2 约 128 MiB/序列，与长度无关）。\n4. **长上下文**：n 从 4K 涨到 128K，attention 的 KV 涨 32 倍，RNN/SSM 的状态不变。这就是长上下文场景里 SSM 的吸引力。\n\n## 常见误区\n\n1. **「RNN 不能并行」**：线性 RNN 训练可以 scan 并行；串行的是**推理时**的逐步递推（每步仍 O(1)）。\n2. **「attention 没有代价」**：prefill 是 O(n²) 计算，KV 随长度线性涨、decode 每步读全量 KV；长上下文时显存和带宽才是大头。\n3. **「Mamba 会取代 attention」**：现实是混合架构（Jamba 1:7、Zamba、Hymba），attention 保留精确检索，SSM 承担长程压缩与吞吐。\n4. **「状态就是压缩版 KV」**：状态不可寻址、只进不出；KV 可随机访问、可回滚。语义不同。\n\n## 一句话总结\n\nRNN 输在「时间步必须排队」，attention 赢在「所有位置同时看」，代价是 KV 越写越长；Mamba 把 RNN 线性化后用 scan 排队变并行，但记忆只能压缩——这就是三者的取舍。\n\n## 自测题\n\n### 1. 为什么 tanh RNN 不能 scan，而线性 RNN 可以？\n<details><summary>查看答案<\/summary>scan 依赖「复合运算满足结合律」做树形归约。线性递推 h_t = a_t·h_{t−1} + b_t 是仿射变换，复合仍是仿射变换、满足结合律；tanh 是非线性函数，复合后不满足结合律，只能逐步串行。<\/details>\n\n### 2. attention 的「并行」代价具体花在哪？\n<details><summary>查看答案<\/summary>两处：训练时 QK^T 产生 O(n²) 的 attention 矩阵（显存与计算）；推理时 KV cache 随上下文线性增长，decode 每步都要把全部 KV 读一遍（带宽）。<\/details>\n\n### 3. 为什么 Mamba 推理是 O(1) 而训练能并行？\n<details><summary>查看答案<\/summary>推理沿时间递推，每步只更新定长状态（O(1) 计算与显存）；训练时因为递推是线性的，可用并行 scan 把 O(n) 串行链变成 O(log n) 深度的树形归约。<\/details>\n\n### 4. 混合架构为什么保留少量 attention 层？\n<details><summary>查看答案<\/summary>SSM 把历史压成定长状态，适合长程与吞吐，但精确检索（比如「第 37 句原文」）会丢；少量 attention 层保留可寻址的 KV，负责精确召回，其余层用 SSM 省成本。Jamba 就是 4/32 层 attention。<\/details>\n\n## 来源\n\n- Vaswani et al., *Attention Is All You Need* (2017) — https://arxiv.org/abs/1706.03762\n- Bahdanau et al., *Neural Machine Translation by Jointly Learning to Align and Translate* (2014) — https://arxiv.org/abs/1409.0473\n- Gu & Dao, *Mamba: Linear-Time Sequence Modeling with Selective State Spaces* (2023) — https://arxiv.org/abs/2312.00752\n- 3Blue1Brown, *But what is a neural network?* / *Attention in transformers* 系列 — https://www.youtube.com/@3blue1brown\n\n## 延伸\n\n线性 RNN 如何用结合律变成并行 scan、Mamba 的选择性与 Mamba-2 的 SSD、GDN/KDA 混合架构：\n[[专题/Mamba 家族/Mamba 家族|Mamba 家族与混合架构（专题）]]", "term_count": 0, "source_count": 4}], "topics": [{"date": "2026-11-03", "title": "模型演进：从 S4 到 Mamba-2，再到 GDN / KDA 等混合模型", "topic": "Mamba 家族与混合架构", "topic_id": "mamba-family", "part": "model-evolution", "part_title": "模型演进：从 S4 到 Mamba-2，再到 GDN / KDA 等混合模型", "order": 1, "tags": ["SSM", "Mamba", "混合架构", "线性注意力", "长上下文"], "markdown": "# 模型演进：从 S4 到 Mamba-2，再到 GDN / KDA 等混合模型\n\n> 读完这篇，你能：\n> - 说清 SSM 用「定长状态」换掉了什么，以及它为什么不是「压缩版 KV cache」；\n> - 自己手算离散化、chunked scan 复杂度、显存账这三笔账；\n> - 分清 SSD 的对偶究竟对偶了什么，GDN / KDA 各改动了哪一处。\n\n## 为什么需要它\n\n第 3 课的 attention 有一笔隐含账单：把历史全留成 KV。一个 32 层、8 个 KV 头、head_dim 128、bf16 的模型，32K 上下文时 KV 约 4 GiB（算法见「一步一步理解」），而 decode 每生成一个 token 还要把这段 KV 整个读一遍。\n\n还有一条路：不留历史，只维护一个定长状态 h，每读一个 token 就「更新状态、读出结果」。这就是状态空间模型（SSM）。账本完全不同：显存不随上下文涨、每 token 计算量恒定，代价是状态只记摘要。\n\n这条路从 S4 到 Mamba（选择性）、Mamba-2（SSD）、GDN（delta rule + 门控）、KDA（逐通道门控）一路演化，落成今天最常见的形态——混合架构：多数层用 SSM，少数层保留 attention。本文是另两篇的「记号表」。\n\n## 核心概念\n\n### 状态空间模型（SSM）\n\n定义：用定长隐状态 h_t ∈ R^N 概括 x_1…x_t 的序列模型，由连续时间线性系统离散化而来：ẋ = Ax + Bu，y = Cx + Du。\n\n直觉：attention 把每句话录音存档、需要时回放；SSM 像只维护一页摘要的笔记员，每读一句改一页。摘要页大小固定、永不爆内存，但也没法逐字回放第 37 句。\n\n机制：A 管状态自己怎么衰减（特征值实部为负＝遗忘），B 管当前输入怎么写进来，C 管怎么读出去，D 是直通项（常省略）。S4 / Mamba 取 A 为对角阵，各通道独立。\n\n### 状态维度 N\n\nh 的宽度，常见 16–128。它不表示「能记住多少 token」，而是「摘要用多少个数字写」；N 决定单层能存多少线性无关的 key，也是状态缓存的成本因子（每序列每层约 d_inner × N 个数）。\n\n它不是 KV 的压缩版：KV 可寻址、可回滚、随长度增长；状态不可寻址、只进不出、与长度无关。语义不同，不能互换。\n\n### 离散化（Δ、Ā、B̄）\n\n定义：零阶保持下，标量情形有精确式 Ā = e^{Δa}、B̄ = ((e^{Δa} − 1)/a)·B（矩阵形式是 B̄ = (ΔA)⁻¹(e^{ΔA} − I)·ΔB）。递推为 h_t = Ā h_{t−1} + B̄ x_t，y_t = C h_t。\n\n注意「B̄ ≈ ΔB」只是近似：把 e^{Δa} 展开成 1 + Δa 才得到它，所以只在 |Δa| ≪ 1 时成立。Δa = −0.1 时精确值 0.0952、近似值 0.1，已差 5%——下面手算用精确值。\n\n直觉：Δ 是「这一步积分多长」。Δ 大 → Ā 小 → 旧状态被冲掉，等于重置；Δ 小 → 状态几乎不动，历史保住。这是 Mamba 表达「该不该记住这个 token」的旋钮。\n\n### HiPPO 初始化\n\n给 A 一组特定初值（正交多项式基底，如 Legendre），使状态成为历史的最优投影。它回答「A 随便设会怎样」：a = −1000 时 e^{−1000Δ} ≈ 0，一步清零；a = 0 时永不衰减、越加越乱。HiPPO 把 a 排成多尺度衰减，只影响初始化，训练中 A 仍可学。\n\n### 卷积视图\n\n递推展开：y_t = Σ_{s≤t} C_t (Π_{r=s+1..t} Ā_r) B̄_s x_s。若 Ā、B̄、C 不随输入变，核只依赖 t−s，就是一个因果长卷积——训练可一次卷积 / FFT 算完，推理仍可递推，每步 O(1) 次状态读写。\n\n### 选择性（S6）\n\nB、C、Δ 由当前 token 经线性层算出，A 仍与输入无关。S4 的核固定，「该记什么」写死在参数里；Mamba 让模型按内容决定记还是忘——见到分隔符调大 Δ（重置），见到关键词调小 Δ（多写一点）。代价：核随时间变，不再是固定卷积、不能 FFT，只能沿时间真递推。\n\n### 并行扫描与 chunked scan\n\n并行扫描：元素取 (a, b) 表示 h_out = a·h_in + b，复合 (a₂,b₂)∘(a₁,b₁) = (a₂a₁, a₂b₁+b₂)，满足结合律，可做树形归约：O(n) 工作量、O(log n) 深度。\n\nchunked scan：把序列切成长度 L 的块。块内用一次带因果掩码的矩阵乘算完，块间只传一个状态 h，因此块间要串行 n/L 次——串行步数是块数，不是块长 L。总计算约 O(n(L+N)D)：L 决定块内的矩阵乘规模与块间串行跳数，D 是通道数（每个通道各做一次），N 是块间低秩传递的秩。L 取大，块内矩阵更大、串行跳数更少，矩阵乘占比更高——这是硬件喜欢它的原因，也是 Mamba-2 / GDN / KDA 在 GPU、NPU 上的共同地基。\n\n### SSD（状态空间对偶）\n\nSSM 一侧：y = M·x，其中 M_{t,s} = C_t (Π_{r=s+1..t} Ā_r) B̄_s（s ≤ t，否则为 0）。M 下三角且「半可分」：对角块之外秩 ≤ N。\n\nattention 一侧要说准：给定 Q、K 之后，输出是 y = A·V，A = softmax(QKᵀ/√d) ⊙ mask（下三角）。所以 attention 对 V 线性，但 A 由输入经 Q、K 现算——对输入整体不是线性映射，别读成「固定 M 的线性层」。\n\n对偶指：两者都能写成「一个下三角矩阵乘一个序列」——SSM 乘 x，attention 乘 V；区别在矩阵怎么造：A 稠密、来自 QKᵀ；M 半可分（对角块外秩 ≤ N）、来自 A/B/C 的递推。N 大 → M 接近满秩 → 像 attention；分块后对角块用低秩 (C B) matmul、块间只传状态 → 像 SSM。买到的是同层可选 matmul 形态，主计算变成大矩阵乘——昇腾能参与的前提。\n\n### Delta rule、门控与混合架构\n\nDelta rule：状态 S 是 key-value 关联矩阵，写入前先按 key 擦旧值：S_t = S_{t−1}(I − β_t k_t k_tᵀ) + β_t v_t k_tᵀ，等价于对 ‖S k_t − v_t‖² 走一步梯度下降（学习率 β_t）。不是「再写一条」，而是「先擦旧答案再写新的」，所以能改错、检索更准。\n\nGDN（Gated DeltaNet，ICLR 2025，arXiv:2412.06464）把 Mamba-2 的门控衰减与 delta rule 合起来：S_t = α_t S_{t−1}(I − β k kᵀ) + β v kᵀ。门控管「整体快速清空」，delta 管「定点改写」，二者互补。\n\nKDA（Kimi Delta Attention，arXiv:2510.26692）把 α 从每头一个标量细化到逐通道（对角），并用 Diag-Plus-Low-Rank 转移矩阵的块算法维持效率。官方称 3B 激活 / 48B 总参、KDA + MLA 分层混合，1M 上下文 KV 最多降 75%、解码吞吐最高 6×——厂商自报，未见第三方复现。\n\n混合架构：attention 层与 SSM 层按比例交错，成本只剩一条公式——KV 只按 attention 层数付。\n\n- Jamba：32 层 = 4 block × 8 层，block 内 attention:Mamba = 1:7，故只有 4 层 attention；MoE 每 2 层一次、16 专家 top-2；52B 总参 / 12B 激活；256K 上下文 KV 约 4 GB。排法理由：attention 保检索，Mamba 给吞吐，MoE 保容量。\n- Zamba：Mamba 主干 + 一个共享 GSA 块，每 6 个 Mamba 块调一次、参数共享；attention 参数与 KV 只付一份，代价是表达受限。\n- Hymba：不交错而是并行——同一层 attention 头与 SSM 头各算再融合，另有可学习 meta token 存全局信息；attention 头管高分辨率召回，SSM 头管摘要，代价是结构复杂。\n- Samba：逐层 Mamba + 滑动窗口 attention；近期精确召回交给窗口，远期压缩交给 Mamba，可无限流式，代价是窗口外没有精确召回。\n\n工程现状：vLLM 主线已列出 Mamba、Mamba2、Jamba、Zamba2、FalconMamba、KimiLinear 与 Qwen3.5 的 GDN 混合；V1 早期要求「强制 eager + 关前缀缓存」，放开后才用上 CUDA graph，prefix caching 由 mamba_cache_mode 控制 checkpoint 粒度。\n\n昇腾侧（vllm-ascend）的口径是 aclnn 优先、Triton 回落，以 0.11 线为参照（PR #12607 接入 AscendC 的 ChunkGatedDeltaRule，PR #19875 把 prefill 的 chunk 扫描切到该融合算子）：\n\n| 阶段 | 默认算子 | 回落 |\n| --- | --- | --- |\n| prefill | torch_npu.npu_chunk_gated_delta_rule（aclnn） | Triton chunk_gated_delta_rule（FLA） |\n| decode | torch_npu.npu_recurrent_gated_delta_rule（AscendC） | Triton recurrent 实现 |\n\n约束以 torch_npu 算子文档为准：仅推理、TND 布局、q/k/v 全 bf16、Dk/Dv ≤ 128、Nk/Nv ≤ 64 且 Nv % Nk == 0，任一不满足即回落。换版本时默认路径与阈值都可能变，落地前按自己版本查源码。另外 ssm_state 与 conv_state 各一个 pool、与 attention 的 block table 分开索引；all 模式的 GDN 前缀缓存已实现，但该模式下投机解码会回退到 align——「混合 + 投机 + 前缀缓存」同开仍是坑。\n\n## 一步一步理解\n\n第一步，单通道手算。取 a = −1、Δ = 0.1、B = 1：Ā = e^{−0.1} ≈ 0.9048，B̄ = 1 − e^{−0.1} = 0.0952。x 恒为 1，则 h₁ = 0.0952，h₂ = 0.9048 × 0.0952 + 0.0952 = 0.1813，稳态 h* = B̄/(1 − Ā) = 1.000（正好是 −B/a）。用近似 B̄ ≈ ΔB 则稳态 1.05，偏高 5%。记忆地平线约 1/(1 − Ā) ≈ 10.5 步，更早的输入基本读不出来——这就是「定长状态」的含义。\n\n第二步，看核。令 C = 1、x = [1, 0, 0, …]，输出是 0.0952、0.0861、0.0779…，一条每步乘 0.9048 的衰减核。S4 里它固定，所以能一次卷积算完。\n\n第三步，看选择性。一旦 Δ、B、C 随 token 变，核随时间变，卷积失效，只能 scan。分块后设 n = 4096、L = 128、N = 64、D = 2048：序列切成 4096/128 = 32 个块，块间串行 32 次；总计算约 n(L+N)D = 4096 × 192 × 2048 ≈ 1.6 × 10⁹ 次乘加，矩阵乘占绝对主体。\n\n第四步，算两笔账。KV：每 token 每层 2 × 8 × 128 = 2048 个数、bf16 约 4 KiB，32K 上下文 = 128 MiB/层，32 层 = 4 GiB；1:7 混合只剩 4 层 = 512 MiB（1/8，与 Jamba 的 8× 一致）。状态：N = 128、宽度 2048，每层 2048 × 128 = 262144 个数 = 512 KiB，28 个 Mamba 层约 14 MiB/序列，且与上下文无关——小两三个数量级，只是「只读摘要」。\n\n| 状态形式 | 每 token 计算量 | 训练复杂度 | 推理复杂度 | 有无 KV | 典型场景 |\n| --- | --- | --- | --- | --- | --- |\n| attention（GQA） | 读全部 KV | O(n²) | 每步 O(n)，KV 随 n 涨 | 有 | 通用对话、精确检索 |\n| S4 | O(N·d) | O(n log n)（FFT） | O(1)/token | 无 | 长序列、音频、时序 |\n| Mamba（S6） | O(N·d) | O(n)（scan） | O(1)/token | 无 | 长文本预训练、边缘推理 |\n| Mamba-2 / SSD | O(N·d)，主体是 matmul | O(n) 分块 | O(1)/token | 无 | 训练效率优先 |\n| GDN / KDA | 同上 + delta / 逐通道门控 | O(n) 分块 | O(1)/token | 无 | 检索要求高、超长上下文 |\n| 混合（Jamba 类） | attention 层 O(n)，其余 O(N·d) | 介于两者之间 | 每步 O(n_attn) | 有，只按 attention 层 | 长上下文 + 高并发服务 |\n\n## 常见误区\n\n一、「SSM 状态就是压缩过的 KV cache」。不是：KV 能按位置取回、能回滚、能前缀复用；状态只进不出、不可寻址。所以混合模型的 prefix caching 要额外做 checkpoint，不能按 token 切块。\n\n二、「有卷积视图，所以训练不需要 scan」。卷积只在 B、C、Δ 与输入无关时成立（S4）；S6 之后核时变，FFT 路线作废，必须 scan 或分块 matmul。\n\n三、「选择性 = 门控」。门控 α_t 只是按通道整体缩放状态；选择性是让 B、C、Δ 随内容变。GDN 是两者相加，不是同一件事。\n\n四、「混合模型长上下文免费」。SSM 层不付 KV，但要付状态缓存与每 token 的 O(N·d) 计算；状态不可寻址，针尖检索仍靠那几层 attention。\n\n## 一句话总结\n\nattention 把历史全留成 KV，SSM 把历史压进定长状态；S6 让「记什么」随内容变，SSD 说明两者是同一个下三角矩阵乘法的两种算法（attention 乘 V、SSM 乘 x，矩阵一个稠密一个半可分），混合架构则按「KV 只按 attention 层数付」这条公式把两者拼起来。\n\n## 自测题\n\n### 1. 取 a = −1、Δ = 0.1、B = 1、x 恒为 1，求 Ā、B̄、h₂ 与稳态 h*；用 B̄ ≈ ΔB 会差多少？\n\n<details><summary>查看答案<\/summary>\n\n精确式 B̄ = ((e^{Δa} − 1)/a)·B = 1 − e^{−0.1} ≈ 0.0952，Ā = e^{−0.1} ≈ 0.9048。h₁ = 0.0952，h₂ = 0.9048 × 0.0952 + 0.0952 = 0.1813，稳态 h* = B̄/(1 − Ā) = 1.000（即 −B/a）。若用 B̄ ≈ ΔB = 0.1，h* 会算成 1.05，偏高 5%——「≈」必须带条件 |Δa| ≪ 1，这里 Δa = −0.1 已不算小。\n\n<\/details>\n\n### 2. chunked scan 块间串行几次？总计算为什么是 O(n(L+N)D)？\n\n<details><summary>查看答案<\/summary>\n\n串行次数是块数 n/L，不是块长 L；n = 4096、L = 128 时是 32 次。总计算 n(L+N)D 各项分工：块内 L×L 因果矩阵乘贡献 n·L·D；块间只传秩 ≤ N 的状态，贡献 n·N·D；D 是通道数，每个通道各自独立做一遍，所以乘上去。L 大则块内矩阵大、串行跳数少。这也说明 chunk 化后主体是矩阵乘——硬件吞吐在 matmul 上。\n\n<\/details>\n\n### 3. 「attention 也是 y = M·x」这句话哪里不严谨？\n\n<details><summary>查看答案<\/summary>\n\n不严谨在 x 和 M 的来源。准确说法：给定 Q、K 后 attention 对 V 的映射是 y = A·V，A = softmax(QKᵀ/√d) ⊙ 掩码；但 Q、K 由输入算出，所以 attention 对输入整体不是线性映射，A 也不是固定矩阵。对偶只说两者都能写成一个下三角矩阵乘一个序列（SSM 乘 x、attention 乘 V），且矩阵结构不同。把「同族」读成「attention 是线性层」就错了。\n\n<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| 状态空间模型（SSM） | 用定长隐状态 h_t 概括全部历史；连续形式 ẋ=Ax+Bu、y=Cx+Du，离散后 h_t=Āh_{t−1}+B̄x_t |\n| 离散化（Δ / Ā / B̄） | Ā=e^{ΔA}，标量下 B̄=((e^{Δa}−1)/a)·B，仅 |Δa|≪1 时约等于 ΔB |\n| HiPPO 初始化 | 给 A 一组正交多项式基底初值，使状态成为历史的最优投影，避免 A 随便设导致瞬间遗忘 |\n| 卷积视图 | 递推展开等于一个因果长卷积核；固定核时训练可并行、推理仍 O(1) |\n| 选择性（S6） | B、C、Δ 由当前 token 算出，模型按内容决定记住还是重置；代价是核时变、必须 scan |\n| chunked scan | 序列分块，块内并行 matmul、块间串行传状态（串行 n/L 次）；总计算约 O(n(L+N)D) |\n| SSD（状态空间对偶） | SSM 写成 y=M·x（M 半可分）；attention 写作 y=A·V（A=softmax(QKᵀ)⊙mask）；同族指两者都是下三角矩阵乘 |\n| Delta rule | 写入前按 key 擦旧值再写新值，等价于对 ‖Sk−v‖² 走一步梯度下降；状态是可改写的关联 |\n| 门控衰减 α_t | 状态各通道按输入决定衰减多少；GDN 用标量 α，KDA 细化到逐通道对角 |\n| 混合架构（hybrid） | attention 与 SSM 层按比例交错（Jamba 1:7、Zamba 共享层、Hymba 并行头、Samba 加滑窗），KV 只按 attention 层计 |\n\n## 还没想清楚\n\n已确认：S4→Mamba→Mamba-2 的公式与动机、四个混合模型的排布、GDN / KDA 的机制、vLLM 的模型支持与 V1 eager 限制解除，都有论文或代码为据。\n\n存疑（未能核实）：\n一、Mamba-1 默认 d_state=16 / expand=2、Mamba-2 常用 N=64–128，属社区常见说法，未逐字核对官方 config；\n二、Samba 的滑窗宽度、Hymba 跨层 KV 共享的层数，未查到确定值；\n三、Kimi Linear 的 75% / 6× 是厂商自报，缺第三方复现；\n四、昇腾上 GDN 的实测吞吐无公开可复现数据；vllm-ascend 从哪一版起把 GDN prefill 默认切到 aclnn（本文按 0.11 线与 PR #12607 / #19875 描述），未逐版核对源码。\n\n## 来源\n\n- Mamba: Linear-Time Sequence Modeling with Selective State Spaces — https://arxiv.org/abs/2312.00752\n- Transformers are SSMs（Mamba-2 / SSD） — https://arxiv.org/abs/2405.21060\n- Gated Delta Networks: Improving Mamba2 with Delta Rule（ICLR 2025） — https://arxiv.org/abs/2412.06464\n- Kimi Linear: An Expressive, Efficient Attention Architecture（KDA） — https://arxiv.org/abs/2510.26692\n- Parallelizing Linear Transformers with the Delta Rule over Sequence Length — https://arxiv.org/abs/2406.06484\n- Jamba: A Hybrid Transformer-Mamba Language Model — https://arxiv.org/abs/2403.19887\n- Zamba: A Compact 7B SSM Hybrid Model — https://arxiv.org/abs/2405.16712\n- Hymba: A Hybrid-head Architecture for Small Language Models — https://arxiv.org/abs/2411.13676\n- Samba: Simple Hybrid State Space Models for Unlimited Context — https://arxiv.org/abs/2406.07522\n- S4: Efficiently Modeling Long Sequences with Structured State Spaces — https://arxiv.org/abs/2110.13985\n- vLLM Supported Models（Mamba / Jamba / Zamba2 / KimiLinear / Qwen3.5） — https://docs.vllm.ai/en/latest/models/supported_models/\n- vLLM PR #21233：V1 混合模型移除 enforce_eager 限制 — https://github.com/vllm-project/vllm/pull/21233\n- vllm-ascend PR #8829：GDN all 模式前缀缓存 — https://github.com/vllm-project/vllm-ascend/pull/8829\n- vllm-ascend PR #12607：AscendC ChunkGatedDeltaRule（aclnn 算子） — https://github.com/vllm-project/vllm-ascend/pull/12607\n- vllm-ascend PR #19875：GDN prefill 切换到 torch_npu 融合算子 — https://github.com/vllm-project/vllm-ascend/pull/19875\n- torch_npu.npu_chunk_gated_delta_rule API 文档（维度与精度约束） — https://raw.githubusercontent.com/ascend/op-plugin/abd599370b927e60f98669456d8655725ba8c974/docs/zh/custom_APIs/torch_npu/torch_npu-npu_chunk_gated_delta_rule.md\n- vLLM-Ascend 支持模型矩阵 — https://docs.vllm.ai/projects/ascend/en/latest/user_guide/support_matrix/supported_models.html\n- Hybrid Models as First-Class Citizens in vLLM（PyTorch 博客） — https://pytorch.org/blog/hybrid-models-as-first-class-citizens-in-vllm/", "term_count": 10, "source_count": 18}, {"date": "2026-11-03", "title": "推理框架：vLLM 怎么处理 Mamba 与混合模型", "topic": "Mamba 家族与混合架构", "topic_id": "mamba-family", "part": "vllm", "part_title": "推理框架：vLLM 怎么处理 Mamba 与混合模型", "order": 2, "tags": ["Mamba", "vLLM", "混合架构", "推理框架", "昇腾"], "markdown": "# 推理框架：vLLM 怎么处理 Mamba 与混合模型\n\n> 读完这篇，你能：\n> 1. 说清 conv_state / ssm_state 与 KV cache 在容量、切块、复用上的差别；\n> 2. 解释 vLLM 为什么把状态也当分页缓存管，以及 chunked prefill 怎么「接力」；\n> 3. 自己按 config 估一笔混合模型的 KV/状态账，不被「省 8 倍」带偏。\n\n## 为什么需要它\n\n你熟悉的推理服务默认三件事：prefill 一次算完、每层 K/V 写进 KV cache；decode 每步只读历史；prefix caching 因为每个 token 都有独立副本，能在任意 token 边界命中。前提是历史可随机访问、随长度线性增长。\n\nMamba 换掉了前提：历史被压成一个定长状态，每读一个 token 更新一次。prefill/decode 还在，但「缓存什么、按什么粒度切、能否跨请求复用、投机被拒怎么回滚」全要重做。vLLM 在 0.10 一线集中改这件事，也踩过版本口径不一致的坑——这篇只写能对上的部分。\n\n## 核心概念\n\n### 缓存换成了 conv_state + ssm_state\n\n**定义**：Mamba 是一种 SSM（状态空间模型）；一层的前向是 in_proj → causal-conv1d → 选择性 scan（沿时间轴递推）→ 门控 → out_proj。它不存 KV，只存两样：\n- **conv_state**：短卷积的窗口尾巴，每层 (conv_dim, K−1)，K=4 就是 3 步；\n- **ssm_state**：循环状态，Mamba-2 形状 (heads, head_dim, d_state)，与上下文长度无关。\n\n**直觉**：KV 是逐字记账的流水账，越读越厚；ssm_state 是固定厚度的一页摘要，读多少页都不变厚。conv_state 则是传送带尽头留的最后 3 格样品，下一个 token 来了才拼得出完整窗口。\n\n**机制**：Mamba-2 的递推是 h_t = Ā_t·h_{t−1} + B̄_t·x_t，y_t = C_t·h_t + D·x_t；Ā、B̄、C 由当前输入算出，所以叫「选择性」。decode 每步只更新一次状态，prefill 按块算、只在块末落一份状态。O(1) 不等于小：Mamba-Codestral-7B 64 层、128 头、head_dim 64、d_state 128、bf16，每层 128×64×128×2 B = 2 MiB，64 层约 128 MiB/序列。\n\n**三家模型的账放同一张表**（避免配置打架）：\n\n| 模型（config） | 结构 | KV/token | 32K KV | 状态/序列 |\n| --- | --- | --- | --- | --- |\n| Llama-3-8B | 32 层全 attention，8 KV 头，128 维，fp16 | 128 KiB | 4 GiB | 0 |\n| Jamba-v0.1 | 32 层，4 层 attention（1:7），8 KV 头，128 维；28 层 Mamba-1，d_state 16、d_inner 8192 | 16 KiB | 512 MiB | 约 8.3 MiB |\n| Mamba-Codestral-7B | 64 层纯 Mamba-2，128 头，head_dim 64，d_state 128，bf16 | 0 | 0 | 约 128 MiB |\n\n按公开 config 手算（fp16/bf16 每元素 2 字节），未计分页对齐与 padding，实际略高。Jamba 的 512 MiB 是 4 GiB 的 1/8，因为 attention 只占 4/32 层——「省 8 倍」是层比的倒数，不是 Mamba 的魔法。状态与 KV 的交叉点在 8.3 MiB ÷ 16 KiB ≈ 530 token：更短的上下文，状态反而更贵。\n\n### 状态也要分页：block table 与页大小\n\n**定义**：block table 是「逻辑块 → 物理块」的映射表；vLLM 把状态按 block 分配，与 KV 共用一套分页内存池。\n\n**直觉**：KV 像活页纸，每页一个 token，可任意抽换；状态像白板，只能整块换，换下的旧内容不留。一个序列任一时刻只有一份「当前状态」，不能按 token 切。\n\n**机制**：混合模型里 state 每 token 的字节数远大于 attention 每 token 的 KV 字节数，两边页大小对不上。vLLM 调大 attention 的 block_size，再给 state 补齐（padding，见[设计文档](https://github.com/vllm-project/vllm/blob/main/docs/design/hybrid_kv_cache_manager.md) case 4；可能超过 400，Nemotron-H 例子里到 4224）。这也是 PD 限制的来源：HMA（Hybrid Memory Allocator，混合内存分配器）要求两端 block size 一致。\n\n### 跑通一个模型要三件套\n\n**定义**：模型类（认识权重）+ 专用 attention backend（mamba1/mamba2/short_conv/linear/gdn，知道这层怎么算）+ 缓存规格 MambaSpec（知道留多大、留几种状态）。\n\n**机制**：缺任一环就退回 eager（逐算子跑、不图捕获；CUDA graph 则是把一串算子录成一张可重放的图）。V1 早期把 Mamba 标成 V0-only（V1 是新引擎，V0 是旧引擎），根子就在这里：缓存管理器和 backend 都假设「一个 token 一格 KV」，没有 MambaSpec 这种规格可写。以主干[支持模型列表](https://github.com/vllm-project/vllm/blob/main/docs/models/supported_models.md)为准：Mamba/Mamba2（含 Codestral）、Jamba、NemotronH、FalconMamba、GraniteMoeHybrid、KimiLinear 在列；Zamba 初代不在；Hymba 在列表和注册表里都查不到（未能核实，可能走 Transformers 后端回退）。\n\n### chunked prefill：块间要接力\n\n**定义**：长 prompt 切块算，块与块之间必须显式传初始状态。\n\n**直觉**：Transformer 的块只通过 KV 通信，谁先谁后无所谓；Mamba 的块是流水线工序，上一块的出口状态就是下一块的入口。\n\n**机制**：当前接口传 cu_chunk_seqlen 与 last_chunk_indices；老接口叫 block_idx_first_scheduled_token / initial_state_idx。v0.10.2 还有一条 bugfix「Fix mamba2 prefill chunking」（#23279），说明这条路是踩过坑才通的。\n\n这件事三篇各讲一面：数学在[[模型演进：从 S4 到 Mamba-2，再到 GDN / KDA 等混合模型|模型演进篇]]「并行扫描与 chunked scan」——仿射映射 (a,b) 的复合是 (a₂a₁, a₂b₁+b₂)，常数项记 b_t，别和 delta rule 的学习率 β_t 混用；框架在本篇；昇腾上 chunk_state / chunk_state_passing 怎么落成算子，见[[硬件：昇腾 NPU 上跑 Mamba 有什么特殊点|硬件篇]]「分段扫描与六个算子」。\n\n### APC：只能从「状态点」恢复\n\n**定义**：APC（自动前缀缓存）按 token 块 hash 复用前缀；Mamba 状态只在 block 边界写成实际张量，所以命中只能落在 block 边界。\n\n**机制**：`--enable-mamba-shared-prefix-checkpoint` 在共享前缀结束处额外存一个检查点，默认关。要生效需同时满足：APC 已开；Mamba 组上有 EAGLE/MTP；`--prefix-match-unit` 小于 block size；模型不用多模块 MTP。EAGLE 是用小模型在特征层先猜几个 token，MTP（Multi-Token Prediction）是模型自带的多 token 预测头，两者都是投机解码。\n\n**存疑**：v0.10.2 默认对 hybrid/Mamba 关掉 APC（#23716），v0.11.0 的 v1_guide 仍写「prefix caching is not yet supported」，而主干 APC 文档又在讲 checkpoint 开关——两份官方文档口径不一。只信自己版本的 `--help` 与启动日志。\n\n### 投机回滚：num_accepted_tokens\n\n**定义**：投机解码里被拒 token 对应的状态推进要撤销，把状态退到第 j 个被接受 token 的位置。\n\n**机制**：KV 是只读的，验证完丢掉多余位置就行；状态是「已经走过」的，走错了得倒带。selective_state_update 的 num_accepted_tokens 就是「上一步接受几个」，用它选初始状态；causal_conv1d_update 也有同名参数，卷积窗口按接受数滑动。\n\n### 量化与 PD 的边界\n\n- **W8A8**：只压 Linear（in_proj/out_proj/x_proj 可以量化），A、Δ、状态更新通常保持高精度。Mamba2 的 TP（张量并行）+量化要求 n_groups（B/C 按组共享的组数）能被 tp_size 整除，见 [#24593](https://github.com/vllm-project/vllm/pull/24593)。\n- **PD 分离**：prefill 实例交给 decode 的不是纯 KV，而是装着 KV + conv/ssm state 的 block。NIXL（PD 间传 KV 的库）兼容表把 Hybrid SSM/Mamba 列为基础可用，但 HMA 要求两端 block size 一致，PP（流水线并行）+hybrid 不支持，投机解码一栏是「未验证」。\n\n## 版本时间线：把「哪版有什么」钉住\n\n下表只覆盖 2025 年 0.10–0.11；之后的版本以自己 pin 的 tag 为准。\n\n| 版本 / 时间 | PR（合并） | 改了什么 | 可核对引文 |\n| --- | --- | --- | --- |\n| v0.10.0（07-24） | #21194（07-18） | Mamba 层支持分段 CUDA graph（piecewise） | release notes 列 \"Enable piecewise CUDA Graph for mamba layers\" |\n| v0.10 文档线（07-19） | #21233（仅文档） | 去掉 **hybrid** 的 enforce_eager 限制，不涉及 Mamba-1 | PR 标题 \"remove enforce_eager limitation for hybrid models\"；v0.10.0 文档已无此要求 |\n| v0.10.1（08-18） | #21249 | Mamba-1/Jamba 进 V1，但没有 CUDA graph | release notes \"... (without CUDA graphs)\"；v1_guide \"Mamba-1 models require `enforce_eager=True`\" |\n| v0.10.1 | #21401 | Mamba 层 decode-only 全图 | release notes |\n| v0.10.2（09-13） | #22594 / #23035 / #23650 / #23716 | hybrid 默认全图 / Mamba1 全图 / V1 设为 Mamba 默认 / 默认关 hybrid-Mamba APC | release notes 四条 |\n| v0.10.2 | — | v1_guide 删除 \"Mamba-1 ... enforce_eager=True\" | 对比 v0.10.1 与 v0.10.2 同文件 |\n| v0.11.0（10-02） | #24593 | Mamba2 TP+量化 | \"n_groups % tp_size == 0\" |\n| v0.11.0 | 多个 V0 deprecation PR | V0 引擎移除 | \"completes the removal of V0 engine\" |\n\n**#21233 与 #22594/#23035 的关系**：前者只是文档改动（v0.10 文档线），改的是 hybrid（Mamba-2 + attention），那时 Mamba-1 还没进 V1；Mamba-1 在 v0.10.1 才进来且没有 CUDA graph，所以文档保留 enforce_eager；v0.10.2 的 #23035 让 Mamba-1 也能全图捕获，#22594 让 hybrid 默认全图，这句话才被删。第三篇说「时间线未核实」，本篇只钉到 tag 文档、PR 标题、release notes 能对上的粒度；更细的 kernel 行为仍标存疑。\n\n## 昇腾入口\n\nQwen3.5-27B 是 dense hybrid（GDN + full attention；GDN 即 Gated DeltaNet），教程写明最低 vllm-ascend v0.17.0rc1；Qwen3.6-27B 才是 v0.18.0rc1——第三篇引的 v0.18.0 对应后者。Qwen3-Next 在支持矩阵里标 🔴 Unmaintained，教程原文「discontinued since vLLM Ascend v0.30.0」：这是已发布的停止维护，不是计划；v0.30.0 release notes 未单列这条，依据是模型教程与支持矩阵。GDN 的 prefill 分块算、decode 逐步更新状态；昇腾侧的前缀缓存适配见 [PR #8829](https://github.com/vllm-project/vllm-ascend/pull/8829)，融合算子与 Triton 回落的差异无公开数字。\n\n## 一步一步理解\n\nJamba-v0.1，prompt 8000 token，生成 500：\n\n1. **进调度器**：两套缓存分开管，attention 要 KV、Mamba 要 state，按缓存组（cache group）分配。\n2. **chunked prefill**：切成两块 4096。第一块算完把块末状态写进状态 block，第二块读回来当初值——这就是接力。\n3. **decode 第一步**：attention 层从 KV 取 8000 个位置；Mamba 层不读历史，只读 conv_state 与 ssm_state，跑一次 selective_state_update。\n4. **显存账**：KV 16 KiB × 8000 ≈ 125 MiB；32K 时 512 MiB；状态 8.3 MiB，涨到 128K 也不动。\n5. **并发账**：状态随并发线性涨（8.3 MiB × 并发），KV 随「并发 × 长度」涨；纯 Mamba 没有 KV，高并发时状态会成为新瓶颈，混合模型则看层比与上下文长度。\n6. **开投机**：一次验证 5 个草稿 token，接受 3 个 → num_accepted_tokens=3，状态回到第 3 个被接受 token 的位置。\n\n## 常见误区\n\n1. **「Mamba 没有缓存，显存不用管。」** 错。有 conv_state + ssm_state，只是 O(1)；Mamba-Codestral 约 128 MiB/序列，200 并发就约 25 GiB。\n2. **「省 8 倍是 Mamba 的魔法。」** 错。8 = 总层数 ÷ attention 层数，Jamba 恰好 1:7；层比不同结果就变，短上下文甚至不省。\n3. **「V1 早就支持 Mamba。」** 错。2025-04 论坛还在问、v0.10.0 文档写 Mamba-1 不支持；v0.10.1 才进 V1（无图），v0.10.2 才补上 Mamba-1 全图、让 hybrid 默认全图并把 V1 设为 Mamba 默认，v0.11.0 才删掉 V0。\n4. **「vLLM 支持 Mamba = 全家都能跑。」** 错。Hymba 未查到原生支持，Zamba 初代不在，Kimi Linear 走 KDA（Kimi Delta Attention）自己的 backend。\n\n## 一句话总结\n\nvLLM 把 Mamba 当成「另一种缓存」接进 V1：O(1) 状态替 O(L) KV，prefill/decode 不变，但分页、接力、边界复用、回滚都得围绕「状态点」重做；省下的是显存与带宽，付出的是精度与工程复杂度。\n\n## 自测题\n\n### 1. 为什么 Mamba 的 prefix cache 默认只能从 block 边界恢复？\n\n<details><summary>查看答案<\/summary>\n\nKV 每个 token 位置都有独立副本，切块粒度可以很细；Mamba 状态是「整段前缀揉成的一个点」，没存过就恢复不出来。vLLM 把状态存在 block 网格上，所以默认命中只能落在 block 边界。要让「前缀在 block 中间结束」也能复用，得开 `--enable-mamba-shared-prefix-checkpoint` 在共享前缀结束处补一个 checkpoint，代价是额外存储，而且要求 APC 已开、EAGLE/MTP 在 Mamba 组上、`--prefix-match-unit` 小于 block size，且不是多模块 MTP。\n\n<\/details>\n\n### 2. Jamba-v0.1 有 32 层、其中 4 层 attention，每层每 token 的 KV 约 4 KiB；32K 上下文的 KV 是多大？\n\n<details><summary>查看答案<\/summary>\n\n每 token = 4 层 × 4 KiB = 16 KiB；32K = 32768 token，16 KiB × 32768 = 512 MiB。同规模全 attention 是 32 层 × 4 KiB = 128 KiB/token，32K 约 4 GiB。所以 Jamba 的 KV 是全 attention 的 1/8，不是 1/2。状态侧约 8.3 MiB，与长度无关；交叉点约 530 token。\n\n<\/details>\n\n### 3. 投机解码在 Mamba 上为什么不能照搬 Transformer 的验证？\n\n<details><summary>查看答案<\/summary>\n\nTransformer 验证 k 个 draft token 时只读 KV，被拒的位置直接丢掉即可；Mamba 的状态是递推出来的，验证时状态已经「走过」k 个位置，只接受 j 个就必须把状态推进到第 j 个被接受 token 的位置、丢弃被拒 token 的改动。所以 decode 算子要接受 `num_accepted_tokens`，按接受数选初始状态。\n\n<\/details>\n\n### 4. chunked prefill 对 Mamba 多做了什么？三篇各讲哪一面？\n\n<details><summary>查看答案<\/summary>\n\n多了一次状态接力：每个 chunk 算完要把块末状态写进 cache，下一个 chunk 读回来当初始状态；调度器还要告诉算子这次覆盖哪些 block、从哪个 block 读初值（`cu_chunk_seqlen` / `last_chunk_indices`，老接口 `block_idx_*` 与 `initial_state_idx`）。模型演进篇讲数学（仿射复合、块内矩阵合成），本篇讲调度与缓存，硬件篇讲 chunk_state / chunk_state_passing 怎么在昇腾上落成算子。\n\n<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| conv_state | 短因果卷积的窗口尾巴（K−1 步），Mamba 缓存的一半，形状 (conv_dim, K−1) |\n| ssm_state | 每层定长循环状态 (heads, head_dim, d_state)，不随上下文变长 |\n| 状态分页 / block table | 状态与 KV 共用分页内存池、按 block id 索引；block table 是逻辑块到物理块的映射；一个序列任一时刻只有一份当前状态 |\n| HMA（Hybrid Memory Allocator） | 混合内存分配器：按层类型分组、共用物理页，把 full attention（FA）的 block_size 抬到不小于 SSM 页，再给 SSM 补齐（padding） |\n| MambaSpec | 混合模型的缓存规格：声明每层要几种状态、各多大，缺它缓存管理器只能按 KV 假设分配 |\n| chunked prefill 状态接力 | 块间显式传初始状态（cu_chunk_seqlen / 老接口 initial_state_idx） |\n| selective_scan / selective_state_update | prefill 的分块扫描 / decode 的单步状态更新，两个 Triton 算子 |\n| causal-conv1d | 把短因果卷积融合成一个算子，否则滑窗小算子会拖垮长序列 |\n| APC / mamba prefix checkpoint | 状态只能从 block 边界恢复，故可额外存检查点；默认关，且要求 EAGLE/MTP |\n| EAGLE / MTP | 两类投机解码：EAGLE 用小模型在特征层先猜 token；MTP 是模型自带的多 token 预测头 |\n| num_accepted_tokens | 投机解码「上一步接受几个」，用它把状态回滚到第 j 个被接受 token |\n| n_groups | Mamba2 中 B/C 按组共享的组数；TP+量化要求 n_groups % tp_size == 0 |\n| W8A8 | 权重与激活都压到 8 bit，只作用在 Linear；A/Δ/状态更新通常保高精度 |\n| GDN / KDA | Gated DeltaNet（Mamba-2 + delta rule，写入前先按 key 擦旧值）与 Kimi Delta Attention（逐通道门控），补精确召回 |\n| d_state / d_inner | 每通道的状态维度 / 内部通道维度；状态大小 ≈ d_inner × d_state 个数，是显存账的乘数 |\n| head_dim / KV 头 | 每个头的维度 / K、V 的头数；KV 每 token ≈ 2 × KV 头 × head_dim × 字节 |\n| 仿射复合 (a, b) | h_out = a·h_in + b；复合 (a₂,b₂)∘(a₁,b₁) = (a₂a₁, a₂b₁+b₂)。b 是常数项，不是 delta rule 的学习率 β |\n\n## 还没想清楚\n\n- **未能核实｜Hymba**：主干注册表与支持列表里都查不到 `HymbaForCausalLM`，Hugging Face 模型卡片却提到 vLLM 用法，可能走 Transformers 后端回退；没跑通，不下结论。\n- **存疑｜Mamba 前缀缓存的当前默认**：APC 文档讲 checkpoint 开关，v0.11.0 的 v1_guide 仍写「not yet supported」，代码默认值没核对；只信自己版本的 `--help` 与启动日志。\n- **未能核实｜昇腾 GDN 融合算子与 Triton 路径的数值/性能差异**：没找到公开数字，不写成结论。\n\n## 来源\n\n- [vLLM v1_guide @ v0.10.0](https://github.com/vllm-project/vllm/blob/v0.10.0/docs/usage/v1_guide.md)\n- [vLLM v1_guide @ v0.10.1](https://github.com/vllm-project/vllm/blob/v0.10.1/docs/usage/v1_guide.md)\n- [vLLM v1_guide @ v0.10.2](https://github.com/vllm-project/vllm/blob/v0.10.2/docs/usage/v1_guide.md)\n- [vLLM v1_guide @ v0.11.0](https://github.com/vllm-project/vllm/blob/v0.11.0/docs/usage/v1_guide.md)\n- [vLLM v0.10.0 release notes](https://github.com/vllm-project/vllm/releases/tag/v0.10.0)\n- [vLLM v0.10.1 release notes](https://github.com/vllm-project/vllm/releases/tag/v0.10.1)\n- [vLLM v0.10.2 release notes](https://github.com/vllm-project/vllm/releases/tag/v0.10.2)\n- [vLLM v0.11.0 release notes](https://github.com/vllm-project/vllm/releases/tag/v0.11.0)\n- [PR #21233（hybrid 文档去掉 enforce_eager）](https://github.com/vllm-project/vllm/pull/21233)\n- [PR #22541（mamba_ssm 移出核心依赖）](https://github.com/vllm-project/vllm/pull/22541)\n- [PR #23035（Mamba1 全图）](https://github.com/vllm-project/vllm/pull/23035)\n- [PR #23716（默认关 hybrid/Mamba APC）](https://github.com/vllm-project/vllm/pull/23716)\n- [PR #24593（Mamba2 TP+量化）](https://github.com/vllm-project/vllm/pull/24593)\n- [vLLM 源码 ops/mamba_ssm.py](https://github.com/vllm-project/vllm/blob/main/vllm/model_executor/layers/mamba/ops/mamba_ssm.py)\n- [vLLM 源码 ops/causal_conv1d.py](https://github.com/vllm-project/vllm/blob/main/vllm/model_executor/layers/mamba/ops/causal_conv1d.py)\n- [Hybrid KV cache manager 设计文档](https://github.com/vllm-project/vllm/blob/main/docs/design/hybrid_kv_cache_manager.md)\n- [APC 文档（Hybrid Mamba models）](https://github.com/vllm-project/vllm/blob/main/docs/features/automatic_prefix_caching.md)\n- [NIXL PD 兼容表](https://github.com/vllm-project/vllm/blob/main/docs/features/nixl_connector_compatibility.md)\n- [vLLM 博客：Hybrid SSM 的 PD 分离（HMA）](https://vllm-project.github.io/2026/04/21/hybrid-ssm-disagg.html)\n- [Jamba-v0.1 config](https://huggingface.co/ai21labs/Jamba-v0.1/blob/main/config.json)\n- [Mamba-Codestral-7B config](https://huggingface.co/mistralai/Mamba-Codestral-7B-v0.1/blob/main/config.json)\n- [vllm-ascend Qwen3.5-27B / Qwen3.6-27B 教程](https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/tutorials/models/Qwen3.5-27B-Qwen3.6-27B.md)\n- [vllm-ascend Qwen3-Next 教程（停止维护说明）](https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/tutorials/models/Qwen3-Next.md)\n- [vllm-ascend v0.30.0 release notes](https://github.com/vllm-project/vllm-ascend/releases/tag/v0.30.0)\n- [vllm-ascend 支持矩阵](https://github.com/vllm-project/vllm-ascend/blob/main/docs/source/user_guide/support_matrix/supported_models.md)\n- [vllm-ascend PR #8829（GDN 前缀缓存）](https://github.com/vllm-project/vllm-ascend/pull/8829)\n- [vLLM 论坛：Why V1 not support Mamba Models?（2025-04-21）](https://discuss.vllm.ai/t/why-v1-not-support-mamba-models/496)", "term_count": 17, "source_count": 28}, {"date": "2026-11-03", "title": "硬件：昇腾 NPU 上跑 Mamba 有什么特殊点", "topic": "Mamba 家族与混合架构", "topic_id": "mamba-family", "part": "ascend", "part_title": "硬件：昇腾 NPU 上跑 Mamba 有什么特殊点", "order": 3, "tags": ["昇腾 NPU", "Mamba", "GDN", "roofline", "vllm-ascend", "混合架构"], "markdown": "# 硬件：昇腾 NPU 上跑 Mamba 有什么特殊点\n\n> 读完这篇，你能：说清 scan 为什么喂不饱 Cube；复算 chunk 的算术强度，判断瓶颈在带宽还是算力；分清「总搬运量」与「单位字节算术强度」，不再把「省显存」当成「一定更快」。\n\n## 为什么需要它\n\nattention 的 prefill 是几个大矩阵乘，M 有几千行，Cube 吃得满。Mamba / GDN（Gated DeltaNet：Mamba-2 的选择性衰减 + delta rule 定向写入，[ICLR 2025](https://arxiv.org/abs/2412.06464)）换了一种算法：不存 KV，只维护固定大小的循环状态，每来一个 token 更新一次。它在 GPU 上有成熟的 Triton kernel，搬到昇腾上就冒出三个问题：为什么「能跑但不快」；为什么为 Mamba-2 prefill 写六个算子；混合模型里哪一半拖后腿。\n\n主线只有一条：**scan 的计算形状和 Cube 的形状不匹配**。判断瓶颈用 roofline，能并行的数学依据是结合律。\n\n## 核心概念\n\n### 达芬奇 Cube / Vector\n\nCube 是昇腾 AI Core 里的矩阵单元，一条指令完成一个 16×16×16 块乘加（FP16 下 4096 次乘加）；Vector 做加法、乘、指数、归一化这类逐元素运算。Cube 像必须整托盘进出的压铸机，吞吐高但要来料成块；Vector 像手工工位，什么都能干，一次只动一小把。\n\n要让 Cube 跑满，M、N、K 都得切成 16 的倍数，数据还得在片上反复复用。scan 每步只做「128×128 状态矩阵 × 128 维向量」，M=1，16 行里 15 行闲着，只能退回 Vector。不是昇腾特别差，是 scan 天生喂不饱矩阵单元。\n\n### 逐元素算子与 roofline 脊点\n\n算术强度 = 计算量（FLOP）÷ 搬运字节数；roofline 给的上界是 `min(峰值算力, 带宽 × 算术强度)`，两条线的交点是脊点：左侧带宽受限，右侧算力受限。\n\n手算 decode 的 scan（单头，Dk=Dv=128，bf16）：状态 S 是 128×128×2 B = 32 KiB，读+写 64 KiB；计算是三次「矩阵 × 向量」（S·k、S·q、外积更新），约 3×2×128² ≈ 9.8 万 FLOP。算术强度 ≈ **1.5 FLOP/Byte**。910B 量级取 FP16 峰值 3×10¹⁴ FLOP/s、HBM 1.2–1.6 TB/s（厂商与评测口径，**存疑**），脊点 ≈ 3×10¹⁴ ÷ (1.2–1.6×10¹²) ≈ **190–250 FLOP/Byte**——差了约两个数量级。所以这类算子的方向是**少搬数据**（融合、块化、让状态留在片上），不是堆算力。\n\n### 仿射映射复合\n\nGDN / Mamba-2 的状态更新可以写成仿射映射 `S ↦ A_t·S + b_t`；两个仿射映射复合仍是仿射映射：`(A₂,b₂)∘(A₁,b₁) = (A₂A₁, A₂b₁+b₂)`，满足结合律 `(a∘b)∘c = a∘(b∘c)`——这就是并行扫描（O(log n) 步）的数学依据。注意 A 是 128×128 矩阵，扫的是矩阵；只有衰减为标量时才退化成 (α, β) 二元组。\n\n### WY / UT 变换与 chunk 化\n\n块内一串 rank-1 修正要先用 WY / UT 变换合成一个矩阵，才变成一次块级 GEMM；序列切成长 L 的块后，块内一次算完，块间只传一个 O(1) 的状态矩阵。\n\n块内是 `qkᵀ`、`attn@v` 这类 L×L×D 的 GEMM，Cube 吃得上。下面这组是**纸面推算、非实测**，但可逐步复算：计算量按 **4L²D + 4LD²** FLOP；口径 A 只算读入 q/k/v/o 四个张量（bf16 每元素 2 字节，共 **8LD 字节**），不含状态读写、也不含输出写回。于是 AI = (4L²D + 4LD²)/(8LD) = **(L + D)/2**。取 D=128：\n\n| L | 口径 A（8LD 字节） | 口径 B（10LD + 4D² 字节） |\n| --- | --- | --- |\n| 128 | 128 | ≈73 |\n| 256 | 192 | 128 |\n| 512 | 320 | ≈233 |\n\n口径 B 把 o 写回（2LD 字节）和状态 S 的读+写（4D² 字节）也算进分母，AI = 2L(L+D)/(5L+2D)，同样可代入。\n\n**结论要用区间，不要用单一阈值**：脊点 190–250 本身是**存疑**值。口径 A 下，越过脊点需要 L ≈ 2×脊点 − D，即 L ≈ 252–372：L=256 贴着下沿，L=512 已越过。口径 B 下要 L ≈ 407–555 才越过，L=512 只是刚进入脊点区间。所以「L=256 贴着脊点下沿、仍偏带宽」是稳的，「L=512 一定算力受限」则取决于口径与脊点。另外，块内串行、UB 吃紧，L 不能无限加大：MindSpeed 的 Mamba-3 反向算子在 `N*P > 8192` 时状态装不进 UB，只能放回 HBM 分块扫（[MindSpeed 文档](https://raw.gitcode.com/Ascend/MindSpeed-Ops/raw/485c0c5b7e820b871a8d155a00be181a778f2e83/docs/triton/mamba3_mimo_bwd_bwd.md)）。\n\n### chunk_state / chunk_state_passing\n\nchunk_state 算「本块自身贡献的状态」，chunk_state_passing 把上一块状态按块衰减后接力。CANN 的 ops-transformer 为 Nemotron-H 写了六个 prefill 算子：`mamba2_causal_conv1d`、`mamba2_chunk_cumsum`、`mamba2_chunk_state`、`mamba2_chunk_state_passing`、`mamba2_chunk_scan`、`mamba2_rmsnormgated`。卷积、cumsum、gated RMSNorm 走 Vector；含矩阵乘的三个走 Cube。文档写明仅 prefill、910B、FP32/FP16、BSND、chunk_size 固定 256、S 需先 pad 到 chunk 整数倍（**已确认**，见[算子目录说明](https://raw.gitcode.com/cann/ops-transformer/raw/6e58fff992f58811c28a075db589eb81367065d0/experimental/mamba/Readme.md)）。\n\n### CVCV 融合与 VC 并行\n\n官方原话是 chunk_scan「包含两个 matmul 和两部分 vector 计算，因此实现为 CVCV 融合算子，通过 VC 并行提升计算性能」（[原文](https://raw.gitcode.com/cann/ops-transformer/raw/9.1.0/experimental/mamba/mamba2_chunk_scan/README.md)）。本质是**不硬算 scan**：改写成 Cube 的 GEMM + Vector 的逐元素，再让两条流水重叠掩盖空闲——这是昇腾路线的核心。\n\n### Ascend C 自定义算子与 aclnn\n\nAscend C 是写昇腾算子的框架，按 op_host（原型、tiling、shape 推导）+ op_kernel（核函数）组织，编成 CANN 的 aclnn 接口，再由 torch-npu 包成 Python 函数。vllm-ascend PR #12607 是完整样例：在 `csrc/attention/chunk_gated_delta_rule/` 写核函数，注册到 `ascend910b`/`ascend910_93`/`ascend950`，用 `EXEC_NPU_CMD(aclnnChunkGatedDeltaRule, ...)` 调用，输入是 TND、bf16（[PR #12607](https://github.com/vllm-project/vllm-ascend/pull/12607)）。看清这条流水线，就知道「支持一个模型」要补哪几层。\n\n### TND 布局与算子 fallback\n\nTND 把变长序列首尾相接拼成 `(T=ΣLᵢ, 头数, 头维)`，不做 padding，用 `actual_seq_lengths` 记边界。fallback 指布局、精度、维度任一不满足就退回 Triton/FLA 或直接报错——「有算子 ≠ 能跑」。`torch_npu.npu_chunk_gated_delta_rule` 的约束是硬清单（**已确认**）：仅推理、TND、q/k/v/beta 全 bf16、`Nk/Nv ≤ 64` 且 `Nv % Nk == 0`、`Dk/Dv ≤ 128`、q/k 归一化到 [−1,1]、g∈[−1,0]、beta∈(0,1)、TND 下 beta/initial_state/actual_seq_lengths 必传、fp32 状态仅 950 支持（[API 文档](https://raw.githubusercontent.com/ascend/op-plugin/abd599370b927e60f98669456d8655725ba8c974/docs/zh/custom_APIs/torch_npu/torch_npu-npu_chunk_gated_delta_rule.md)）。\n\n### 支持矩阵\n\n| 栈 | 支持什么 | 限制 |\n| --- | --- | --- |\n| CANN ops-transformer | Mamba-2 prefill 六算子，910B | 仅 prefill、BSND、chunk 固定 256 |\n| torch-npu | `npu_chunk_gated_delta_rule`，950/A3/A2 | 仅推理、TND、bf16、头维与头数上限 |\n| vllm-ascend | Qwen3-Next（GDN 混合，80B-A3B）自 v0.10.2rc1 支持，走 Triton Ascend（实验）；AscendC 版 chunk GDR（PR #12607）；KDA 有 `kimi_kda.py`（prefill `chunk_kda_fwd` + decode `recurrent_kda`） | 见下方版本脚注 |\n| MindSpore / MindSpeed | 未见官方一等公民的 GDN 文档（**未核实**）；MindSpeed-Ops 有 Triton 版 Mamba-3 反向算子 | 仅 arch32，chunk 16 |\n| 上游 vLLM | V1 有 `mamba_utils`、Jamba 模型、hybrid memory allocator（RFC #11382） | 进 V1 的版本时间线**未核实** |\n\n**版本脚注**：表中前缀缓存 / PD 分离的判断按 **v0.18.0 支持矩阵**口径，只代表该时点。**此后 PR #8829 为 GDN 增加了前缀缓存，支持 `mamba_cache_mode` 的 align / all 两种模式；all 模式下投机解码会回退到 align**（据本专题姊妹篇，本篇未独立复核）。所以「空白」「已实现」都能成立，取决于版本与模式——读矩阵先问这两件事。\n\n## 一步一步理解\n\n拿 Qwen3-Next（GDN + gated attention 的混合 MoE，80B-A3B）走一遍。官方口径：A3-752T 两节点、TP4、2k/2k、并发 32，**580 tokens/s，TPOT 54 ms**（[官方文档](https://docs.vllm.ai/projects/ascend/en/v0.18.0/tutorials/models/Qwen3-Next.html)，未独立复核）。\n\n**第一步，先判断哪半好跑。** attention 那半已经成熟：FlashAttention/MLA、KV 分页、前缀缓存、PD 分离在矩阵里都是 ✅。GDN 那半要弱一档，但必须按版本拆：v0.18.0 的支持矩阵里，Qwen3-Next 的 chunked prefill、前缀缓存、投机解码、PD 分离都是空白；其中**前缀缓存**在 v0.18.0 之后由 PR #8829 补上了 GDN 版本（align/all 模式），本篇未独立复核；**投机解码**在 all 模式下会回退到 align；**chunked prefill 与 PD 分离**仍属「没验证过」，不是「不行」。先分清你要的功能落在哪半、哪个版本。\n\n**第二步，缺口还是带宽。** 80B-A3B 每 token 激活约 3B，bf16 约 6 GB，TP4 每卡约 1.5 GB；按单卡 1.6 TB/s 量级，读权重的时间下限在 1 ms 量级。实测 TPOT 54 ms，差了约 50 倍（**推算，未实测**）。瓶颈不在读权重，而在调度、MoE 通信、GDN 那半的算子与布局。这是 roofline 的正确用法：先排除，再 profile。\n\n**第三步**：先跑通（`vllm serve`，TP4，`--max-model-len 32768`）→ 对齐输出（官方 gsm8k 95.53，AISBench gen 口径）→ 压 TTFT/TPOT → 最后 profile。\n\n**第四步，profiler**：算子耗时 Top（`causal_conv1d` + `chunk_scan` + recurrent GDN 占比）、AI Core 利用率（低且耗时高 = 在等数据）、每轮 HBM 读写字节（远超权重 = 状态/KV 反复搬）。scan 系占比不到 10%，优化收益上限就是 10%；Vector 高而 Cube 空转，查 fallback。\n\n**值得**：长上下文（状态与长度无关）、decode 带宽受限且 batch 起不来、显存吃紧，或模型本就是混合架构。**不值得**：短 prompt（GEMM 本来就跑得好）、强精确检索与逐字复制（状态不是无损记忆）、依赖成熟的投机解码/PD 分离全家桶、布局精度落在约束外（非 bf16、头维超 128）。\n\n**三天验证清单**：第 1 天跑通 + 对齐输出（差 1 点以内）；第 2 天压 TTFT/TPOT（固定长度，并发 1/8/32，记口径）；第 3 天 profile，出「算子占比 + 利用率 + HBM 流量」三张表，再决定换算子、改布局还是换模型。数字都标来源与口径，没实测写「未核实」。\n\n## 常见误区\n\n1. **「有算子就等于能跑」**：bf16、TND、`Dk/Dv ≤ 128`、`Nv % Nk == 0`、q/k 归一化，少一条就 fallback 到 Triton 或直接报错。矩阵里一个 ✅ 背后是一整串条件。\n2. **「Mamba 更省，所以在 NPU 上也一定更快」**：要拆成两件事。**总搬运量**上 SSM 确实大赢：decode 每步不再读随长度线性增长的 KV，只读固定大小的状态（姊妹篇的例子：每步 512 MiB KV → 8.3 MiB 状态），长上下文下差数量级，这是实打实的带宽收益。但**单位字节的算术强度**只有约 1.5 FLOP/Byte，仍比脊点低两个数量级，所以它依旧带宽受限。正确说法：SSM 减少的是搬运字节总数，不是每字节的计算密度；优化只能继续减少搬运（融合、块化、状态留片上），不能把算术强度提到算力受限区。快不快，取决于长度、batch 与 kernel 是否兑现。\n3. **「chunk 越大越好，把 FLA 的 chunk size 直接搬过来」**：CANN 的 Mamba-2 算子固定 256、vllm-ascend 的 GDR 核用 64、MindSpeed 的 Mamba-3 用 16。chunk 越大算术强度越高，但块内串行变长、UB 装不下就得落 HBM——这是超参，不是常数。\n\n## 一句话总结\n\n昇腾上跑 Mamba 的特殊点只有一条主线：scan 是低算术强度的逐元素/串行计算，喂不饱 Cube；解法是 chunk 化——块内 GEMM 走 Cube、块间传状态走 Vector，再用 CVCV 与 VC 并行掩盖空闲。SSM 赢在总搬运量小，输在每字节算术强度低；值不值得，看瓶颈是不是带宽和显存。\n\n## 自测题\n\n### 1. L=256、D=128，只读 q/k/v/o（bf16），chunk 的算术强度是多少？脊点取 190–250 时它越过脊点了吗？\n\n<details><summary>查看答案<\/summary>AI = (4L²D + 4LD²)/(8LD) = (L+D)/2 = (256+128)/2 = **192**。脊点 190–250 时，192 贴着下沿，仍偏带宽侧；若把状态读写和输出写回也算进分母（口径 B），AI 降到 128，更明确地在带宽侧。L=512 时口径 A 为 320、口径 B 约 233——是否「越过」取决于口径与脊点，不要用一个阈值下结论。<\/details>\n\n### 2. 为什么 decode 的 scan 算术强度只有 1.5，而 chunk 内能到 100 以上？\n\n<details><summary>查看答案<\/summary>decode 每步 M=1，只有三次「矩阵×向量」，FLOP 是 O(D²)，字节是状态读+写 4D²，AI ≈ 1.5；chunk 内是 L×L×D 的 GEMM，FLOP 含 L² 项，计算量按 L² 涨、搬运按 L 涨，AI 线性上升（(L+D)/2）。这就是 chunk 化的意义：把串行 scan 改写成 Cube 吃得下的块级 GEMM。<\/details>\n\n### 3. 同事说「vllm-ascend 的 Qwen3-Next 前缀缓存是空白，所以不能用」。怎么纠正？\n\n<details><summary>查看答案<\/summary>先问版本与模式。v0.18.0 的支持矩阵里该行确实空白；但此后 PR #8829 增加了 GDN 前缀缓存，支持 `mamba_cache_mode` 的 align/all 两种模式（本篇未独立复核）；all 模式下投机解码会回退到 align；chunked prefill 与 PD 分离仍属未验证。正确说法是「v0.18.0 时点空白，之后前缀缓存在 align/all 下可用，但投机解码与 PD 分离另有边界」，而不是一句「空白」或「已实现」。<\/details>\n\n### 4. 「Mamba 显存省，所以在 NPU 上更快」这句话错在哪？什么情况下它对？\n\n<details><summary>查看答案<\/summary>省的是显存容量和总搬运量，不是单位字节的算术强度。长上下文 decode 时每步只读固定大小的状态，而不是线性增长的 KV，总字节大幅下降，这是真实的带宽收益；但这些字节上的 AI 只有约 1.5，远低于脊点，所以仍然带宽受限，kernel 优化只能减少搬运、不能把它推进算力受限区。长度长、batch 起得来、kernel 融合到位时，「更省」才兑现成「更快」；短 prompt 或强依赖投机解码/PD 分离时未必。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| 达芬奇 Cube / Vector | Cube 一拍一个 16×16×16 乘加，要凑满块；Vector 做逐元素，灵活但吞吐低 |\n| 算术强度 / roofline 脊点 | FLOP÷字节；上界 min(算力, 带宽×算术强度)，交点左侧带宽受限 |\n| 仿射映射复合 | (A₂,b₂)∘(A₁,b₁)=(A₂A₁, A₂b₁+b₂)，结合律是并行扫描的依据 |\n| WY / UT 变换 | 把块内一串 rank-1 修正合成一个矩阵，变成块级 GEMM |\n| chunk_state / state_passing | 块内算自身状态、块间只传状态矩阵，六算子按此分工 |\n| CVCV 融合 / VC 并行 | 算子内 Cube→Vector→Cube→Vector 交替，两条流水并行掩盖空闲 |\n| Ascend C / aclnn | 写核函数、注册进 CANN 成 aclnn 接口，torch-npu 再包成 Python 函数 |\n| TND 布局 | 变长序列拼成（总 token, 头, 头维）不 padding，很多昇腾算子的硬约束 |\n| 算子 fallback | 布局/精度/维度不满足就退回慢路径或报错，即「有算子 ≠ 能跑」 |\n| 支持矩阵 | 各栈在哪个版本、哪个阶段支持什么、限制在哪 |\n| GDN / KDA | GDN：ICLR 2025（arXiv:2412.06464）；KDA：Kimi Linear 的线性注意力（arXiv:2510.26692） |\n\n## 还没想清楚\n\n- **已确认**：六个 Mamba-2 算子只覆盖 prefill、chunk 256、BSND；torch-npu 的 GDR 只覆盖 TND/bf16。\n- **存疑**：910B 的 FP16 峰值与 HBM 带宽没有官方精确值，脊点 190–250 只是量级值；文中算术强度是纸面推算（口径 A/B 都已写明），不是实测。\n- **未核实**：六个算子是否被 vllm-ascend 默认路径调用；PR #8829 的 align/all 语义与投机回退（转述姊妹篇，未独立复核）；纯 Mamba 与同规模 Transformer 的端到端对比；KDA 的端到端性能；MindSpore 原生 GDN 算子是否存在。\n\n## 来源\n\n- [CANN ops-transformer · MambaV2 算子目录说明](https://raw.gitcode.com/cann/ops-transformer/raw/6e58fff992f58811c28a075db589eb81367065d0/experimental/mamba/Readme.md)\n- [mamba2_chunk_scan 算子说明（CVCV 融合、VC 并行）](https://raw.gitcode.com/cann/ops-transformer/raw/9.1.0/experimental/mamba/mamba2_chunk_scan/README.md)\n- [torch_npu.npu_chunk_gated_delta_rule API 文档](https://raw.githubusercontent.com/ascend/op-plugin/abd599370b927e60f98669456d8655725ba8c974/docs/zh/custom_APIs/torch_npu/torch_npu-npu_chunk_gated_delta_rule.md)\n- [vllm-ascend 支持矩阵（v0.18.0）](https://docs.vllm.ai/projects/ascend/en/v0.18.0/user_guide/support_matrix/supported_models.html)\n- [vllm-ascend Qwen3-Next 教程](https://docs.vllm.ai/projects/ascend/en/v0.18.0/tutorials/models/Qwen3-Next.html)\n- [vllm-ascend PR #12607：GDN prefill 换用 aclnn chunk_gated_delta_rule](https://github.com/vllm-project/vllm-ascend/pull/12607)\n- [vllm-ascend `kimi_kda.py`（KDA 的 AscendC prefill/decode 路径）](https://github.com/vllm-project/vllm-ascend/blob/8d838ee8/vllm_ascend/ops/kimi_kda.py)\n- [MindSpeed-Ops · mamba3_mimo_bwd_bwd 算子迁移说明](https://raw.gitcode.com/Ascend/MindSpeed-Ops/raw/485c0c5b7e820b871a8d155a00be181a778f2e83/docs/triton/mamba3_mimo_bwd_bwd.md)\n- [Gated Delta Networks: Improving Mamba2 with Delta Rule (ICLR 2025)](https://arxiv.org/abs/2412.06464)\n- [Kimi Linear: An Expressive, Efficient Attention Architecture](https://arxiv.org/abs/2510.26692)\n- [vLLM RFC #11382：Hybrid Memory Allocator](https://github.com/vllm-project/vllm/issues/11382)\n- [vLLM PR #20016：Enable V1 for Hybrid SSM/Attention Models](https://github.com/vllm-project/vllm/pull/20016)", "term_count": 11, "source_count": 12}, {"date": "2026-11-03", "title": "Mamba 精读计划 · 7 天", "topic": "Mamba 家族与混合架构", "topic_id": "mamba-family", "part": "学习计划", "part_title": "精读计划", "order": 90, "tags": ["专题", "学习计划", "Mamba"], "markdown": "# Mamba 精读计划 · 7 天\n\n> 目标：7 天后，你能不看笔记讲清「SSM 为什么能省 KV → Mamba 的选择性改了什么 → Mamba-2 为什么能变成大矩阵乘 → GDN/KDA 各改哪一处 → vLLM 怎么管状态 → 昇腾为什么跑 scan 不划算」。\n\n配套材料：\n\n- 三篇笔记：[[专题/Mamba 家族/model-evolution|模型演进]] · [[专题/Mamba 家族/vllm|vLLM]] · [[专题/Mamba 家族/ascend|昇腾]]\n- 动手实验：[lab_ssm.py](专题/Mamba 家族/lab_ssm.py)（`python3 lab_ssm.py`，5 个实验，对应第 1–3、5–6 天）\n\n## 怎么用\n\n- **每天 60–90 分钟**，顺序不要跳：第 1–3 天是数学地基，第 4 天是架构分支，第 5–6 天是工程落地。\n- 每天先做「手算」，再读笔记核对；手算算不出来，说明前一天没吃透，回去补。\n- 卡住就把你的数/公式贴给我，我用你的数字重算一遍，不直接给答案。\n- 只有 30 分钟的日子：只做「手算 + 跑实验」，读笔记留到第二天早上。\n\n## 前置检查（30 分钟，答不上来先补）\n\n1. 一个两层网络，输入 x、隐藏层 ReLU、输出层线性——前向传播怎么算？（第 1 课）\n2. attention 里 Q、K、V 各是什么？为什么 K/V 能缓存？（第 3 课会讲，先看笔记开头直觉即可）\n3. RNN 的隐藏状态 h_t 为什么不能并行？它和 attention 的取舍是什么？（答案见 [[课程/基础/补课-RNN与attention的取舍|补课：RNN 与 attention 的取舍]]）\n\n---\n\n## Day 1 · SSM 的三种算法：递推、离散化、卷积\n\n**目标**：能手算 4 步标量 SSM 递推；能说出 Ā、B̄ 的物理含义；知道「卷积视图」是并行的基础。\n\n- 读：模型演进「核心概念」的 SSM、状态维度 N、离散化、HiPPO、卷积视图。\n- 手算：\n  1. a = −1、Δ = 0.1，算 Ā、B̄（精确式），再算近似式 Δb，比较差多少。\n  2. x = [1, 0.5, −0.2, 0.8]，从 h₀ = 0 递推 4 步，写出每个 h_t。\n  3. 用矩阵 M 的 t、s 通项解释：为什么 y_t 只依赖 x_s（s ≤ t）。\n- 实验：`lab_ssm.py` 实验 1（递推 = 卷积矩阵 = 并行 scan）。\n- 自测：模型演进自测题 1–2。\n- **完成标准**：能解释「B̄ ≈ ΔB 只在 |Δa| ≪ 1 时成立」，并能算出 Δa = −0.1 时 5% 的偏差。\n\n## Day 2 · 选择性：Mamba（S6）改了什么\n\n**目标**：说清 S4 的核为什么固定、S6 为什么让 B/C/Δ 随输入变、代价是什么。\n\n- 读：模型演进「选择性（S6）」「并行扫描与 chunked scan」。\n- 手算：\n  1. Δ = 0.1 vs Δ = 10，分别算 Ā、B̄，解释「Δ 大 = 遗忘」。\n  2. 用 x = [1,1,1,1]、Δ = [0.1,0.1,10,0.1]，手推选择性 scan 的 4 步输出。\n- 实验：`lab_ssm.py` 实验 2（大 Δ 冲掉历史）。\n- 自测：模型演进自测题 3–4；口头回答「为什么选择性之后不能用 FFT / 固定卷积」。\n- **完成标准**：能画出一条 token 流里「哪些位置该记、哪些该忘」的示意。\n\n## Day 3 · Mamba-2 与 SSD：从 scan 到大矩阵乘\n\n**目标**：理解「块内矩阵乘 + 块间传状态」为什么让 NPU/GPU 喜欢；会算 chunked 复杂度。\n\n- 读：模型演进「SSD（状态空间对偶）」「Delta rule、门控与混合架构」（SSD 部分）。\n- 手算：\n  1. 把 n = 8、L = 4 切成 2 块，写出块间串行次数（答案：2 次，不是 8 次）。\n  2. 复杂度 O(n(L+N)D)：分别取 L = 32/128/512，说明 L 变大后矩阵乘占比、块间跳数怎么变。\n  3. 用 M 的「半可分」解释：为什么分块后对角块能写成低秩 (C B) matmul。\n- 实验：`lab_ssm.py` 实验 3（chunked == 递推，注意前缀积的索引——lab 里就踩过这个坑）。\n- 自测：模型演进自测题 5 + 「SSD 和 attention 的对偶到底对偶了什么」。\n- **完成标准**：能用一句话说清「Mamba-2 让 SSM 在硬件上变成 GEMM 问题」。\n\n## Day 4 · GDN、KDA 与混合架构\n\n**目标**：分清 delta rule、门控、混合比例各解决什么问题。\n\n- 读：模型演进「Delta rule、门控与混合架构」全部。\n- 手算：\n  1. 2×2 状态 S，k = [1,0]、v = [2,3]，写一步 delta rule（先擦后写），再写一步门控衰减。\n  2. 算 Jamba 的 attention 层数占比（4/32）与 KV 缩减倍数（8×），说明「省 8 倍」从哪来。\n  3. 对比 Jamba / Zamba / Hymba 三种排法：attention 放哪、参数怎么分、代价是什么。\n- 自测：模型演进自测题 6–8。\n- **完成标准**：能回答「如果让你设计一个混合模型，attention 层放哪、放几层、为什么」。\n\n## Day 5 · vLLM：状态怎么管、KV 怎么省\n\n**目标**：说清 conv_state / ssm_state、分页内存、chunked prefill 的差异；会算显存账。\n\n- 读：vllm 篇全部。\n- 手算：\n  1. Llama-3-8B 32K 的 KV 是多少？（128 KiB/token → 4 GiB）\n  2. Mamba-Codestral-7B 的状态多少？（约 128 MiB/序列）\n  3. Jamba 的 KV / 状态、二者交叉点（约 530 token）——为什么短上下文状态反而更贵。\n- 实验：`lab_ssm.py` 实验 4（显存对照表）。\n- 自测：vllm 篇自测题 1–3。\n- **完成标准**：能解释「为什么 vLLM 要把 state 也按 block 分页，以及 HMA 为什么要求 block size 一致」。\n\n## Day 6 · 昇腾：为什么「能跑但不快」\n\n**目标**：用 roofline 判断瓶颈；说清 Cube/Vector 错配、chunk 化后为什么好转。\n\n- 读：ascend 篇全部。\n- 手算：\n  1. decode 单头 scan 的算术强度（约 1.5–3 FLOP/Byte），对 910B 脊点 190–250，差多少倍。\n  2. chunk 化后算术强度 (L+D)/2：L = 128/256/512、D = 128，各是多少；瓶颈从带宽转向什么。\n  3. 为什么「总搬运量下降」不等于「一定更快」——用单位字节算术强度解释。\n- 实验：`lab_ssm.py` 实验 5（roofline 小算盘）。\n- 自测：ascend 篇自测题 1–3。\n- **完成标准**：能给出「昇腾上要不要用 Mamba」的三条判断条件。\n\n## Day 7 · 费曼 + 综合自测\n\n- 不看笔记，用 300 字回答：**Mamba 家族为什么会存在？它解决了什么、又牺牲了什么？**\n- 做三篇笔记的「还没想清楚」清单，挑 2 个问题去查资料（我可以帮你查）。\n- 面试/实战三问：\n  1. 给定 128K 上下文和固定显存预算，你会选 attention、Mamba 还是混合？为什么？\n  2. vLLM 里 Mamba 模型的 prefix caching 和 attention 模型有什么本质区别？\n  3. 昇腾上把 Mamba 跑到接近 attention 的吞吐，需要改哪几层（算法 / 算子 / 调度）？\n- **完成标准**：能不看笔记讲 5 分钟，且被追问「代价是什么」时不卡壳。\n\n---\n\n## 附录 A · 公式速查\n\n| 名称 | 公式 | 说明 |\n| --- | --- | --- |\n| SSM 递推 | h_t = Ā h_{t−1} + B̄ x_t，y_t = C h_t | 每步 O(1) 状态读写 |\n| 离散化（ZOH） | Ā = e^{Δa}，B̄ = (e^{Δa}−1)/a·b | 近似 B̄ ≈ Δb 仅当 \\|Δa\\| ≪ 1 |\n| 卷积视图 | y_t = Σ_{s≤t} C(∏ Ā) B̄ x_s | 核固定时可 FFT |\n| scan 复合 | (a₂,b₂)∘(a₁,b₁) = (a₂a₁, a₂b₁+b₂) | 结合律 → 树形并行 |\n| chunked 复杂度 | O(n(L+N)D) | 块内 GEMM，块间串行 n/L 次 |\n| chunk 算术强度 | AI ≈ (L+D)/2 | 口径：只算 q/k/v/o 四个张量 |\n| KV/token | 2 · 层数 · KV头数 · head_dim · 2B | Llama-3-8B = 128 KiB |\n| 状态/序列 | 层数 · heads · head_dim · d_state · 2B | 与上下文长度无关 |\n\n## 附录 B · 五个最容易踩的坑\n\n1. **把状态当「压缩版 KV」**：状态不可寻址、只进不出、与长度无关；KV 可随机访问、随长度增长。语义不同，不能互换。\n2. **B̄ ≈ ΔB 无条件用**：只在 |Δa| ≪ 1 成立；Δa = −0.1 时已差 5%。\n3. **块间串行次数写成 L**：串行的是块数 n/L，不是块长 L。\n4. **「省显存」= 一定更快**：短上下文时状态比 KV 贵；decode 是否更快取决于算术强度与带宽。\n5. **混合模型只看比例**：Jamba 省 8 倍是因为 attention 只占 4/32 层，不是 Mamba 单层的魔法。", "term_count": 0, "source_count": 0}]};
