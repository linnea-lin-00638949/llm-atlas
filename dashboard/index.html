e 一步的账：N = 8×10⁹、BF16 每参数 2 B、HBM 带宽 1.6×10¹² B/s、FP16 峰值 376 TFLOPS（本课程统一取这组量级）。\n\n第 1 步 权重：8×10⁹ × 2 B = 16 GB。\n\n第 2 步 权重读取下界：16×10⁹ ÷ 1.6×10¹² = 10 ms。这是「带宽 100%」的理想地板；若带宽只跑到 70%（示例假设，实测常见 60%–80%），一步 14 ms，单请求上限约 70 token/s——「打七折」是假设，不是规律。\n\n第 3 步 每 token 计算量 ≈ 2N = 16 GFLOP。\n\n第 4 步 算力下界：MFU（算力利用率）20% 时有效算力 75.2 TFLOPS，每 token 16 ÷ 75.2 ≈ 0.213 ms。\n\n第 5 步 求拐点：算术强度 = 每读 1 字节做多少次浮点运算。decode 每步读 2N 字节权重、做 2N·B FLOP，按权重算它 ≈ B。机器的算力/带宽比是 376 ÷ 1.6 = 235 FLOP/字节，乘算力侧 MFU 得 B* ≈ 235 × 0.2 ≈ 47——47 是这么来的。口径是「带宽 100%、算力 20%」：两效率同比例打折 B* 不变，但带宽若也跑到 70%，B* ≈ 235 × 0.2 ÷ 0.7 ≈ 67。所以记「47 上下、实际 47–70」，别背成常数。\n\n第 6 步 补上漏掉的 KV：Qwen3-8B 每 token 每层 KV = 2 × 8 个 KV 头 × 128 维 × 2 B = 4 KB，36 层共 144 KB/token。8k 上下文单序列约 1.2 GB，B=32 时约 38 GB，是权重的两倍多，一步下界变成 (16+38) ÷ 1.6 = 34 ms，不是 10 ms；512 token 上下文时 KV 只 2.4 GB，一步 11.5 ms，10 ms 才近乎成立。更看边际成本：8k 时每多一个序列 KV 多 1.2 GB（+0.75 ms），算力只多 0.213 ms——带宽永远更贵。所以「B < 47 时加并发几乎不涨时间」只在 KV 极小时成立；8k 下加并发就是直接涨时间。\n\n第 7 步 量化：权重换 INT8，8 GB，读取下界 5 ms；设 INT8 算力为 FP16 的 2 倍（150 TFLOPS），每 token 0.107 ms，B* = 5 ÷ 0.107 ≈ 47，与 BF16 几乎一样。收益看上下文：512 token 时 (8+2.4) ÷ 1.6 = 6.5 ms，对 11.5 ms 约 1.8×；8k 时 (8+38) ÷ 1.6 = 29 ms，对 34 ms 只有 1.2×——量化压的是权重，KV 一字节没省。这就是「decode 量化收益大」的边界。\n\n第 8 步 profiler 验证：B=32、512 token 上下文，下界 11.5 ms、实测每步 20 ms，带宽利用率约 58%。打开 `kernel_details.csv` 按耗时排序：榜首是成堆的逐元素小算子而非矩阵乘 → 融合不足或回退；矩阵乘间空隙大 → 下发/CPU 瓶颈；all-reduce 占三成 → 通信。\n\n### 张量并行的补充账\n\n前提：hidden = 4096、B = 32、BF16 每元素 2 B、Qwen3-8B 共 36 层、TP = 4，先忽略 KV；卡间通信有效带宽 100 GB/s、单次延迟 30 μs（存疑，用实测的 HCCL 小消息延迟替换）。\n\n① 每卡权重读取：4 GB ÷ 1.6 TB/s = 2.5 ms。\n② 每卡每 token 计算：4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms；B=32 时约 1.7 ms。\n③ 通信量：单次 all-reduce 消息 = 批内 token 数 × hidden × 每元素字节 = 32 × 4096 × 2 B = 256 KB；36 层 × 2 = 72 次共 18 MB ÷ 100 GB/s ≈ 0.18 ms，可忽略。\n④ 通信延迟：72 × 30 μs ≈ 2.2 ms，不随 batch 缩小，也不因消息变小而消失。\n⑤ 合计：max(2.5, 1.7) + 2.2 ≈ 4.7 ms，对单卡 10 ms 约 2.1×。\n\n结论：TP 在 decode 有真实收益，但远不到线性，原因就在三笔账里：权重读取被摊薄（÷4），通信固定延迟被加上（2.2 ms，与 B 无关，batch 越小占比越高）。上下文变长时 KV 也按 KV 头切分（8 个头 ÷ 4 = 每卡 2 个），8k 时每卡 (4+9.5) ÷ 1.6 ≈ 8.4 ms，加通信约 10.6 ms，对单卡 34 ms 约 3.2×——长上下文更能摊薄通信。一句话：装不下必须 TP，prefill 收益接近线性，decode 有 2–3× 但不是 4×。\n\n串成一条启动命令：\n\n`export TASK_QUEUE_ENABLE=2 CPU_AFFINITY_CONF=1`\n`vllm serve /models/Qwen3-8B-W8A8 --quantization ascend --tensor-parallel-size 4 --max-model-len 8192 --max-num-batched-tokens 16384 --profiler-config '{\"profiler\":\"torch\",\"torch_profiler_dir\":\"./prof\"}'`\n\n再用 `curl -X POST localhost:8000/start_profile`、发压、`curl -X POST localhost:8000/stop_profile` 收数据。\n\n## 常见误区\n\n1. 「用了 FP8 权重就一定省显存、一定更快」。错：非 950PR/950DT 上原生 FP8 checkpoint 被摊回 BF16 执行，显存按 BF16 规划（约 2 倍于 FP8 文件）；要真省得走 ModelSlim / LLM-Compressor 的 W8A8，并确认量化后端生效。\n\n2. 「能跑通、输出正确，说明算子都在昇腾上、性能没问题」。错：组合重写只保正确不保速度，一个算子变五个，decode 每步都付；没实现的算子是直接报错，不是悄悄上 CPU。依据只能是 profiler 的内核构成。\n\n3. 「TP 越大越快」。错：decode 有 2–3× 但远非线性，通信固定延迟不随 batch 变小；注意力头数（含 KV 头数）要能被 TP 整除，否则起不来。\n\n## 一句话总结\n\n昇腾上 vLLM 的性能，八成由三件事决定：算子有没有融合、精度路径对不对得上硬件、有没有用 profiler 把「实测减理论」的差值归因到带宽/算力/调度——而理论那一项里，KV 流量常常比权重更大。\n\n## 自测题\n\n### 1. 服务跑在 NPU 上、输出正确，能否断定算子都落在昇腾上？\n\n<details><summary>查看答案<\/summary>不能。回退有两种：① 组合重写——多个基础算子拼出等价计算，仍在 NPU 上跑，正确但慢（一个变五个，decode 每步都付）；② 没实现——抛 `NotImplementedError`，不会自动搬 CPU 替你算完。「能跑通」只说明走通 ①，或没碰到缺的算子；算子在哪、融得好不好，只能看 profiler 的内核构成。<\/details>\n\n### 2. 为什么 B* ≈ 47？带宽只跑到 70% 呢？8k 上下文还谈得上 B* 吗？\n\n<details><summary>查看答案<\/summary>算术强度 = 每读 1 字节做多少 FLOP，decode 按权重算 ≈ B；算力/带宽比 376 ÷ 1.6 = 235，乘 MFU 0.2 得 ≈ 47（口径：带宽 100%、算力 20%）。两效率同比例打折 B* 不变；带宽若只 70%，B* ≈ 235 × 0.2 ÷ 0.7 ≈ 67。8k 时变形：每多一个序列 KV 多 1.2 GB（+0.75 ms），算力只多 0.213 ms，一步永远落在带宽侧，B* 失效——加并发直接涨时间。<\/details>\n\n### 3. TP = 4、B = 32，为什么 decode 只有约 2.1×？\n\n<details><summary>查看答案<\/summary>三笔账：每卡权重读取 4 GB ÷ 1.6 TB/s = 2.5 ms（摊薄 4 倍）；每卡计算 4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms/token、B=32 时 1.7 ms；通信每次 32×4096×2 B = 256 KB、72 次共 18 MB，传输仅 0.18 ms，但 72×30 μs ≈ 2.2 ms 的固定延迟摊不薄。合计 max(2.5,1.7)+2.2 ≈ 4.7 ms，对单卡 10 ms 约 2.1×。batch 越小，2.2 ms 占比越高。<\/details>\n\n### 4. 「矩阵乘之间有大段空隙」，该用哪个 profiler、看什么、下一步动什么？\n\n<details><summary>查看答案<\/summary>用算子级的 Ascend PyTorch Profiler（`--profiler-config` + `/start_profile`、`/stop_profile`），解析 `*_ascend_pt` 后看 `kernel_details.csv` 的时间戳间隙与 task 耗时，先分清是下发（host 侧）慢还是内核慢。若在下发/调度，先试 `TASK_QUEUE_ENABLE=2` 与 `CPU_AFFINITY_CONF=1`；若是 batch 组不起来、排队久，换 MS Service Profiler 看 `batch.csv`、`request.csv`。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| vllm-ascend | vLLM 的昇腾硬件插件，替换与硬件交互的一层，带 `patch` 补丁模块 |\n| torch-npu | PyTorch 的昇腾后端，把 aten 算子映射到 CANN 的 aclnn 算子库执行 |\n| 算子适配 | 把模型计算落到昇腾可执行实现上的全过程 |\n| fallback（算子回退） | 缺算子时组合重写（慢、仍在 NPU），或直接抛 `NotImplementedError` |\n| 量化（W8A8） | 权重 8 bit、激活 8 bit，省显存与带宽，精度有损 |\n| ModelSlim | 昇腾官方压缩工具，产 W8A8 权重，需 `--quantization ascend` |\n| profiler | 采集算子/内核/调度耗时、定位瓶颈 |\n| ascend_pt | Ascend PyTorch Profiler 的原始产物，解析后才能读 |\n| 算术强度 | 每读 1 字节做多少次浮点运算；decode 按权重算 ≈ 批内 token 数 B |\n| B*（拐点 batch） | 带宽与算力下界相等处的批大小 ≈ 峰值算力÷带宽 × MFU（本课约 47） |\n| 性能定位 | 算理论下界、测实际，把差值归因到带宽/算力/调度 |\n| HCCL | 昇腾的集合通信库，多卡 all-reduce 等通信的执行者 |\n| 张量并行（TP） | 把权重切到多卡、每层做集合通信的并行方式 |\n\n## 下一步\n\n下一课「量化与编译基础」把本课点到为止的两处展开：量化的数学（scale/zero-point、per-tensor 与 per-channel 的差别、精度为什么掉、KV 能否量化）与编译（图捕获、算子融合、动态 shape 的代价）。\n\n## 来源\n\n1. vLLM Ascend 官方文档首页 — https://docs.vllm.ai/projects/ascend/en/latest/\n2. 量化指南（vLLM Ascend） — https://docs.vllm.ai/projects/ascend/en/latest/user_guide/feature_guide/quantization.html\n3. 服务性能分析指南（vLLM Ascend） — https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/performance_and_debug/service_profiling_guide.html\n4. 优化与调优（vLLM Ascend） — https://docs.vllm.ai/projects/ascend/en/latest/developer_guide/performance_and_debug/optimization_and_tuning.html\n5. 添加自定义 aclnn 算子（vLLM Ascend） — https://docs.vllm.ai/projects/ascend/zh-cn/latest/developer_guide/Design_Documents/add_custom_aclnn_op.html\n6. 图模式指南（vLLM Ascend） — https://docs.vllm.ai/projects/ascend/zh-cn/latest/user_guide/feature_guide/graph_mode.html\n7. Williams, Waterman, Patterson. Roofline: An Insightful Visual Performance Model for Multicore Architectures. CACM 2009 — https://dl.acm.org/doi/10.1145/1498765.1498785", "review_md": "---\nverdict: \"revise\"\nsummary: >-\n  结构八项齐全，模块的四个 goal 都有落点（拉起服务、vllm-ascend 与原生 vLLM 的关系、profiler 定位、常见性能坑）；\n  第 1–7 步的账（16 GB→10 ms、16 GFLOP→0.213 ms、B*≈47、INT8 5 ms/0.107 ms/47、B=32 时 50% 带宽利用率）逐个复算都对。\n  但张量并行那段有两处硬伤：2.5 ms 不是由刚给的 100 GB/s 推出（按 100 GB/s 应是 40 ms，2.5 ms 实为 4 GB÷1.6 TB/s 的权重读取），\n  且「1.9 ms 接近计算量的 76%」把 2.5 ms 的带宽时间错标成计算量；更严重的是结论「decode 加卡不见快、TP 只给装不下和 prefill 用」\n  与同段数字自相矛盾（4.4 ms vs 单卡 10 ms ≈ 2.3×）。此外 decode 带宽模型只算权重、漏掉 KV cache 流量，\n  按本课自己的 --max-model-len 8192 与 B=32，KV 读取约 37 GB，远超 16 GB 权重，「B<47 时时间被权重钉死」在这个配置下不成立。\n  建议改完这三处再发。\nissues:\n  - severity: \"high\"\n    claim: >-\n      「这就是『decode 加卡不见快』的原因：TP 主要给『装不下』和 prefill（一次性算完整个 prompt）的算力用」\n    problem: >-\n      与该段自己的数字矛盾：4 卡时每步 ≈ 2.5 ms 权重读取 + 1.9 ms 通信 ≈ 4.4 ms，对比单卡 B=32 时 max(10 ms, 6.8 ms)=10 ms，\n      仍有约 2.3× 加速，不是「不见快」。而且 TP 把权重切到 4 卡，每卡每步只读 4 GB，本来就会缩短 decode 的带宽时间——\n      说 TP 只对「装不下」和 prefill 有用，与本课「decode 天生带宽受限」的前提自相矛盾，弱基础读者会直接记住「decode 别开 TP」。\n    fix: >-\n      结论改成「收益远低于线性：4 卡约 2.3×，而非 4×」，原因落在三笔账的构成上（每卡权重读取变少 ↓、通信固定延迟与通信量 ↑、\n      长上下文时 KV 流量占主导）；「装不下必须 TP、prefill 收益更大」可以保留，但不要否定 decode 的 TP 收益。\n  - severity: \"high\"\n    claim: >-\n      「假设卡间集合通信有效带宽 100 GB/s、单次延迟 30 μs：8B 切 4 卡，每卡权重 4 GB，理论 2.5 ms」与\n      「30 μs × 64 ≈ 1.9 ms，接近计算量的 76%」\n    problem: >-\n      2.5 ms 无法由 100 GB/s 推出：4 GB ÷ 100 GB/s = 40 ms；2.5 ms 实际是 4 GB ÷ 1.6 TB/s（HBM 权重读取）。\n      读者照前提手算会得 40 ms，直接卡死。同段又把 2.5 ms 称为「计算量」：每卡每 token 计算是 16/4=4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms\n      （B=32 时约 1.7 ms），1.9 ms 相对它超过 100%，76% 这个比例其实是对着 2.5 ms 的带宽时间算的。\n    fix: >-\n      拆成三行分别给数并各自标注用到的前提：① 每卡权重读取 4 GB ÷ 1.6 TB/s = 2.5 ms；② 每卡每 token 计算 4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms\n      （B=32 时 1.7 ms）；③ 通信 64 × 30 μs ≈ 1.9 ms；再写「通信 ≈ 权重读取时间的 76%」，而不是「计算量的 76%」。\n  - severity: \"high\"\n    claim: >-\n      「B < 47 时一步耗时被 10 ms 的权重读取钉死，加并发几乎不涨时间、吞吐线性涨」\n    problem: >-\n      10 ms 只算了权重，漏了 KV cache 读取。按本课自己的启动命令（--max-model-len 8192）与 B=32：Qwen3-8B 每 token KV ≈\n      2×36 层×8 个 KV 头×128×2 B ≈ 144 KB，8k 上下文单序列约 1.2 GB，B=32 约 37 GB，是 16 GB 权重的两倍多。\n      此时一步的实际下界 ≈ (16+37)/1.6 TB/s ≈ 33 ms，且随 B 和上下文长度增长，「加并发几乎不涨时间」不成立。\n    fix: >-\n      把 T_mem 写成 (权重字节 + KV 字节) ÷ 带宽，并补一句限定：「KV 流量 ≪ 权重流量（短上下文、小 batch）时才退化成 10 ms 常数」；\n      至少加一行对照——上下文 512 token 时 KV 约 2.3 GB 可忽略，8k 时必须计入，否则 B* 会高估。\n  - severity: \"medium\"\n    claim: >-\n      「32 层每层两次 all-reduce，共 64 次，每次搬 4096×32×2 B = 256 KB」\n    problem: >-\n      4096（hidden）、32（批内 token 数）、2（BF16 字节）三个数都没交代来源，读者没法跟着手算，也说不清消息量为什么是\n      「token 数 × hidden × 字节」。且命令里用的是 Qwen3-8B，实际 36 层，与「32 层」对不上，去模型卡核对的人会以为讲义算错了。\n    fix: >-\n      明写「以 hidden=4096、B=32、BF16 为例；Qwen3-8B 实际 36 层，这里取 32 层凑整数示例」；\n      并给出式子：单次 all-reduce 消息量 = 批内 token 数 × hidden × 每元素字节数。\n  - severity: \"medium\"\n    claim: >-\n      fallback 定义：「框架改用『多个已有算子组合』或 CPU 执行，只为保证结果正确」\n    problem: >-\n      torch-npu 上未实现的 aten 算子通常直接抛 NotImplementedError，不会自动把张量搬到 CPU 上算；CPU 兜底要显式 .cpu()，\n      代价不止「慢十倍」，还会带来每步同步与精度差异。写成自动回退，配合课前自测第 4 题，会让读者形成「能跑通就说明算子都落在 NPU 上」的错误直觉——\n      这恰恰是本课要破除的。\n    fix: >-\n      分成两种情形写清：（a）插件用多个基础算子组合重写，仍在 NPU 上执行，慢但透明；（b）根本没有实现 → 报错，要改代码或换版本。\n      删掉「或 CPU 执行」，或改成「显式搬到 CPU（线上基本不可用）」。\n  - severity: \"medium\"\n    claim: >-\n      「设 MFU 20%，有效算力 376 × 0.2 = 75.2 TFLOPS」与「单请求上限 100 token/s，实际打七折约 70」\n    problem: >-\n      两个下界口径不一致：带宽项按 100% 带宽算，算力项先打 20% MFU 折，得出的 B*≈47 不是同一把尺子量出来的；\n      若带宽利用率也按 60–70% 折算，T_mem 变 14–17 ms，B* 升到 65–80。「打七折」的 0.7 也没有出处，读起来像实测规律。\n    fix: >-\n      两项要么都用峰值、要么都用实测可达值，并说明 MFU 只折算了算力侧；把 0.7 标成示例假设（实测常见 60–80%）；\n      顺手补一条更好记的算法：B* = 峰值算力÷带宽 × MFU = 376/1.6 × 0.2 ≈ 47，读者可自查。\n  - severity: \"medium\"\n    claim: >-\n      术语卡「算术强度：每字节数据对应的计算量，判断带宽受限还是算力受限」，而正文第 5 步只给「B* ≈ 47」\n    problem: >-\n      正文从头到尾没出现「算术强度」这个词，也没说 B* 是怎么来的，读者只看到一个凭空的 47；术语卡里摆了一个正文没教的词，\n      两边对不上号，属于术语卡与正文脱节。\n    fix: >-\n      在第 5 步点明：「算术强度 = 每读 1 字节做多少次浮点运算，decode 时约等于批内 token 数 B；机器的算力/带宽比是\n      376 TFLOPS ÷ 1.6 TB/s ≈ 235，乘 MFU 0.2 得 B*≈47」，让 47 有出处、术语卡也落地。\n  - severity: \"low\"\n    claim: >-\n      「其它代际加载时把块缩解放回模型 dtype、用 BF16 矩阵乘执行——数值等价」\n    problem: >-\n      「块缩解」是「块缩放 + 解量化」的压缩写法，基础弱的读者断不开句；「数值等价」也不准确——FP8 按块反量化到 BF16 有舍入，\n      只是近似等价，正好和上文「精度还掉了」的直觉打架。\n    fix: >-\n      改成白话：「加载时按每个块的缩放系数把 FP8 权重重算成 BF16 再做矩阵乘，结果近似但不完全相同；显存要按 BF16 的大小\n      （约 2 倍于 FP8 文件）规划」。\n---\n\n# 审校记录 · 2026-11-03 · 第 10 课（下）vllm-ascend 部署与调优\n\n- 稿件：`课程/推理框架/2026-11-03-vllm-ascend-2.md`\n- verdict：**revise**\n- issues：8 条（high 3 / medium 4 / low 1）\n\n## 总评\n\n结构八项齐全，模块的四个 goal 都有落点（拉起服务、vllm-ascend 与原生 vLLM 的关系、profiler 定位、常见性能坑）；第 1–7 步的账（16 GB→10 ms、16 GFLOP→0.213 ms、B*≈47、INT8 5 ms/0.107 ms/47、B=32 时 50% 带宽利用率）逐个复算都对。但张量并行那段有两处硬伤：2.5 ms 不是由刚给的 100 GB/s 推出（按 100 GB/s 应是 40 ms，2.5 ms 实为 4 GB÷1.6 TB/s 的权重读取），且「1.9 ms 接近计算量的 76%」把 2.5 ms 的带宽时间错标成计算量；更严重的是结论「decode 加卡不见快、TP 只给装不下和 prefill 用」与同段数字自相矛盾（4.4 ms vs 单卡 10 ms ≈ 2.3×）。此外 decode 带宽模型只算权重、漏掉 KV cache 流量，按本课自己的 `--max-model-len 8192` 与 B=32，KV 读取约 37 GB，远超 16 GB 权重，「B<47 时时间被权重钉死」在这个配置下不成立。建议改完这三处再发。\n\n## 逐条问题\n\n### 1. [high] TP 结论与自段数字矛盾\n\n- claim：「这就是『decode 加卡不见快』的原因：TP 主要给『装不下』和 prefill（一次性算完整个 prompt）的算力用」\n- problem：与该段自己的数字矛盾：4 卡时每步 ≈ 2.5 ms 权重读取 + 1.9 ms 通信 ≈ 4.4 ms，对比单卡 B=32 时 max(10 ms, 6.8 ms)=10 ms，仍有约 2.3× 加速，不是「不见快」。而且 TP 把权重切到 4 卡，每卡每步只读 4 GB，本来就会缩短 decode 的带宽时间——说 TP 只对「装不下」和 prefill 有用，与本课「decode 天生带宽受限」的前提自相矛盾，弱基础读者会直接记住「decode 别开 TP」。\n- fix：结论改成「收益远低于线性：4 卡约 2.3×，而非 4×」，原因落在三笔账的构成上（每卡权重读取变少 ↓、通信固定延迟与通信量 ↑、长上下文时 KV 流量占主导）；「装不下必须 TP、prefill 收益更大」可以保留，但不要否定 decode 的 TP 收益。\n\n### 2. [high] 2.5 ms 的来源与「计算量的 76%」\n\n- claim：「假设卡间集合通信有效带宽 100 GB/s、单次延迟 30 μs：8B 切 4 卡，每卡权重 4 GB，理论 2.5 ms」与「30 μs × 64 ≈ 1.9 ms，接近计算量的 76%」\n- problem：2.5 ms 无法由 100 GB/s 推出：4 GB ÷ 100 GB/s = 40 ms；2.5 ms 实际是 4 GB ÷ 1.6 TB/s（HBM 权重读取）。读者照前提手算会得 40 ms，直接卡死。同段又把 2.5 ms 称为「计算量」：每卡每 token 计算是 16/4=4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms（B=32 时约 1.7 ms），1.9 ms 相对它超过 100%，76% 这个比例其实是对着 2.5 ms 的带宽时间算的。\n- fix：拆成三行分别给数并各自标注用到的前提：① 每卡权重读取 4 GB ÷ 1.6 TB/s = 2.5 ms；② 每卡每 token 计算 4 GFLOP ÷ 75.2 TFLOPS ≈ 0.053 ms（B=32 时 1.7 ms）；③ 通信 64 × 30 μs ≈ 1.9 ms；再写「通信 ≈ 权重读取时间的 76%」，而不是「计算量的 76%」。\n\n### 3. [high] B<47 的结论漏了 KV 流量\n\n- claim：「B < 47 时一步耗时被 10 ms 的权重读取钉死，加并发几乎不涨时间、吞吐线性涨」\n- problem：10 ms 只算了权重，漏了 KV cache 读取。按本课自己的启动命令（--max-model-len 8192）与 B=32：Qwen3-8B 每 token KV ≈ 2×36 层×8 个 KV 头×128×2 B ≈ 144 KB，8k 上下文单序列约 1.2 GB，B=32 约 37 GB，是 16 GB 权重的两倍多。此时一步的实际下界 ≈ (16+37)/1.6 TB/s ≈ 33 ms，且随 B 和上下文长度增长，「加并发几乎不涨时间」不成立。\n- fix：把 T_mem 写成 (权重字节 + KV 字节) ÷ 带宽，并补一句限定：「KV 流量 ≪ 权重流量（短上下文、小 batch）时才退化成 10 ms 常数」；至少加一行对照——上下文 512 token 时 KV 约 2.3 GB 可忽略，8k 时必须计入，否则 B* 会高估。\n\n### 4. [medium] all-reduce 消息量缺推导、层数对不上\n\n- claim：「32 层每层两次 all-reduce，共 64 次，每次搬 4096×32×2 B = 256 KB」\n- problem：4096（hidden）、32（批内 token 数）、2（BF16 字节）三个数都没交代来源，读者没法跟着手算，也说不清消息量为什么是「token 数 × hidden × 字节」。且命令里用的是 Qwen3-8B，实际 36 层，与「32 层」对不上，去模型卡核对的人会以为讲义算错了。\n- fix：明写「以 hidden=4096、B=32、BF16 为例；Qwen3-8B 实际 36 层，这里取 32 层凑整数示例」；并给出式子：单次 all-reduce 消息量 = 批内 token 数 × hidden × 每元素字节数。\n\n### 5. [medium] fallback 写成「或 CPU 执行」\n\n- claim：fallback 定义：「框架改用『多个已有算子组合』或 CPU 执行，只为保证结果正确」\n- problem：torch-npu 上未实现的 aten 算子通常直接抛 NotImplementedError，不会自动把张量搬到 CPU 上算；CPU 兜底要显式 .cpu()，代价不止「慢十倍」，还会带来每步同步与精度差异。写成自动回退，配合课前自测第 4 题，会让读者形成「能跑通就说明算子都落在 NPU 上」的错误直觉——这恰恰是本课要破除的。\n- fix：分成两种情形写清：（a）插件用多个基础算子组合重写，仍在 NPU 上执行，慢但透明；（b）根本没有实现 → 报错，要改代码或换版本。删掉「或 CPU 执行」，或改成「显式搬到 CPU（线上基本不可用）」。\n\n### 6. [medium] 两个下界口径不一致、0.7 无出处\n\n- claim：「设 MFU 20%，有效算力 376 × 0.2 = 75.2 TFLOPS」与「单请求上限 100 token/s，实际打七折约 70」\n- problem：两个下界口径不一致：带宽项按 100% 带宽算，算力项先打 20% MFU 折，得出的 B*≈47 不是同一把尺子量出来的；若带宽利用率也按 60–70% 折算，T_mem 变 14–17 ms，B* 升到 65–80。「打七折」的 0.7 也没有出处，读起来像实测规律。\n- fix：两项要么都用峰值、要么都用实测可达值，并说明 MFU 只折算了算力侧；把 0.7 标成示例假设（实测常见 60–80%）；顺手补一条更好记的算法：B* = 峰值算力÷带宽 × MFU = 376/1.6 × 0.2 ≈ 47，读者可自查。\n\n### 7. [medium] 术语卡与正文脱节（算术强度 / B*）\n\n- claim：术语卡「算术强度：每字节数据对应的计算量，判断带宽受限还是算力受限」，而正文第 5 步只给「B* ≈ 47」\n- problem：正文从头到尾没出现「算术强度」这个词，也没说 B* 是怎么来的，读者只看到一个凭空的 47；术语卡里摆了一个正文没教的词，两边对不上号，属于术语卡与正文脱节。\n- fix：在第 5 步点明：「算术强度 = 每读 1 字节做多少次浮点运算，decode 时约等于批内 token 数 B；机器的算力/带宽比是 376 TFLOPS ÷ 1.6 TB/s ≈ 235，乘 MFU 0.2 得 B*≈47」，让 47 有出处、术语卡也落地。\n\n### 8. [low] 「块缩解」「数值等价」表述\n\n- claim：「其它代际加载时把块缩解放回模型 dtype、用 BF16 矩阵乘执行——数值等价」\n- problem：「块缩解」是「块缩放 + 解量化」的压缩写法，基础弱的读者断不开句；「数值等价」也不准确——FP8 按块反量化到 BF16 有舍入，只是近似等价，正好和上文「精度还掉了」的直觉打架。\n- fix：改成白话：「加载时按每个块的缩放系数把 FP8 权重重算成 BF16 再做矩阵乘，结果近似但不完全相同；显存要按 BF16 的大小（约 2 倍于 FP8 文件）规划」。\n\n## 处置建议\n\n先改 1–3 条（high）：它们同时涉及「结论对不对」和「读者能不能手算复核」，不改会直接把错误结论固化进笔记。4–7 条属可读性与口径一致性，建议同批改完；8 条可最后润色。改完可发。\n", "term_count": 13, "source_count": 7, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-vllm-ascend", "date": "2026-11-03", "title": "第 9 课 · 昇腾上的 vLLM：vllm-ascend 部署与调优（上）", "main_thread": "按官方矩阵锁好版本，在昇腾机器上拉起 vLLM 服务并发出第一个请求 · 用 CANN / torch-npu / vllm-ascend 三层栈解释它和原生 vLLM 的关系，判断故障落在哪一层 · 用 KV 池与带宽手算并发上限和 TTFT/TPOT 量级，知道后续用 profiler 把瓶颈归到算力/带宽/调度", "domain": "推理框架", "module": "昇腾上的 vLLM：vllm-ascend 部署与调优", "module_id": "vllm-ascend", "lesson_no": 9, "tags": ["vllm-ascend", "昇腾 NPU", "CANN", "torch-npu", "KV cache", "推理框架"], "markdown": "# 第 9 课 · 昇腾上的 vLLM：vllm-ascend 部署与调优（上）\n\n> 学完今天，你能：\n> 1. 按官方矩阵锁好版本，在昇腾机器上拉起 vLLM 服务并发出第一个请求\n> 2. 用 CANN / torch-npu / vllm-ascend 三层栈解释它和原生 vLLM 的关系，判断故障落在哪一层\n> 3. 用 KV 池与带宽手算并发上限和 TTFT/TPOT 量级，知道后续用 profiler 把瓶颈归到算力/带宽/调度\n\n## 课前自测\n\n1. 同一个模型在 CUDA 卡上 `pip install vllm` 就能跑；换到昇腾 NPU，缺的那块东西是什么？它装在 vLLM 里面还是外面？\n2. `torch==2.10.0` 配 `torch_npu==2.8.0`，你以为会「慢一点」，实际会发生什么？为什么？\n3. 64 GB 的卡跑 Qwen3-0.6B、权重才 1.2 GB；`--max-model-len` 从 4096 改到 32768，并发会从 100+ 掉到十几条——为什么？\n\n## 为什么需要它\n\nvLLM 的主链路（vllm-core 那课）：API Server 收请求分词 → Engine Core 调度 → Worker 做前向 → 采样出下一个 token。Worker 需要一个真实设备后端来执行矩阵乘、注意力、通信。昇腾 NPU 的算力由 CANN 暴露（ascend-arch 那课）。\n\n问题在接口处：vLLM 自带的平台后端里没有昇腾——它不认识 `npu`，也不知道怎么在昇腾上编译 kernel（在设备上跑的计算函数）。所以「原版 vLLM + 昇腾卡」不是「装不装插件差不多」，而是根本跑不起来——补上这一块的就是 vllm-ascend。\n\n这一课打地基：三层栈谁管谁、版本为什么必须整行锁定、怎么装出可复现的环境、怎么发出第一个请求并确认「真的是 NPU 在算」。算子 fallback、量化、profiler、多卡 TP 留给后续课时。\n\n## 核心概念\n\n### 三层推理栈：CANN / torch-npu / vllm-ascend\n\n定义：CANN（运行时 + 算子库）→ torch-npu（PyTorch 的昇腾后端）→ vllm-ascend（vLLM 的平台插件），三层压在昇腾驱动（HDK，含驱动和固件）与 NPU 硬件之上。\n\n直觉：CANN 是「运行时 + 标准数学库」，torch-npu 是「这门语言的 SDK 绑定」，vllm-ascend 是「用这套 SDK 写出来的应用引擎」；上层只调下层，报错沿这条链往上冒。\n\n机制：一次前向是 `vLLM(Python) → torch-npu → CANN 运行时 / ACLNN 算子库 → 驱动 → AI Core`。定位第一步就是判断错在哪一层：`npu-smi info` 看不到卡 → 驱动或容器设备映射；`torch.npu.is_available()` 为 False → CANN 或 torch-npu 版本；能 import 但日志没有 `Platform plugin ascend is activated` → 插件或 vLLM 版本对不上。\n\n### CANN\n\n定义：Compute Architecture for Neural Networks，昇腾的异构计算架构：驱动接口、运行时、算子库（ACLNN）、集合通信库（HCCL）、配套工具（msprof 等）。\n\n直觉：相当于 CUDA Toolkit + cuBLAS + NCCL——但不含驱动，驱动与固件在 HDK 层。\n\n机制：上层框架不直接写硬件指令，而是调用 CANN 的算子（operator，封装好的计算单元，如 MatMul、FlashAttention），由 CANN 调度到 AI Core（昇腾的矩阵计算单元）执行。一个算子有没有原生实现，决定它跑得快不快——这是后续「算子适配」的起点。\n\n### torch-npu\n\n定义：PyTorch 的昇腾后端，通过 PrivateUse1（PyTorch 给非 CUDA 设备预留的注册机制）注册出 `npu` 设备，让 `tensor.npu()`、`torch.npu.synchronize()`、`torch.npu.device_count()` 可用。\n\n直觉：PyTorch 是通用遥控器，torch-npu 是昇腾这台机器的红外码表——没有码表，按键没反应。\n\n机制：它把 aten 算子（`add`、`bmm`、`softmax` 等）逐个映射到 ACLNN；没被映射的走 fallback（回退）：轻则落到 CPU 执行（极慢），重则直接报错。`import torch_npu` 这个动作本身就是注册后端，所以只 `import torch` 时 `torch.npu` 并不存在。\n\n### vllm-ascend\n\n定义：vLLM 的昇腾平台插件（platform plugin），把 vLLM 的设备抽象层完整实现到 NPU 上。\n\n直觉：vLLM 是「可以换发动机」的车，vllm-ascend 是昇腾发动机的安装支架加传动轴——它自己不是车。\n\n机制：它通过 entry point（入口点，包安装时声明「我提供哪类扩展」的元数据）注册 `vllm_ascend:register`；vLLM 启动时枚举 `vllm.platform_plugins` 组下的插件，发现 ascend 就激活，日志打印 `Platform plugin ascend is activated`。此后 Platform（设备属性、显存查询）、Worker、ModelRunner（组 batch、管 KV 缓存）、Attention backend、量化方法都由它提供。它实现的是 vLLM 的内部接口，vLLM 一升级，接口就可能变——这是它脆弱的原因。\n\n### 算子适配\n\n定义：让模型里每个计算（MatMul、RMSNorm、RoPE 位置编码、注意力、MoE 路由……）在目标硬件上都有可用实现；没有就补实现，或退回低效路径。\n\n直觉：把英文菜谱翻成本地厨房能执行的步骤；厨房没有烤箱就换蒸锅，做出来能吃，但口感不同（性能或精度有差异）。\n\n机制：三条路——(1) CANN/ACLNN 已有该算子，直接调用（最快）；(2) 用 Triton Ascend 或 Ascend C（昇腾的自定义算子编程接口）写算子，要编译、要验精度；(3) fallback 成若干已有小算子拼起来，或搬回 CPU。vLLM 每次支持新模型结构，最先卡住的往往就是这一层。\n\n### 版本矩阵\n\n定义：官方维护的兼容表，把 vllm-ascend、vLLM、CANN、NNAL、torch/torch-npu、HDK、Python 钉成一行。\n\n直觉：不是「装最新版最好」，而是「整行一起换」的套装；混搭等于自己造一个没人验证过的组合。\n\n机制：vllm-ascend 自 vLLM 0.7.x 起与 vLLM 同号发版（PEP 440，Python 的版本号规范），v0.30.0 就对应 vLLM v0.30.0。写作时（2026-11）官方 v0.30.0 的验证组合是：vllm-ascend v0.30.0 / vLLM v0.30.0 / CANN Toolkit+Ops 9.2.1 / NNAL 9.2.1 / torch 2.10.0 + torch_npu 2.10.0.post7 / HDK 26.1.1 / Python >=3.10,<3.13。数字一定会过期：抄之前先看矩阵页当日内容、核对日期，再整行安装。\n\n### 配套不上会怎样（自测第 2 题的答案）\n\ntorch 与 torch_npu 版本段不匹配，不是「慢一点」，典型是三种：`import torch_npu` 直接抛错（import 时校验 torch 版本与编译 ABI）；能 import，但首个 npu 算子报 not implemented；或能跑出结果但数值异常。机制是 torch_npu 的二进制针对特定 torch 版本编译，版本段或 ABI 对不上就找不到符号。vLLM 与 vllm-ascend 不配套则是在 register 或内部接口处崩。\n\n## 一步一步理解\n\n**第 1 步 先确认卡在**。`npu-smi info` 应列出设备、Health 为 OK；看不到卡先查驱动与容器 `--device /dev/davinci0` 映射，别急着装 Python 包。\n\n**第 2 步 按矩阵选一行并写死**。把 vllm-ascend、vLLM、CANN、torch_npu 写进镜像 tag 或 requirements，不要 `pip install -U vllm vllm-ascend`。\n\n**第 3 步 优先用官方镜像**。预构建镜像里 CANN、NNAL（CANN 中提供 ATB 算子库运行时的组件，版本随 CANN 对齐）、PyTorch、torch-npu、vLLM、vllm-ascend 已是一套验证过的组合，能省掉最耗时的版本对齐。进容器先做两行验证：\n\n```python\nimport torch, torch_npu, vllm, vllm_ascend\nprint(torch.npu.is_available(), torch.npu.device_count())\nprint(torch.__version__, torch_npu.__version__)\n```\n\n**第 4 步 离线跑通十行代码**（官方 Quick Start 的 0.6B 例子）：\n\n```python\nfrom vllm import LLM, SamplingParams\nllm = LLM(model='Qwen/Qwen3-0.6B')\nout = llm.generate(['Hello, my name is'], SamplingParams(temperature=0.0, max_tokens=32))\nprint(out[0].outputs[0].text)\n```\n\n首次加载要几分钟（读权重、建 KV 池、图捕获）。看到 `Platform plugin ascend is activated` 才算插件接管；若报 CUDA 相关错误，是插件没加载。\n\n**第 5 步 起服务、发第一个请求**：\n\n```bash\nexport ASCEND_RT_VISIBLE_DEVICES=0\nvllm serve Qwen/Qwen3-0.6B --max-model-len 4096 --gpu-memory-utilization 0.9\n```\n\n```bash\ncurl http://localhost:8000/v1/chat/completions \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"model\":\"Qwen/Qwen3-0.6B\",\"messages\":[{\"role\":\"user\",\"content\":\"用一句话解释 KV cache\"}],\"max_tokens\":64}'\n```\n\n两个坑：`--gpu-memory-utilization` 名字里带 gpu 是历史包袱，NPU 上含义不变（允许 vLLM 用掉的显存比例）；`--max-model-len` 不写就取模型 config 的最大上下文（Qwen3 常见 32768 甚至更长）。但 `--max-model-len` 并不直接决定启动成败：启动只校验「单条 max-model-len 的 KV 装不装得进 KV 池」，大模型或超长上下文（例如设到 20 万 token）才会启动报错，小模型上表现为并发骤降。\n\n**手算：一张 64 GB 卡能装多少请求、一个 token 要多久**\n\n设定：Qwen3-0.6B，BF16（每个数 2 字节），28 层，8 个 KV 头，每头 128 维；单卡 HBM 64 GB。\n\n1. 权重：0.6×10⁹ 参数 × 2 B = 1.2 GB。\n2. 可用显存：64×0.9 = 57.6 GB；扣掉 CANN 运行时、通信缓冲、图捕获约 4 GB（量级估计），约 53.6 GB 给 KV 池。\n3. 每 token 的 KV：K、V 各一份 → 2×8×128×2 B = 4096 B/层；×28 层 = 114,688 B ≈ 112 KiB/token。\n4. 一条 4096 token 请求：114,688 B × 4096 = 469.8 MB（448 MiB）；53.6 GB ÷ 469.8 MB ≈ 114 条。\n5. 改成 32768：单条 114,688 B × 32768 ≈ 3.6 GB，只剩 53.6 ÷ 3.6 ≈ 14 条。同一张卡并发差 8 倍——这就是自测第 3 题。\n6. 对账：块大小 16 token，每块 114,688×16 = 1,835,008 B ≈ 1.835 MB；53.6 GB ÷ 1.835 MB ≈ 29,200 块，约 46.7 万 token。启动日志的 KV cache 容量应落在这个量级，对不上说明参数或模型配置抄错了。（第 3 步的 112 KiB 是显示用近似值，连乘要用 114,688 B，别拿 112 去乘。）\n7. decode 时延下界：batch = 1 时每 token 要把 1.2 GB 权重从 HBM 读一遍，按 1.6 TB/s 算约 0.75 ms；4096 上下文还要多读约 0.45 GB KV，合并约 1.0 ms/token，生成 32 个 token 至少 32 ms。实测常见是它的 2–4 倍（取决于图模式与算子实现，属经验值，不当基准）。\n\n三条结论：单请求 decode 是带宽受限；TP 让每张卡每步只读 1/N 权重，能压低单请求 TPOT，但要付每层 all-reduce 通信；提吞吐仍靠加大 batch，让同一份权重服务更多请求、把带宽摊薄；并发上限由 `max-model-len` 直接决定，调参前先算账。TTFT、TPOT、并发上限正是后续用 profiler 要量的三个数。\n\n作业：用启动日志的 KV cache 行对上第 6 步的账，再把 `--max-model-len` 从 4096 改到 8192，观察并发上限与 TTFT。\n\n## 常见误区\n\n1. 「vllm-ascend 是可选的加速包，不装也能跑」。错：原生 vLLM 没有昇腾后端，插件缺失时连设备都分配不出来；它也不是独立引擎，必须挂同版本的 vLLM。\n2. 「pip 能装上就能跑，版本差点没关系」。错：三层是锁死的兼容集；torch 与 torch_npu 不配套是 import 报错或算子找不到（见「配套不上会怎样」），vLLM 与 vllm-ascend 不配套是在 register 或内部接口处崩。报错位置常离真正原因很远，先 `pip list` 对矩阵。\n3. 「`--gpu-memory-utilization` 拉到 1.0 能多塞请求」。错：CANN 运行时、通信缓冲、图捕获都要预留，打满通常换来启动失败或运行中 OOM；0.8–0.9 是稳妥起点。\n4. 「跑通就等于性能达标」。错：昇腾与 CUDA 的算子实现不同，某个算子走 fallback 就可能慢几倍；同一模型换个 vllm-ascend 版本性能也会变。性能必须实测，不能从「CUDA 上很快」外推。\n\n## 一句话总结\n\nvllm-ascend 是把 vLLM 的设备抽象层实现到昇腾 NPU 的插件，站在 CANN 与 torch-npu 之上；跑通第一个请求只需三件事——按官方矩阵整行锁版本、看到 `Platform plugin ascend is activated`、给 KV 池留够显存并把 `max-model-len` 设成真正需要的长度。\n\n## 自测题\n\n### 1. 昇腾上缺的那块是什么？装在 vLLM 里面还是外面？\n<details><summary>查看答案<\/summary>缺的是设备后端：vLLM 自带的平台后端里没有昇腾，不会为昇腾编译 kernel，也不知道怎么在 NPU 上分配显存、跑注意力。补它的是 vllm-ascend，一个装在 vLLM 外面的独立 Python 包，通过 entry point `vllm_ascend:register` 注册进 `vllm.platform_plugins`，激活后接管 Platform/Worker/ModelRunner/Attention backend。它必须与 vLLM 同版本，因为实现的是 vLLM 内部接口。<\/details>\n\n### 2. torch 2.10.0 + torch_npu 2.8.0 会发生什么？\n<details><summary>查看答案<\/summary>不是变慢，而是大概率直接失败。torch_npu 的二进制针对特定 torch 版本编译，`import torch_npu` 时校验 torch 版本与 C++ ABI；版本段不匹配通常在 import 或首个 npu 算子调用处抛错（找不到符号 / not implemented），也可能能跑但数值异常。修法不是调参，而是回到版本矩阵换整行：torch 2.10.0 配 torch_npu 2.10.0.post7。<\/details>\n\n### 3. 64 GB 卡跑 0.6B，max-model-len 从 4096 到 32768，为什么并发掉 8 倍？\n<details><summary>查看答案<\/summary>权重只占 1.2 GB，KV 池约 53.6 GB，而单条请求的 KV 与上下文长度成正比：每 token 约 114,688 B，4096 token ≈ 470 MB，能装约 114 条；32768 token ≈ 3.6 GB，只能装约 14 条。所以不是「显存不够启动」，而是每条请求吃的 KV 多了 8 倍、并发被压到 1/8。启动只在单条 max-model-len 的 KV 装不进池子时报错。<\/details>\n\n### 4. 怎么确认「真的是 NPU 在算」？\n<details><summary>查看答案<\/summary>三处证据：① 启动日志有 `Platform plugin ascend is activated`，说明插件接管；② `torch.npu.is_available()` 为 True、`device_count()` 等于预期卡数；③ 请求期间 `npu-smi info` 能看到对应进程占用显存与 AI Core。日志若出现 CUDA 相关报错，说明插件没加载，回第 3 步查版本与 entry point。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| vllm-ascend | vLLM 的昇腾平台插件，实现 Platform/Worker/ModelRunner 等接口，让 vLLM 跑在 NPU 上 |\n| CANN | 昇腾异构计算架构，提供运行时、ACLNN 算子库、HCCL 通信库与工具链 |\n| torch-npu | PyTorch 的昇腾后端，注册 `npu` 设备并把 aten 算子映射到 ACLNN |\n| ACLNN | CANN 的神经网络算子库，torch-npu 与 vllm-ascend 最终调用的算子集合 |\n| NNAL | CANN 中提供 ATB 算子库运行时的组件，版本随 CANN 对齐 |\n| HDK | 昇腾驱动与固件包，CANN 运行的前置条件 |\n| PrivateUse1 | PyTorch 为 CUDA 之外的设备预留的注册机制，torch-npu 用它注册出 `npu` 设备 |\n| 算子（operator） | 封装好的计算单元，如 MatMul、FlashAttention、RMSNorm |\n| 算子适配 | 为模型中每个计算在目标硬件上准备可用实现，缺失则自定义补齐或 fallback |\n| fallback | 算子无原生实现时的回退路径，常拆成小算子组合或落到 CPU，性能显著下降 |\n| 版本矩阵 | 官方锁定的兼容表，vllm-ascend / vLLM / CANN / NNAL / torch-npu / HDK 按整行配套 |\n| 平台插件 | vLLM 的扩展机制，通过 entry point 注册后端，使 vLLM 识别新设备 |\n| TTFT | Time To First Token，首 token 时延，主要由 prefill 与排队决定 |\n| TPOT | Time Per Output Token，平均每 token 生成时延，decode 阶段受带宽限制 |\n| 量化 | 用低比特表示权重/激活以省显存、省带宽，用精度换性能（后续课时展开） |\n| profiler | 性能采样工具（msprof、torch_npu.profiler），把耗时拆到算子/通信/调度上 |\n| 性能定位 | 用 profile 数据判断瓶颈属于算力、带宽还是调度，再定优化方向 |\n\n## 下一步\n\n下一课《量化与编译基础》：把权重与激活压到低比特（W8A8 等）、用图编译替换逐算子下发，继续在昇腾上把吞吐与时延做下来。\n\n## 来源\n\n1. vLLM Ascend Quick Start — https://docs.vllm.ai/projects/ascend/en/latest/getting_started/quick_start.html\n2. vLLM Ascend Installation Guide — https://docs.vllm.ai/projects/ascend/en/latest/getting_started/installation.html\n3. vLLM Ascend Versioning Policy — https://docs.vllm.ai/projects/ascend/en/latest/community/versioning_policy.html\n4. vLLM Plugin System — https://docs.vllm.ai/en/latest/design/plugin_system.html\n5. 昇腾社区 CANN 文档 — https://www.hiascend.com/document\n6. vLLM Ascend 项目仓库 — https://github.com/vllm-project/vllm-ascend\n7. Efficient Memory Management for Large Language Model Serving with PagedAttention — https://arxiv.org/abs/2309.06180", "review_md": "# 审校记录 · 2026-11-03-vllm-ascend\n\n- 讲义：`课程/推理框架/2026-11-03-vllm-ascend.md`\n- 日期：2026-11-03\n\n## verdict\n\nrevise\n\n## summary\n\n结构八项齐全（自测/核心概念/手算/误区/一句话总结/术语卡/下一步/来源），三层栈、entry point（vllm_ascend:register，与 setup.py 一致）、插件激活日志、同号发版与整行锁定这些主干都讲对了，goal 1、2 有落实；goal 3（profiler 定位瓶颈）与 goal 4（常见性能坑）本课只在术语卡与「下一步」出现，必须由下集兑现。主要问题：课前自测第 3 题的前提被正文自己的手算推翻、TP 那句结论与张量并行原理相反、版本示例行的 post 号与 CANN 小版本和官方 v0.30.0 行不符、手算有一组数字因四舍五入连乘偏高 3–5%。改完这几处即可通过。\n\n## issues\n\n### 1. severity: high\n\n- claim: 课前自测第 3 题「64 GB 卡跑 0.6B、权重才 1.2 GB，为什么第一次 vllm serve 常常直接报显存不够」，以及第 5 步「--max-model-len 不写…KV 池按它算，很容易一启动就失败」\n- problem: 与正文手算直接冲突：KV 池 53.6 GB，而 32768 token 的单条只占 3.6 GB（约 7%），vLLM 启动时只校验「单条 max-model-len 的 KV 能否装进 KV 池」，这个校验轻松通过，0.6B 在 64 GB 卡上不会因此 OOM。正文第 5 步自己算出的是并发从约 114 掉到约 14，即「并发骤降」而非「启动失败」。把推测写成「常常」，学员照做复现不出来只会怀疑环境坏了。\n- fix: 把自测第 3 题改成「一条 32768 token 的请求会把并发从 100+ 压到十几条，为什么」；正文把「很容易一启动就失败」改成「只有单条 max-model-len 的 KV 装不进 KV 池（大模型或超长上下文）时才启动报错，小模型表现为并发骤降」。若坚持保留「启动失败」说法，须给出触发条件（如 max-model-len 设到 20 万以上）。\n\n### 2. severity: high\n\n- claim: 「单请求 decode 是带宽受限，多卡切开权重并不会让每步读得更少」\n- problem: 与张量并行原理相反。TP 把每层权重切到 N 张卡，每卡每步只读 1/N 的权重，单请求 decode 的访存时间近似降到 1/N（代价是每层 all-reduce 通信）——这正是 TP 能压低 TPOT 的原因。原句会让学员在下集得出「TP 只省显存、不提速」的错误结论，也与「下一步」要讲的 TP 自相矛盾。\n- fix: 改为「TP 让每张卡每步读的权重变成 1/N，所以能压低单请求 TPOT，但要付 all-reduce 通信；TP 提速单请求，提吞吐仍靠加大 batch」。\n\n### 3. severity: medium\n\n- claim: 「写作时稳定版的一整行是：vllm-ascend v0.30.0 / vLLM v0.30.0 / CANN 9.2.0 / torch 2.10.0 + torch_npu 2.10.0.post4 / Python 3.10–3.12」，以及「v0.23.0 行对应 CANN 9.1.0」\n- problem: 官方 v0.30.0 验证组合是 CANN Toolkit+Ops 9.2.1、NNAL 9.2.1、PyTorch 2.10.0、TorchNPU 2.10.0.post7、HDK 26.1.1、Python >=3.10,<3.13；讲义写的 CANN 9.2.0 与 post4 都对不上（见 installation 页的 validated stack 表）。这一课的核心口号是「整行锁定、精确到 post 号」，示例行却错了两位，学员照抄 `torch_npu==2.10.0.post4` 会直接踩版本/ABI 校验。v0.23.0 对应 CANN 9.1.0 的跨课引用也无法核实。\n- fix: 按官方 v0.30.0 行改成 CANN 9.2.1 / torch 2.10.0 + torch_npu 2.10.0.post7（Python >=3.10,<3.13，镜像 3.12），并补一句「以矩阵页当日内容为准 + 核对日期」；无法核实的 v0.23.0 那句删掉或标为待核。\n\n### 4. severity: medium\n\n- claim: 手算第 4、6 步的数字：458 MB、≈117 条并发、≈30,600 块、≈49 万 token\n- problem: 第 3 步先把 114,688 B 四舍五入成 112 KB，后面又拿 112 KB 连乘，并混用 KB/MB/MiB，结果系统性偏高约 4%。重算：114,688 B × 4096 = 469.8 MB（448 MiB）→ 53.6 GB ÷ 469.8 MB ≈ 114 条；块大小 16 时每块 1,835,008 B ≈ 1.835 MB → 53.6 GB ÷ 1.835 MB ≈ 29,200 块 → ≈46.7 万 token。结论（8 倍差、数量级）不变，但「数量级对得上，说明没算错」的对账失去意义，学员按 112 KB 手算会和日志差出几万 token。\n- fix: 统一用字节或统一用 GiB 重算，写成 112 KiB/token → 470 MB/条、≈114 条、≈2.92 万块、≈46.7 万 token；并注明「第 3 步的 112 KB 是显示用近似值，连乘时用 114,688 B」。\n\n### 5. severity: medium\n\n- claim: 课前自测第 2 题「torch==2.10.0 配 torch_npu==2.8.0…实际会发生什么？为什么？」，开头说「答案散在本课，先猜再看」\n- problem: 正文没有回答这个组合。误区 2 只到「import 失败或算子找不到」，既没说清机制（torch_npu 在 import 时校验 torch 版本/编译 ABI，版本段不匹配通常在 `import torch_npu` 或首个 npu 算子调用处直接抛错，而不是变慢），也没解释「为什么不是慢一点」。自测题成了悬空题，学员对不上答案。\n- fix: 在「版本矩阵」或误区 2 补一段「torch 与 torch_npu 不配套的三种典型表现：import 报错 / 算子 not implemented / 能跑但结果异常」，并明确回指自测第 2 题；或把自测答案单独列一小节。\n\n### 6. severity: low\n\n- claim: 第 7 步 decode 时延下界：0.75 ms/token、32 个 token 至少 24 ms\n- problem: 只算了读 1.2 GB 权重，没算 KV 读取：4096 上下文时每步还要读约 448 MiB KV（约等于权重的 37%），并入后真实下界约 1.0–1.1 ms。虽然标了「下界」，但紧接着说「实测常见是 2–4 倍」，初学者容易把 0.75 ms 当成 TPOT 基准，误判机器性能。\n- fix: 补一句「这里略去 KV 读取与激活访存，只给权重带宽的最低界；4096 上下文时每步还要多读约 0.45 GB KV」，或直接给出「权重 + KV」的合并估算 ≈1.0 ms。\n\n### 7. severity: low\n\n- claim: CANN 的直觉类比「相当于操作系统 + 显卡驱动 + 标准数学库」\n- problem: 与本课自己的三层栈定义冲突：驱动与固件属于 HDK，CANN 只提供驱动接口和运行时。把 CANN 说成含「显卡驱动」，学员定位问题时会把 `npu-smi` 看不到卡归到 CANN 层，而正文其实归给了驱动/容器设备映射。\n- fix: 改成「CANN ≈ CUDA Toolkit + cuBLAS + NCCL（不含驱动，驱动在 HDK 层）」，与前面「HDK 含驱动和固件」保持一致。\n\n### 8. severity: low\n\n- claim: 第 3 步「预构建镜像里 CANN、NNAL、PyTorch、torch-npu、vLLM、vllm-ascend 已是一套验证过的组合」，以及「进容器先做三行验证」\n- problem: NNAL 首次出现未做任何解释（它是 CANN 里提供 libatb.so / ATB 运行时的组件，官方 v0.30.0 行里 NNAL 也有独立版本号 9.2.1），也不在术语卡；PrivateUse1、Ascend C 同样只提名字。基础弱的读者会被这几个词卡住，也不知道 NNAL 版本同样要跟 CANN 对齐。另外「三行验证」实际只给了两行代码。\n- fix: 给 NNAL 一句解释并进术语卡（「CANN 中提供 ATB 算子库运行时的组件，版本随 CANN」），PrivateUse1 / Ascend C 各补半句；把「三行验证」改成「两行」或补第三行版本打印（如 `print(torch.__version__, torch_npu.__version__)`）。\n", "term_count": 17, "source_count": 8, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-ascend-arch-2", "date": "2026-11-03", "title": "第 8 课 · 昇腾 NPU 架构与 CANN 生态（下）", "main_thread": "能画出 CANN/驱动/固件与 PyTorch、MindSpore 的层次关系，说清「谁调用谁」 · 能说清 AscendCL、torch-npu、MindSpore 各自的位置与接入路径 · 能手算 decode 吞吐上限并判读带宽/算力瓶颈，知道 profiler 看什么", "domain": "硬件", "module": "昇腾 NPU 架构与 CANN 生态", "module_id": "ascend-arch", "lesson_no": 8, "tags": ["昇腾 NPU", "CANN", "torch-npu", "AscendCL", "性能剖析", "vLLM"], "markdown": "# 第 8 课 · 昇腾 NPU 架构与 CANN 生态（下）\n\n> 学完今天，你能：\n> 1. 画出 CANN/驱动/固件与 PyTorch、MindSpore 的层次关系，说清「谁调用谁」\n> 2. 说清 AscendCL、torch-npu、MindSpore 各自的位置与接入路径\n> 3. 手算 decode 吞吐上限并判读带宽/算力瓶颈，知道 profiler 看什么\n\n## 课前自测\n\n1. CANN 是什么的缩写？它和 PyTorch 是什么关系？\n2. torch-npu 是独立深度学习框架吗？只装 torch-npu、不装 CANN，能跑起来吗？\n3. 推理时每生成 1 个 token，为什么要把全部模型权重读一遍？decode 阶段是算力受限还是显存带宽受限？\n4. 用什么工具能看到每个算子在 NPU 上各花了多少时间？\n5. MindSpore 2.x 默认是动态图还是静态图？它接入昇腾走的是 AscendCL 吗？\n\n## 为什么需要它\n\n你的工作是「昇腾 NPU + vLLM（大模型推理引擎，基于 PyTorch）做推理」。回顾上集：NPU 与 GPU 设计哲学差异是——GPU 靠大量通用小核兼顾图形与并行，NPU 专为矩阵乘等神经网络负载定制；昇腾核心是达芬奇架构 AI Core，含 Cube（矩阵乘）、Vector（向量）、Scalar（标量）三类单元；Atlas 产品线按训练、推理、边缘定位划分。日常三个高频问题：部署报 `CANN not found`、算子不支持；吞吐上不去；不知瓶颈看什么指标。答案都在昇腾软件栈的层次里。本集讲清「谁调用谁、谁编译谁、谁搬数据」，为下一课 vLLM 调优铺路。\n\n## 核心概念\n\n### CANN 与软件栈层次\n\n**定义**：CANN（Compute Architecture for Neural Networks）是昇腾软件底座：驱动、固件、运行时、编译器、算子库、编程接口与性能工具都属其中。\n\n**直觉**：昇腾 NPU 像一台裸机：驱动/固件像主板固件与内核，AscendCL 像系统调用接口，torch-npu 像把 PyTorch 翻译成这些调用的适配器，vLLM 是应用。\n\n**机制**（自顶向下，两条框架路径）：\n\n```text\nvLLM ─ PyTorch ─ torch-npu ─→ AscendCL（torch-npu 使用的编程接口）\nMindSpore ─→ GE + MindRT（图引擎 / 运行时）\n                 │\n       算子库 / 图编译 / 算子编译 ─ Runtime（执行环境）\n                 │\n       驱动 Driver / 固件 Firmware\n                 │\n    达芬奇硬件：AI Core / HBM / 片上总线\n```\n\n两条路径平级，都落在 CANN 算子库与 Runtime 上。\n\n**例子**：一次 `torch.mm` 的旅程：torch-npu → AscendCL 矩阵乘调用 → 算子库取（或现编译）NPU 二进制 → Runtime 下发 AI Core。框架不认识 NPU，CANN 才是 NPU 的「操作系统」。\n\n### AscendCL 与 torch-npu\n\n**定义**：AscendCL（Ascend Computing Language，ACL）是 CANN 的 C/C++ 编程接口，管设备初始化、显存分配、数据搬运与算子执行。torch-npu 是华为维护的 PyTorch 插件（设备名 `\"npu\"`），把每个算子映射到 CANN。\n\n**直觉**：AscendCL 之于昇腾 ≈ CUDA Runtime 之于 NVIDIA；torch-npu 是「接线板」：上接熟悉的 PyTorch，下接昇腾。\n\n**机制**：`import torch_npu` 注册 npu 设备后，`torch.tensor(..., device=\"npu\")` 建 HBM 张量，`torch.mm` 被分派到 CANN 算子。它不重写 PyTorch，是插件而非新框架。\n\n**例子**：排查自底向上：驱动 → CANN → torch-npu——能 import 但一跑就报错，说明下面某层缺失或版本不配套。\n\n### MindSpore 的位置\n\n**定义**：MindSpore 是华为开源的深度学习框架，原生支持昇腾；2.x 起默认 PyNative 动态图，静态图需显式 `set_context(GRAPH_MODE)` 或 `@jit`。\n\n**直觉**：昇腾上有两条路：PyTorch + torch-npu（vLLM 走这条）与 MindSpore 原生路线，平级而非上下级。\n\n**机制**：MindSpore 不经 AscendCL：昇腾后端由 CANN 图引擎 GE 负责图编译与执行、自有运行时 MindRT 负责调度。它以静态图整图下沉的优化见长（算子融合、内存复用、自动并行），生产训练常切 GRAPH_MODE。\n\n**例子**：做 vLLM 不必学它，但要清楚它不替代 CANN、也不走 AscendCL。\n\n### 编译与算子调度\n\n**定义**：算子（operator）是 AI Core 上执行的计算内核，如矩阵乘、LayerNorm。图编译把整张图优化（算子融合、常量折叠）后生成执行序列；算子调度是运行时按依赖把算子排队派发 AI Core。\n\n**直觉**：编译像把菜谱翻译成后厨工序：图编译=合并工序（切菜腌肉合一步，少洗一次砧板）；算子调度=决定哪道工序进哪口锅。\n\n**机制**：PyTorch 默认动态图（eager）：算子逐个立即下发执行，不做整图编译，灵活但优化少；`torch.compile`（PyTorch 图编译 API，可做整图融合优化）与 MindSpore 静态图走整图编译。CANN 还有自动调优，为同一算子挑最快实现。\n\n**例子**：算子融合对 vLLM 尤其重要：融合掉的中间结果不用写回 HBM，省带宽；decode 阶段省带宽就是提吞吐。\n\n### 用 profiler 看瓶颈\n\n**定义**：profiler（性能剖析工具）给程序打点计时。昇腾可用 msprof 命令行 + Ascend Insight 网页，或 PyTorch 里 `torch_npu.profiler`。\n\n**直觉**：给每个算子装秒表、给整卡装监控：谁耗时最多、AI Core 多忙、显存拷贝花多久，一目了然。\n\n**机制**：关键指标——AI Core 利用率（ai_core_utilization）、算子耗时排名（op_statistic）、显存拷贝耗时、算子间空泡。利用率高=算力瓶颈；利用率低但拷贝多/有空泡=带宽或调度瓶颈。\n\n**例子**：下一课调 vLLM 的第一步永远是先跑 profiler，再决定加 batch 还是换算子。\n\n## 一步一步理解\n\n**目标**：手算 7B 模型在昇腾上 decode（逐 token 生成）阶段的吞吐上限并判断瓶颈，只用乘除法。\n\n**已知（假设）**：7B 模型（70 亿参数），FP16（每参数 2 字节）→ 权重 14 GB。HBM 带宽取 1.6 TB/s（昇腾 910 系列量级流传值，官方未公布精确数字，存疑；换实测带宽重算即可）。NPU 算力取约 300 TFLOPS（量级值，存疑）。\n\n**第 1 步：decode 1 个 token 读多少数据？** 每个权重在矩阵-向量乘里恰好被用一次（从 HBM 读进 Cube 单元），故约读 14 GB。另有 KV cache（键值缓存）等读取：短上下文时远小于权重，先忽略，不影响带宽受限结论；长上下文时会变大。\n\n**第 2 步：读多久？** 14×10⁹ B ÷ 1.6×10¹² B/s = 8.75 ms。\n\n**第 3 步：单请求吞吐。** 1 ÷ 0.00875 ≈ 114 tokens/s。\n\n**第 4 步：batch=8 呢？** 权重只读一遍、服务 8 个 token：8 ÷ 0.00875 ≈ 914 tokens/s。总吞吐涨约 8 倍，单请求延迟几乎不变。\n\n**第 5 步：为什么带宽受限？** 每权重读 2 字节、做 1 次乘加 ≈ 2 FLOP → 算术强度 1 FLOP/字节；卡能支撑 ≈ 300×10¹² ÷ 1.6×10¹² ≈ 188 FLOP/字节。1 ≪ 188：算力在等数据，瓶颈是显存带宽（memory-bound，带宽受限）。\n\n**落到 vLLM**：decode 带宽受限 → 吞吐靠加大 batch；batch 上限由显存容量（KV cache 占大头）和算力封顶。这正是 continuous batching（动态合批）的价值，即下一课调优主线。\n\n## 常见误区\n\n**误区 1：「torch-npu 是昇腾版 PyTorch，装了它就不用装 CANN。」** 事实：torch-npu 只是适配插件，每个算子都要落到 CANN，驱动、固件、CANN 缺一不可，且版本配套。症状：能 import，一跑报 CANN 找不到/算子不支持。排查自底向上：驱动 → CANN → torch-npu。\n\n**误区 2：「decode 慢就是 NPU 算力不够。」** 事实：单请求 decode 带宽受限（见手算），算力翻倍而带宽不变几乎不提升单请求吞吐。动作：看 AI Core 利用率——低利用率+长耗时=在等数据。提升靠加 batch 或量化（少读权重）。\n\n**误区 3：「昇腾上必须用 MindSpore。」** 事实：vLLM 全线走 PyTorch + torch-npu，官方维护 vllm-ascend；MindSpore 是可选项。选型看生态，不看「纯血」。\n\n## 一句话总结\n\n昇腾软件栈自顶向下：框架（PyTorch/vLLM）→ 适配层（torch-npu）→ CANN（AscendCL+编译+算子库+Runtime）→ 驱动/固件 → 达芬奇硬件；MindSpore 走 GE+MindRT 旁路，同样落在 CANN 之上。decode 阶段显存带宽是主瓶颈：先用 profiler 定位（AI Core 利用率、算子耗时、拷贝），再靠 batch 提吞吐——这就是下一课调 vLLM 的地基。\n\n## 自测题\n\n### 1. CANN 与驱动、固件是什么关系？为什么「只装 torch-npu」跑不起来？\n<details><summary>查看答案<\/summary>驱动与固件是 CANN 底座最底层，负责硬件初始化与任务下发，需与 CANN 版本配套；torch-npu 只是把算子映射到 CANN 的插件，缺了它们算子无处执行。症状：能 import，一跑报 CANN not found。排查自底向上：驱动 → CANN → torch-npu。<\/details>\n\n### 2. MindSpore 接入昇腾走 AscendCL 吗？它默认是静态图吗？\n<details><summary>查看答案<\/summary>不走 AscendCL：MindSpore 昇腾后端由 CANN 图引擎 GE 编译执行、自有运行时 MindRT 调度；AscendCL 是 torch-npu 与独立应用用的接口。2.x 起默认 PyNative 动态图，静态图需 GRAPH_MODE 或 @jit。<\/details>\n\n### 3. decode 每生成 1 个 token 为什么要读一遍 14 GB 权重？瓶颈是算力还是带宽？\n<details><summary>查看答案<\/summary>decode 是矩阵-向量乘，每个权重被读一次：14 GB ÷ 1.6 TB/s = 8.75 ms → 单请求约 114 tokens/s，batch=8 约 914 tokens/s。算术强度约 1 FLOP/字节，远低于卡能支撑的约 188 → 带宽受限。KV cache 短上下文可忽略、长上下文不可忽略。<\/details>\n\n### 4. 用什么工具看每个算子在 NPU 上的耗时？拿到指标怎么判读？\n<details><summary>查看答案<\/summary>msprof + Ascend Insight，或 torch_npu.profiler。看 ai_core_utilization、op_statistic、拷贝耗时与空泡：利用率高=算力瓶颈；利用率低但拷贝多/有空泡=带宽或调度瓶颈。<\/details>\n\n### 5. batch 从 1 加到 8，为什么总吞吐涨约 8 倍而单请求延迟几乎不变？\n<details><summary>查看答案<\/summary>权重读取的 8.75 ms 是固定成本，被 8 个请求分摊：单请求延迟几乎不变，总吞吐约 8 倍。batch 上限由显存（KV cache）与算力封顶——这正是 continuous batching 的价值。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| CANN | 昇腾软件底座（Compute Architecture for Neural Networks），含驱动、固件、编译器、算子库、编程接口与性能工具 |\n| AscendCL（ACL） | CANN 的 C/C++ 编程接口，管理设备、显存、搬运与算子执行，是 torch-npu 用的接口，角色类似 CUDA Runtime |\n| torch-npu | 华为维护的 PyTorch 适配插件，把算子映射到 CANN，提供 device=\"npu\" |\n| MindSpore | 华为开源深度学习框架，2.x 起默认 PyNative 动态图；昇腾后端走 GE + MindRT，不经 AscendCL |\n| vllm-ascend | vLLM 的昇腾后端插件，基于 torch-npu，昇腾上跑 vLLM 的官方路线 |\n| 算子（operator） | AI Core 上执行的计算内核，如矩阵乘、LayerNorm |\n| 图编译 | 对整张图做算子融合、常量折叠等优化后再执行；eager 则算子逐个立即下发、不整图编译 |\n| AI Core | 昇腾 NPU 核心计算单元，含 Cube（矩阵乘）、Vector（向量）、标量三类单元 |\n| HBM | NPU 高带宽显存，权重与 KV cache 存于此，带宽主要决定 decode 吞吐上限 |\n| msprof / Ascend Insight | CANN 性能剖析工具链，输出算子耗时、AI Core 利用率等 |\n| memory-bound（带宽受限） | 计算单元多数时间在等显存数据而非计算，decode 典型如此 |\n| 驱动与固件 | 最底层设备软件，负责硬件初始化与任务下发，需与 CANN 版本配套 |\n\n## 下一步\n\n下一课《昇腾上的 vLLM：vllm-ascend 部署与调优》：部署 vllm-ascend、continuous batching 与 KV cache 如何影响吞吐、HCCL（昇腾集合通信库）多卡组网、拿到 profiler 结果后如何调参。\n\n## 来源\n\n1. 昇腾社区官方文档中心（CANN / AscendCL / Profiling） — https://www.hiascend.com/document\n2. CANN 性能调优工具：op_statistic 算子耗时统计（历史版本示例，若失效请从昇腾文档中心搜索） — https://www.hiascend.com/document/detail/zh/CANNCommunityEdition/81RC1alpha001/devaids/devtools/profiling/atlasprofiling_16_0068.html\n3. torch_npu 官方仓库（Ascend/pytorch） — https://github.com/Ascend/pytorch\n4. vllm-ascend 官方仓库 — https://github.com/vllm-project/vllm-ascend\n5. vLLM 昇腾插件官方文档 — https://docs.vllm.ai/projects/ascend/zh-cn/v0.23.0rc1/installation.html\n6. MindSpore 官网 — https://www.mindspore.cn", "review_md": "# 审校记录 · 2026-11-03-ascend-arch-2\n\n- date: 2026-11-03\n- file: 课程/硬件/2026-11-03-ascend-arch-2.md\n- title: 第 8 课 · 昇腾 NPU 架构与 CANN 生态（下）\n- module_id: ascend-arch\n- lesson_no: 8\n\n## verdict\n\nrevise\n\n## summary\n\n数学全部重算无误：14×10⁹×2=14 GB、14e9/1.6e12=8.75 ms、1/0.00875≈114 tokens/s、8/0.00875≈914 tokens/s、300e12/1.6e12≈188 FLOP/字节、算术强度 2 FLOP/2 B=1 FLOP/字节，均正确；对带宽与算力的『存疑/量级』标注（910B 流传值、300 TFLOPS 量级）处理得当，没有把推测写成事实。教学结构完整（课前自测→动机→核心概念→手算例子→误区→一句话总结→术语卡→下一步→来源），缩写基本都有解释，手算可跟。两处必须改的事实错误都在软件栈层次：①层次图把 MindSpore 画到 AscendCL 之下（实际 MindSpore 走 CANN 的 GE 图引擎 + 自有运行时 MindRT，不用 AscendCL），而『画出层次关系』正是模块目标的核心；②『MindSpore 默认静态图』已过时（官方文档明确 2.0 起默认 PyNative 动态图）。另有 eager『即时编译』用词、KV cache 读取未交代等限定性问题。模块 4 个目标中本课直接覆盖『CANN/驱动/固件与框架层次关系』，其余 3 个（NPU vs GPU 设计哲学、达芬奇矩阵单元、Atlas 产品线）依赖上集，建议加一行跨课回顾。\n\n## issues\n\n### 1. 层次图把 MindSpore 画到 AscendCL 之下（high）\n\n- severity: high\n- claim: 层次图中『MindSpore（原生）→ AscendCL（统一编程接口）』，且正文称 AscendCL 是『统一编程接口』、两条路线『都建在 CANN 之上』\n- problem: MindSpore 并不使用 AscendCL：其昇腾后端由 CANN 的图引擎 GE 负责图编译/执行、由 MindSpore 自有的运行时 MindRT 负责调度；AscendCL 是 torch-npu 和独立应用开发用的 C/C++ 接口。把 MindSpore 画到 AscendCL 之下会让学生对『谁调用谁』形成错误印象，而『能画出 CANN/驱动/固件与框架之间的层次关系』正是本模块目标之一，画错的正是核心图。\n- fix: 改为两条并列路径：PyTorch→torch-npu→AscendCL；MindSpore→GE（图编译）+ MindRT；二者都落在 CANN 的算子库与 Runtime 之上。正文把『统一编程接口』改为『torch-npu 使用的编程接口』，并在 MindSpore 小节说明它与 torch-npu 接入 CANN 的路径不同。\n\n### 2. MindSpore 默认静态图为过时事实（high）\n\n- severity: high\n- claim: 『MindSpore 默认静态图：先整图编译……再执行』（术语卡同：『默认静态图编译』）\n- problem: 与现行产品不符：MindSpore 官方教程明确 2.0 起『默认计算图模式为 PyNative 模式』（动态图），静态图需显式 set_context(GRAPH_MODE) 或加 @jit。这是过时的事实错误，初学者装新版 MindSpore 验证时会对不上。\n- fix: 改为『MindSpore 以静态图/整图下沉的图编译优化见长（2.x 起默认动态图 PyNative，生产训练用 GRAPH_MODE 或 jit 切静态图）』，术语卡同步修改。\n\n### 3. eager 被描述为「即时编译下发」（medium）\n\n- severity: medium\n- claim: 『PyTorch 默认动态图（eager，算子逐个即时编译下发）』\n- problem: eager 模式并不做编译，而是直接调用已就绪的算子内核逐个立即下发执行；『即时编译』一词会把 eager 与 torch.compile/JIT 的图编译混为一谈，恰好模糊了本节要教的动态图 vs 图编译的区别。\n- fix: 改为『算子逐个立即下发执行（不做整图编译）』；如想保留编译概念，可另加一句『torch.compile（PyTorch 的图编译 API）与 MindSpore 走整图编译』。\n\n### 4. 手算只计权重、未交代 KV cache 读取（medium）\n\n- severity: medium\n- claim: 『第 1 步：decode 1 个 token 读多少数据？……故约读 14 GB』，术语卡 HBM 行『其带宽决定 decode 吞吐』\n- problem: 14 GB 只算了权重；decode 实际还要读 KV cache（随上下文长度增长，短上下文时远小于 14 GB，数万 token 长上下文时可达数 GB，不再可忽略）和少量激活。初学者容易把 14 GB 当成精确总量，之后实测吞吐低于手算值时无从解释。结论（带宽受限）不受影响，但限定缺失。\n- fix: 第 1 步补一句：『另有 KV cache 等读取，短上下文时量级远小于权重，这里先忽略，不影响带宽受限的结论；长上下文时它会变大』。术语卡『决定』改为『主要决定 decode 吞吐上限』。\n\n### 5. 「910B 是旗舰 NPU 芯片」为时效性表述（low）\n\n- severity: low\n- claim: 『910B 是昇腾旗舰 NPU 芯片』\n- problem: 『旗舰』是时效性表述，写死成无时限的事实容易过时（如后续 910C/950 等型号发布后），对初学者可能造成型号认知偏差。\n- fix: 改为『910B 是昇腾 910 系列的高端芯片（截至讲义编写时）』，或直接说『取昇腾 910 系列量级的带宽』。\n\n### 6. torch.compile 未加解释（low）\n\n- severity: low\n- claim: 『torch.compile 与 MindSpore 走整图编译』\n- problem: torch.compile 对基础弱的读者是未解释的术语，而它恰是本节『图编译』概念在 PyTorch 侧的对照物，直接抛出会丢知识点。\n- fix: 加括号说明：『torch.compile（PyTorch 的图编译 API，可对整图做融合优化）』。\n\n### 7. 模块目标覆盖不闭环（low）\n\n- severity: low\n- claim: 本课（下）只直接覆盖模块目标中的『CANN/驱动/固件与框架的层次关系』，其余 3 个目标（NPU vs GPU 设计哲学、达芬奇矩阵单元、Atlas 产品线）全部依赖上集\n- problem: 本课仅用『回顾上集』一句带过这些前置内容；若学生跳课或遗忘，本节课中 CUDA 类比、Cube 单元、910B/Atlas 等引用会失去支点，模块目标整体覆盖不闭环。\n- fix: 在『为什么需要它』里加一行跨课回顾（NPU 与 GPU 设计哲学一句话对比、Cube/Vector/Scalar 一句话、Atlas 产品线一句话），或在课前自测加 1 道上集复习题。\n\n### 8. 来源 2 链接钉死在旧 alpha 版本（low）\n\n- severity: low\n- claim: 来源 2 指向 CANN Community Edition 81RC1alpha001（alpha 版）的 op_statistic 文档页\n- problem: 链接钉死在旧 alpha 版本上，文档站改版或版本下架后易失效，且 alpha 版内容可能与学员实际安装的 CANN 正式版不一致。\n- fix: 换成当前正式版 CANN 的 Profiling 章节入口（如 hiascend.com/document 下最新 Community Edition 的调优工具文档），或附『若失效请从昇腾文档中心搜 op_statistic』的提示。\n", "term_count": 12, "source_count": 6, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-ascend-arch", "date": "2026-11-03", "title": "第 7 课 · 昇腾 NPU 架构与 CANN 生态（上）", "main_thread": "解释 NPU 与 GPU 在设计哲学上的异同，并判断一类负载更适合哪种芯片 · 说清达芬奇架构 Cube/Vector/Scalar 的分工，以及 910B 与初代 910 核组织方式的区别 · 分清 Atlas 各产品线定位，并会估算一个 GEMM 层落在计算受限还是带宽受限", "domain": "硬件", "module": "昇腾 NPU 架构与 CANN 生态", "module_id": "ascend-arch", "lesson_no": 7, "tags": ["昇腾", "NPU", "达芬奇架构", "CANN", "HBM", "Atlas"], "markdown": "# 第 7 课 · 昇腾 NPU 架构与 CANN 生态（上）\n\n> 学完今天，你能：\n> 1. 解释 NPU 与 GPU 在设计哲学上的异同，并判断一类负载更适合哪种芯片\n> 2. 说清达芬奇架构 Cube/Vector/Scalar 的分工，以及 910B 与初代 910 核组织方式的区别\n> 3. 分清 Atlas 各产品线定位，并会估算一个 GEMM 层落在计算受限还是带宽受限\n\n## 课前自测\n\n先凭直觉作答，答错没关系，正文会逐一纠正：\n\n1. GPU 和 NPU，哪个更「样样通」，哪个更「一招鲜」？\n2. Cube 一个周期算一个 16×16×16 矩阵乘加块，一共多少次乘法？\n3. 昇腾 910B 的显存是 HBM 还是 GDDR？单卡容量约多少？\n4. Atlas 300I Duo 和 Atlas 800I A2 分别是什么产品形态（插卡 / 整机）？\n5. vLLM 推理时，把 batch 从 1 增大到 1024，单卡吞吐会怎样变化？为什么？\n\n## 为什么需要它\n\n你的工作里到处是 NPU、AI Core、HBM：vLLM（你正在用的开源大模型推理引擎）的日志、容量规划、故障排查都会遇到。它们不是装饰：芯片设计决定算子（深度学习的基本计算单元，如矩阵乘、激活函数）怎么写、显存怎么规划、吞吐天花板在哪。GPU 有 CUDA 生态，昇腾有 CANN（Compute Architecture for Neural Networks，昇腾整套软件栈，下集展开）。本集先回答三个硬件问题：芯片为什么快、矩阵怎么算、产品怎么选。\n\n## 核心概念\n\n### NPU 与 GPU 的区别\n\n**定义**：NPU（Neural-network Processing Unit，神经网络处理器）为矩阵/张量运算深度定制；GPU（Graphics Processing Unit，图形处理器）从图形渲染演化而来，靠大量小核心并行做通用计算。\n\n**直觉**：GPU 像一支「百人厨师团」，人人会做各种菜（图形、科学计算、AI），靠人多取胜，后来为 AI 加装了一个「专用灶台」（Tensor Core，张量核心，专做矩阵乘）；NPU 是「只为矩阵乘法盖的流水线车间」，一道菜做到极致。\n\n**机制**：GPU 由大量通用核心加少量张量核心组成，兼顾各类负载；NPU 以达芬奇架构的 AI Core 为主，晶体管几乎全投向矩阵与向量运算。设计哲学差别：GPU「通用优先，AI 是后加的加速器」；NPU「AI 优先，通用控制只是辅助」。代价也很清楚：跑分支密集、访存不规则的负载时 NPU 不占优，有时要靠 CPU 兜底。这也解释了为什么昇腾上跑 vLLM 必须依赖 CANN 深度优化的算子，不能把 CUDA 的 kernel（运行在 GPU 上的计算函数）直接搬过来。\n\n### 达芬奇架构\n\n**定义**：华为自研的 AI 处理器微架构（DaVinci Architecture），2018 年随昇腾 310/910 发布（910 于 2019 年商用）。\n\n**直觉**：它是 AI Core 内部的「车间平面图」：哪台做矩阵乘、哪台做杂活、哪台当指挥。\n\n**机制**：三大计算单元分工——\n- Cube（矩阵/立方体计算单元）：一个时钟周期完成一个 16×16×16 矩阵乘加 = 4096 次 MAC（Multiply-Accumulate，一次乘加 = 一次乘法加一次加法）；支持 BF16（16 位脑浮点数）输入、FP32 累加。这是 AI 算力的源头。\n- Vector（向量单元）：逐元素运算，如激活函数、归一化。\n- Scalar（标量单元）：循环控制与分支。\n\n配套存储：Unified Buffer（UB，每核约 192 KB 片上缓冲）、L0A/L0B/L0C（Cube 的操作数与累加缓冲）、MTE（搬运引擎）。UB/L0 是算子经 MTE 显式管理的 SRAM 缓冲，不是自动换入换出的 cache。大模型 90% 以上浮点运算集中在矩阵乘，Cube 的规格几乎决定整卡算力。\n\n### AI Core\n\n**定义**：昇腾处理器上执行算子的最小计算单元；一颗芯片集成几十个。核的组织随代际变化：初代 910 每个 AI Core 集成 Cube+Vector+Scalar 三件套；910B 把向量部分独立为 AIV（AI Vector），与带 Cube 的 AIC（AI Core）并列。\n\n**直觉**：初代 910 的 AI Core 是「完整小工厂」——矩阵灶台、杂活间、指挥室一栋楼；910B 把杂活间拆出去另盖，工厂更专一。\n\n**机制**：910B（B2 版本）约含 24 个带 Cube 的 AIC 与 48 个 AIV，官方产品页标称 FP16 峰值约 376 TFLOPS；初代 910 为 32 核、256 TFLOPS。核数属半公开信息（来自 CANN 工具配置与公开分析，存疑），卡片级官方规格更可靠。910C 则把两片 die（裸片，硅晶圆切出的芯片）封装在一起，公开评测约 800 TFLOPS FP16，官方规格未公开，存疑。\n\nAI Core 干活流水线：Scalar 指挥 → MTE 把矩阵块从 HBM 搬进 UB/L0 → Cube 计算 → 结果写回 UB → 搬回 HBM；计算与搬运重叠，把访存延迟藏起来。\n\n### HBM 显存\n\n**定义**：HBM（High Bandwidth Memory，高带宽内存）把多层 DRAM 垂直堆叠，与处理器同基板封装，数千条短连线连接。\n\n**直觉**：GDDR（图形用双速率同步显存）像「离工厂很远的公路」，车道少；HBM 像「贴着工厂墙的超宽码头」。堆叠 = 盖楼，省面积，但离芯片太近散热难、成本高。\n\n**机制**：两个关键数字：容量（放得下多少权重与 KV cache——推理时缓存的键/值张量，避免对已生成 token 重复计算）和带宽（每秒能搬多少字节）。910B 单卡配 64 GB HBM，8 卡 Atlas 800I A2 合计 512 GB；带宽约 1.2 TB/s（官方未列出，来自 CANN 配置与公开评测，存疑）。AI 芯片选 HBM 的原因：矩阵乘太快、搬运跟不上，带宽才是瓶颈。\n\n### Atlas 产品线（910B/910C）\n\n**定义**：Atlas 是昇腾硬件产品品牌，覆盖模组、加速卡、服务器、集群；910B/910C 是芯片代号，即 910 系列的第二、三代。\n\n**直觉**：芯片像发动机，产品线像整车目录：910B 发动机 → 双发插卡 → 八发整机 → 集群车队。\n\n**机制**：定位速记——\n- Atlas 300I Duo：双 910B 的 PCIe（高速串行扩展总线，连接 CPU 与加速卡）插卡，128 GB HBM、约 752 TFLOPS FP16，适合单机加卡与试点；\n- Atlas 800I A2：8×910B 的推理整机，512 GB HBM，生产推理主力；\n- Atlas 800T A2：8×910B 的训练整机；\n- Atlas 900 SuperCluster / CloudMatrix 384：集群与超节点；公开报道称 CloudMatrix 384 由 384 颗 910C 构成（官方规格未公开，存疑）；\n- 边缘场景另有 Atlas 200I A2 模组（310B 芯片）等。\n\n选型口诀：生产推理优先 800I A2 整机，试点或单机扩容用 300I Duo，超大规模用 910C 超节点。\n\n## 一步一步理解\n\n**场景**：910B 单卡跑 vLLM，模型某线性层权重 W 是 4096×4096 的 BF16 矩阵（每元素 2 字节，共 32 MiB）。这类「矩阵乘矩阵」运算叫 GEMM（General Matrix Multiply）。问：decode 阶段（逐 token 生成：每生成一个 token 就做一次本轮矩阵乘）batch=1 时，这一层要多久？瓶颈是什么？注：约 1.2 TB/s 带宽属存疑数值，换值只按比例缩放搬运时间，结论不变。\n\n**第 1 步，数运算量**。输入 x 是 1×4096 向量，输出 y = x·W 是 1×4096；y 每个元素 = 4096 次乘加，总 MAC = 1×4096×4096 = 16,777,216 ≈ 33.5 MFLOP（百万次浮点运算）。\n\n**第 2 步，算计算时间**。910B 峰值 376 TFLOPS = 376×10¹² 次浮点运算/秒，折合 188×10¹² 次乘加/秒。t = 16,777,216 ÷ 188×10¹² ≈ 89 ns。小到可以忽略。\n\n**第 3 步，算搬运时间**。算之前必须把 W 完整读进 AI Core：32 MiB = 33,554,432 字节，按 1.2×10¹² 字节/秒 ≈ 28 µs。\n\n**第 4 步，对比**。28 µs ÷ 89 ns ≈ 300 倍：算得快、等得久，这一层是带宽受限（bandwidth-bound，耗时由搬运决定），decode 算力大量闲置。\n\n**第 5 步，推论**。把 batch 提到 1024：运算量乘 1024，约 91 µs；而 W 只搬一次（总搬运约 35 µs < 91 µs），变成计算受限（compute-bound，耗时由算力决定）。单层理想吞吐从约 3.6 万 token/s 升到约 1100 万 token/s——但这仅是「这一层」的理想上界，不是整卡真实吞吐：一个 token 要依次过全部几十层，还要算注意力等非 GEMM 算子。量级对照：若模型有 80 个同规模层，batch=1 时每 token 约 80×28 µs ≈ 2.2 ms（约 450 token/s），才接近真实整卡量级。这就是 vLLM 增大 batch 能提吞吐、decode 阶段要精打细算 KV cache 的硬件根源；prefill（预填充，一次性算完整个 prompt）天然 M 大，也是计算受限。\n\n## 常见误区\n\n1. **「NPU 全面强于 GPU」**。错。NPU 只在矩阵密集负载上极致；分支多、访存乱、科学计算类任务效率不高。强不强看负载形状，不看芯片名头。\n2. **「TFLOPS 越高，推理越快」**。只对了一半。decode 是带宽受限，峰值算力根本摸不到；选卡要同时看算力与带宽的配比。\n3. **「Cube 一个周期算完一个大矩阵」**。错。任何大矩阵都要切成 16×16×16 的小块反复迭代；一个 4096³ 的 GEMM 是约 1677 万块、块块排队。同理，batch=1 时算力「闲着」是带宽受限的正常现象，不是故障。\n\n## 一句话总结\n\n昇腾 NPU = 达芬奇架构 AI Core（Cube 每周期做 16×16×16 矩阵乘加）+ HBM 高带宽显存；910B/910C 撑起 Atlas 从插卡到超节点的产品线（910B 上 Vector 已独立为 AIV）。推理快不快，取决于负载落在计算受限还是带宽受限。\n\n## 自测题\n\n### 1. GPU 和 NPU，哪个更「样样通」，哪个更「一招鲜」？\n\n<details><summary>查看答案<\/summary>\n\nGPU 更「样样通」：从图形渲染演化而来，靠大量通用小核心并行，图形、科学计算、AI 都能跑，AI 靠后加的 Tensor Core 加速。NPU 更「一招鲜」：晶体管几乎全投向矩阵/向量运算，矩阵乘做到极致，但分支密集、访存不规则的负载不占优，有时要 CPU 兜底。\n\n<\/details>\n\n### 2. Cube 一个周期算的 16×16×16 矩阵乘加块，一共多少次乘法？\n\n<details><summary>查看答案<\/summary>\n\n16×16×16 = 4096 次乘法，同时有 4096 次加法，即 4096 次 MAC = 8192 次浮点运算（BF16 输入、FP32 累加）。大矩阵都要切成 16×16×16 的小块反复迭代：4096³ 的 GEMM 约需 4096³ ÷ 16³ ≈ 1677 万块排队。\n\n<\/details>\n\n### 3. 昇腾 910B 的显存是 HBM 还是 GDDR？单卡容量约多少？\n\n<details><summary>查看答案<\/summary>\n\n是 HBM：多层 DRAM 垂直堆叠、与芯片同封装，带宽远高于 GDDR。910B 单卡 64 GB HBM，8 卡 Atlas 800I A2 合计 512 GB；带宽约 1.2 TB/s（官方未列出，存疑）。选 HBM 的原因：矩阵乘太快、搬运跟不上，带宽才是推理瓶颈。\n\n<\/details>\n\n### 4. Atlas 300I Duo 和 Atlas 800I A2 分别是什么产品形态？\n\n<details><summary>查看答案<\/summary>\n\nAtlas 300I Duo 是双 910B 的 PCIe 插卡（128 GB HBM，约 752 TFLOPS FP16），适合单机加卡与试点；Atlas 800I A2 是 8×910B 的推理整机（512 GB HBM），生产推理主力。往上还有训练整机 Atlas 800T A2、384 颗 910C 的 CloudMatrix 384 超节点（官方规格未公开，存疑），边缘有 Atlas 200I A2 模组（310B）。\n\n<\/details>\n\n### 5. vLLM 推理把并发 batch 从 1 增大到 1024，单卡吞吐会怎样变化？为什么？\n\n<details><summary>查看答案<\/summary>\n\n显著提升，瓶颈从带宽受限翻转为计算受限。batch=1：W 算一次只要约 89 ns，但 32 MiB 的 W 从 HBM 搬进 AI Core 要约 28 µs（约 300 倍等待），算力闲置。batch=1024：运算量乘 1024 约 91 µs，W 只搬一次（约 35 µs），变成计算受限。注意口径：3.6 万 → 约 1100 万 token/s 只是「单层 GEMM」的理想上界；一个 token 还要过全部几十层、算注意力等算子，80 层同规模模型 batch=1 时每 token 约 2.2 ms（约 450 token/s）才接近真实整卡量级。\n\n<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| NPU | 神经网络处理器，为矩阵运算深度定制的 AI 芯片 |\n| GPU | 图形处理器，大量通用核心并行，AI 靠后加的 Tensor Core 加速 |\n| 达芬奇架构 | 华为自研 AI 处理器微架构，规定 AI Core 内单元分工；2018 年随昇腾 310/910 发布 |\n| AI Core | 昇腾上执行算子的最小计算单元；初代 910 形态内含 Cube/Vector/Scalar，910B 上 Vector 独立为 AIV |\n| AIC / AIV | 910B 上带 Cube 的 AI 计算核 / 向量核，二者并列；初代 910 的 Vector 集成在 AI Core 内 |\n| Cube 单元 | 矩阵计算单元，一周期做 16×16×16 矩阵乘加 = 4096 次 MAC |\n| MTE | 搬运引擎，在 HBM 与片上缓冲（UB/L0）间搬数据，与计算重叠隐藏访存延迟 |\n| MAC | 乘加运算；1 MAC = 1 次乘法 + 1 次加法 = 2 次浮点运算 |\n| TFLOPS | 每秒万亿次浮点运算，衡量峰值算力 |\n| HBM | 高带宽内存：DRAM 堆叠并与芯片同封装，带宽远高于 GDDR |\n| 带宽 | 每秒可搬运的字节数（B/s），AI 推理的关键瓶颈之一 |\n| KV cache | 推理时缓存的键/值张量，避免对已生成 token 重复计算 |\n| GEMM | General Matrix Multiply，矩阵乘矩阵，大模型计算的主体 |\n| decode / prefill | 逐 token 生成（M 小、带宽受限）/ 一次性算完整个 prompt 的预填充（M 大、计算受限） |\n| CANN | Compute Architecture for Neural Networks，昇腾全栈软件，下集展开 |\n| AscendCL | Ascend Computing Language，CANN 的主机侧编程接口，下集展开 |\n| Atlas | 昇腾硬件产品品牌：模组 / 加速卡 / 服务器 / 集群 |\n| 910B / 910C | 昇腾芯片代号；910B 约 376 TFLOPS FP16 + 64 GB HBM，910C 双 die、官方未公开完整规格（存疑） |\n| 计算受限 / 带宽受限 | compute-bound / bandwidth-bound，耗时由算力或由数据搬运决定 |\n\n## 下一步\n\n明天（本模块下集）讲软件栈：CANN/驱动/固件层次关系（并画出与框架的层次关系图）、AscendCL、torch-npu 与性能工具（msprof）；之后第 8 课进入昇腾上的 vLLM：vllm-ascend 部署与调优。实践：在昇腾环境跑 `npu-smi info` 看 HBM 占用，再跑 vLLM 逐步加大 batch，观察吞吐是否先陡升后趋平。\n\n## 来源\n\n- [昇腾社区官网（hiascend.com）](https://www.hiascend.com/) — 官方文档\n- [CANN 社区版文档](https://www.hiascend.com/document/detail/zh/CANNCommunityEdition/900/index/index.html) — 官方文档\n- [Atlas 800I A2 推理服务器（华为企业业务）](https://e.huawei.com/cn/products/computing/ascend/atlas-800i-a2) — 官方文档\n- [Atlas 300I Duo 推理卡（华为企业业务）](https://e.huawei.com/cn/products/computing/ascend/atlas-300i-duo) — 官方文档\n- [Atlas 800T A2 训练服务器（华为企业业务）](https://e.huawei.com/cn/products/computing/ascend/atlas-800t-a2) — 官方文档\n- [Atlas 900 SuperCluster（华为企业业务）](https://e.huawei.com/cn/products/computing/ascend/atlas-900-supercluster) — 官方文档\n- [Atlas 200I A2 边缘模组（华为企业业务）](https://e.huawei.com/cn/products/computing/ascend/atlas-200i-a2) — 官方文档\n- [昇腾硬件：集群与超节点（昇腾社区）](https://www.hiascend.com/hardware/cluster) — 官方文档\n- [昇腾硬件架构与 SHMEM 约束（CANN 社区 shmem 项目参考）](https://atomgit.com/cann/shmem/blob/master/.agents/skills/shmem-ops-design/references/hardware-architecture.md) — 教程", "review_md": "# 审校记录 · 2026-11-03-ascend-arch\n\n- 日期：2026-11-03\n- 文件：课程/硬件/2026-11-03-ascend-arch.md\n- 模块：昇腾 NPU 架构与 CANN 生态（第 7 课）\n\n## verdict\n\nrevise\n\n## summary\n\n逐项重算 worked example：16×16×16=4096 次乘法 ✓；1×4096×4096=16,777,216 MAC、折 33.55 MFLOP（讲义写约 33.5）✓；376 TFLOPS 折 188×10¹² MAC/s，16,777,216÷188×10¹²≈89 ns ✓；32 MiB=33,554,432 字节，÷1.2×10¹²≈28 µs ✓；28 µs÷89 ns≈314 倍（讲义写约 300 倍，可接受）✓；batch=1024 时运算 17,179,869,184 MAC≈91 µs ✓，搬运 W 28 µs+x 7 µs=35 µs ✓；吞吐 3.6 万→约 1120 万 token/s（讲义写约 1100 万）✓；4096³/16³=1677 万块 ✓——数字全部正确，无 high 级概念/数学错误。教学结构九要素齐全（自测/为什么需要它/核心概念/worked example/误区/一句话总结/术语卡/下一步/来源）。模块目标覆盖 3/4：NPU-GPU 设计哲学 ✓、Cube 工作机制 ✓、Atlas 产品线 ✓；「CANN/驱动/固件层次关系」留待下集（设计如此）。存疑内容（核数、1.2 TB/s、910C 规格）基本都标注了「存疑」，处理得当。主要问题两条 medium：AI Core 定义混用初代 910 与 910B 两种核组织方式，自相矛盾；worked example 的 token/s 吞吐是「单层理想值」却以整卡吞吐口吻呈现，且归因「调度开销」不准。另有 6 条 low，建议修改后发布。\n\n## issues\n\n### 1. medium\n\n- **claim**：AI Core 定义与术语卡称其「内含 Cube/Vector/Scalar」，同节机制又说 910B 由 24 个带 Cube 的 AIC 与 48 个独立向量核 AIV 并列组成。\n- **problem**：两种描述自相矛盾：把 Cube/Vector/Scalar 集成在同一核内是初代 910 的组织方式；910B 上向量单元已独立为 AIV，并不内嵌在 AIC 里。基础弱的读者会搞不清 AIV 算不算 AI Core、Vector 单元到底在哪，而这是本模块目标 2 的核心内容。\n- **fix**：分开表述：初代 910 每个 AI Core 集成 Cube+Vector+Scalar；910B 将向量部分独立为 AIV（与 AIC 并列），并在术语卡「AI Core」条目注明这一区别（如『初代 910 形态；910B 上 Vector 独立为 AIV』）。\n\n### 2. medium\n\n- **claim**：第 5 步「理想吞吐从约 3.6 万 token/s 升到约 1100 万 token/s（理想上界，实际有调度开销）」。\n- **problem**：这两个数字只是『单层 GEMM』的理想吞吐：真实推理中一个 token 要依次经过模型全部几十层，还要算注意力等非 GEMM 算子，整卡真实 decode 吞吐比 1100 万低约 2–3 个数量级。初学者很可能把它当成整卡真实能力，且「调度开销」归因不准——主要差距来自层数与注意力等计算，不只是调度。\n- **fix**：明确标注『仅为这一层的理想上界』，并补一句量级对照：若模型有 80 个同规模层，batch=1 时每 token 约 2.2 ms（≈450 token/s），才是接近真实的整卡数量级。\n\n### 3. low\n\n- **claim**：「Unified Buffer（UB，每核约 192 KB 片上缓存）」「L0A/L0B/L0C（Cube 的操作数与累加缓存）」。\n- **problem**：UB/L0 是软件（算子/MTE）显式管理的片上 SRAM 缓冲，不是硬件自动换入换出的 cache；叫「缓存」会让初学者误以为搬进搬出是硬件自动完成的，与后文『MTE 搬运』的机制描述冲突。\n- **fix**：改称「片上 SRAM 缓冲，由算子通过 MTE 显式搬运管理」。\n\n### 4. low\n\n- **claim**：worked example 用「约 1.2 TB/s」推导 28 µs / 35 µs 等数字。\n- **problem**：该带宽前文已标「存疑」，但例子中未再提示；若真实带宽取 1.6 TB/s，搬运时间按比例缩为约 21 µs，「约 300 倍」变约 235 倍——结论不变，但学生照着别的资料核对时数字会漂。\n- **fix**：在例子开头补一句：带宽数值存疑，取不同值只会按比例缩放搬运时间，『带宽受限』的结论不变。\n\n### 5. low\n\n- **claim**：「达芬奇架构 2019 年随昇腾 910 发布」。\n- **problem**：时间线不准确：达芬奇架构最早随昇腾 310 于 2018 年发布，昇腾 910 也是 2018 年发布、2019 年才商用。\n- **fix**：改为「2018 年随昇腾 310/910 发布（910 于 2019 年商用）」。\n\n### 6. low\n\n- **claim**：模块目标第 3 条「能画出 CANN/驱动/固件与框架之间的层次关系」在本集完全未覆盖。\n- **problem**：属刻意留给下集（正文两处声明），但需确保下集真正落实，否则该模块目标落空。\n- **fix**：本集可不改；在下集安排「层次关系图」专节，并把这张图明确写进本集「下一步」作为下集产出。\n\n### 7. low\n\n- **claim**：术语卡未收录 GEMM、decode、prefill，以及正文出现过的 AIC/AIV、MTE。\n- **problem**：这些是 worked example 的核心词，正文虽有括注，但学生复习速查时术语卡上查不到。\n- **fix**：术语卡补 GEMM、decode、prefill 三条（AIC/AIV/MTE 可选）。\n\n### 8. low\n\n- **claim**：正文列「Atlas 800T A2：8×910B 训练整机」，来源列表却只给了 800T A3（910C）链接；Atlas 900 SuperCluster 也无对应来源。\n- **problem**：正文与来源未对齐，学生核对规格会点到不对应的产品页。\n- **fix**：补 Atlas 800T A2 官方链接（或删去该条），并为 Atlas 900 SuperCluster 补来源。\n", "term_count": 19, "source_count": 9, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-vllm-core", "date": "2026-11-03", "title": "第 6 课 · vLLM 引擎架构", "main_thread": "能画出 vLLM 从收请求到返回结果的主链路 · 能解释 prefix caching 为什么能省 prefill · 能说清调度器在权衡什么（延迟 vs 吞吐），读懂启动参数里的关键项", "domain": "推理框架", "module": "vLLM 引擎架构", "module_id": "vllm-core", "lesson_no": 6, "tags": ["vLLM", "KV cache", "prefix caching", "PagedAttention", "推理调度", "昇腾 NPU"], "markdown": "# 第 6 课 · vLLM 引擎架构\n\n> 学完今天，你能：\n> 1. 画出 vLLM 从收请求到返回结果的主链路\n> 2. 解释 prefix caching 为什么能省 prefill\n> 3. 说清调度器在权衡什么（延迟 vs 吞吐），读懂启动参数里的关键项\n\n## 课前自测\n1. 为什么 vLLM 要把 KV cache 切成 16 token 一块的「页」，而不是给每个请求整段预留？\n2. 100 个请求共享同一段 1000 token 的系统提示词，prefix caching 大约省掉多少次 prefill？\n3. 把 `--max-num-seqs` 调大，吞吐一定变高吗？\n\n## 为什么需要它\n先回顾 serving-basics：LLM 推理分两个阶段——prefill（预填充，一次性算完整个 prompt）和 decode（解码，每步生成一个 token）；延迟指单个请求的响应耗时，吞吐指单位时间处理的请求或 token 数。朴素做法「一个请求跑完再接下一个」有两个问题：一是显存浪费——为最长序列预留一整段连续 KV cache，大部分时间闲置；二是设备空转——decode 每步只算一个 token，计算量小，单请求占不满 NPU（神经网络处理器，昇腾的加速芯片）。vLLM 是业界主流开源推理引擎，用「页式内存池 + token 预算调度 + 前缀缓存」把一张卡塞进成百上千个并发请求。学完本课，你能画出主链路、手算 KV 显存账、读得懂启动参数。本课只讲架构地基，不追版本新闻。\n\n## 核心概念\n### vLLM V1\n定义：vLLM 当前默认的引擎架构，2025 年发布 alpha 版，官方现已废弃旧版 V0。V1 保留 V0 的模型实现与算子（矩阵乘等底层计算单元），重写了调度器、KV 缓存管理、worker 和 API 服务。\n直觉：老房子功能越堆越多、管道互相缠绕；V1 是拆掉内墙重排后的统一布局。\n机制：多进程架构——API Server 进程（HTTP 与分词）、Engine Core 进程（调度与 KV 管理）、每个 NPU 一个 Worker 进程（加载权重、执行前向计算），进程间用 ZMQ（跨进程消息队列）通信。\n\n### Engine Core（引擎核心）\n定义：运行调度器、管理 KV 缓存、协调设备 worker 执行模型计算的核心进程。\n直觉：餐厅前台经理——接单、排菜、通知后厨，全程不碰锅。\n机制：一个忙碌循环（busy loop），每个 step 调度一次、向 NPU worker 派发一次；请求的排队、运行、抢占、完成等状态都在这里维护。注意：采样不在这里做——它只汇总 worker 返回的采样结果并更新状态。\n\n### scheduler（调度器）\n定义：决定「这一步让哪些请求、算多少个 token」的组件。V1 采用 token 预算制：每步把 `--max-num-batched-tokens` 个 token 的预算，分配给等待中和运行中的请求。\n直觉：高速公路入口限量放行——每步只放总量不超预算的车。\n机制：没有严格的 prefill/decode 两个阶段（那是 V0 的设计）；每个请求记录「已算到第几个 token」，调度器给它补 token，长 prompt 因此被切块计算（chunked prefill）。当 KV 缓存不足时发生抢占（preemption）：按策略挑运行中的请求，释放它的 KV 块、踢回等待队列，重新准入时重算。默认策略 FCFS（First-Come-First-Served，先来先服务），也可用 `--scheduling-policy priority` 按请求优先级抢占。被抢占的请求重算 prefill 时，前缀缓存还可能帮它直接恢复一部分进度。这就是延迟与吞吐的权衡：一步塞得越多，吞吐越高，但单步耗时变长、单请求延迟上升，KV 也更紧张。\n\n### 内存池（KV cache / PagedAttention）\n先回顾：KV cache 是每层注意力算出的 K、V 向量缓存，decode 时靠它避免重算历史 token。\n定义：vLLM 把 KV 缓存切成固定大小的块（block，默认 16 token/块），像操作系统内存分页一样按需分配：逻辑上连续，物理上不必连续。\n直觉：整段预留像给每个旅行团包下一整层酒店，旺季必浪费；分页像散客按房间入住，退房即回收。\n机制：每个请求维护一张「块表」记录它的 KV 块编号；注意力 kernel 按块表寻址取数（PagedAttention，出自 vLLM 团队的 SOSP 2023 论文，SOSP 指操作系统领域顶级学术会议）。碎片几乎为零，是支持大量并发请求的地基；论文实测传统整段预留方案显存浪费可达 60%–80%，分页方案压到 4% 以下。\n\n### prefix caching（前缀缓存）\n定义：把算完的 KV 块按内容做哈希（把任意内容压成固定长度的指纹，便于快速比对）缓存；新请求的 prompt 与历史请求共享前缀时直接复用这些块，跳过那部分 prefill。\n直觉：两封邮件开头是同一段公司介绍——打字机时代要重打，电脑时代复制粘贴一次即可。\n机制：只缓存完整块；块的哈希 = 父块哈希 + 块内 token ID（多模态输入再拼图像哈希），默认 SHA-256（自 v0.10.2 起），碰撞概率可忽略。命中后只省 prefill 计算与 KV 内存，不省 decode。典型场景：反复查询同一长文档、多轮对话共享历史。\n\n### OpenAI 兼容 API\n定义：`vllm serve <模型>` 启动的 HTTP 服务，实现 OpenAI 的接口协议（`/v1/chat/completions`、`/v1/completions`、`/v1/models`）。\n直觉：标准化插座——上层应用把 base_url 指过来就能用，无需改调用代码。\n机制：API Server 进程用 FastAPI（Python Web 框架）实现，负责分词、把请求转成引擎内部格式，经 ZMQ 交给 Engine Core。\n\n## 一步一步理解\n主链路（建议画出来）：HTTP 请求 → API Server 分词 → ZMQ → Engine Core 调度 → NPU Worker 前向计算并采样（按概率分布从词表挑出下一个 token）出 1 个 token → Engine Core 汇总结果、更新调度状态 → API Server 流式返回。每生成一个 token 都回到调度器再走一轮，直到命中结束符或达到 max_tokens（最大生成长度）。\n\n手算例子（跟着算。模型取 Llama-2 7B：32 层、32 个 KV 头、每头 128 维、FP16 每个数 2 字节）：\n第 1 步：每个 token 每层 KV = 2（K、V 各一份）× 32 头 × 128 维 × 2 B = 16,384 B = 16 KB。\n第 2 步：每个 token 全模型 KV = 16 KB × 32 层 = 512 KB。\n第 3 步：一个 2048 token 的请求约占 512 KB × 2048 ≈ 1 GB。64 GB 显存的 NPU，减掉权重约 14 GB（7B × 2 B），最多同时装约 (64−14)÷1 = 50 个这样的请求——这就是内存池为何要精打细算。注意：这是忽略激活值等临时显存占用的粗算上界，实际并发数会更低，把 50 当量级、别当容量。\n第 4 步：prefix caching 的账。prefill 计算量估算公式 2·N·P（N 为参数数、P 为 prompt 长度，单位 FLOPs，即浮点运算次数）：2 × 7×10⁹ × 1000 ≈ 1.4×10¹³。对照：decode 每 token 约 2·N ≈ 1.4×10¹⁰，算一遍 1000 token 的 prefill 相当于 1000 次 decode 的算力。100 个请求共享同一段 1000 token 系统提示词时，不开缓存要算 100 次，开缓存只算 1 次，省 99 × 1.4×10¹³ ≈ 1.4×10¹⁵ FLOPs；按有效算力 100 TFLOPS 估算约省 14 秒纯计算（量级参考，不含访存等开销）。\n\n昇腾落地：装好 vllm-ascend 插件后，启动日志出现 `Platform plugin ascend is activated` 即已接管 NPU 后端；内网拉模型可设 `export VLLM_USE_MODELSCOPE=True`。示例启动命令：\n`vllm serve Qwen/Qwen3-8B --tensor-parallel-size 4 --max-model-len 8192 --max-num-batched-tokens 16384 --gpu-memory-utilization 0.9 --enable-prefix-caching`\n逐项读：`--tensor-parallel-size 4` 把权重切到 4 张 NPU；`--max-model-len 8192` 限制最长上下文（决定 KV 池上限）；`--max-num-batched-tokens 16384` 每步 token 预算；`--gpu-memory-utilization 0.9` 允许用 90% 显存（余下留给 KV 池）；`--enable-prefix-caching` 开前缀缓存（新版默认已开启，显式传入无妨；用 `--no-enable-prefix-caching` 可关闭）。CANN（Compute Architecture for Neural Networks，昇腾异构计算架构，下一课展开）与 TorchNPU（PyTorch 的昇腾后端）的依赖版本以所用 vllm-ascend 版本的官方文档为准，写作时稳定版 v0.23.0 对应 CANN 9.1.0。\n\n## 常见误区\n1. 「prefix caching 让生成也变快」。错：它只省 prefill 计算，decode 逐 token 生成不受影响。回答越长、共享前缀越短，收益越小。\n2. 「并发（max_num_seqs）越大吞吐越高」。错：并发超出 KV 容量后调度器频繁抢占，被抢占的请求释放缓存、重新排队、重新 prefill，产生重复计算；batch 越大单步越慢，延迟也恶化。吞吐和延迟必须一起看。\n3. 「V1 有独立的 prefill 队列和 decode 队列」。错：V0 把 prefill 和 decode 分阶段分批调度、互不混批；V1 统一 token 预算，长 prompt 切成块（chunked prefill），与 decode 同批执行。\n\n## 一句话总结\nvLLM 用页式 KV 内存池、token 预算调度和前缀缓存把设备算力与显存吃满，在延迟与吞吐之间做显式权衡，再以 OpenAI 兼容 API 对外服务。\n\n## 自测题\n### 1. 为什么 vLLM 要把 KV cache 切成 16 token 一块的「页」？\n<details><summary>查看答案<\/summary>整段预留按最长序列分配连续显存，大部分时间闲置，浪费可达 60%–80%；分页按需分配、逻辑连续物理不必连续，注意力 kernel 按块表寻址取数（PagedAttention），碎片几乎为零（4% 以下），是支撑大并发的地基。<\/details>\n\n### 2. 100 个请求共享同一段 1000 token 系统提示词，prefix caching 大约省掉多少次 prefill？\n<details><summary>查看答案<\/summary>约 99 次：第一个请求照常计算并把 KV 块写入缓存，其余 99 个命中同一前缀、直接复用 KV 块，跳过那 1000 token 的 prefill。注意只省 prefill 计算与 KV 内存，decode 逐 token 生成照常进行。<\/details>\n\n### 3. 把 `--max-num-seqs` 调大，吞吐一定变高吗？\n<details><summary>查看答案<\/summary>不一定。并发超出 KV 容量后调度器频繁抢占：被抢占请求释放 KV 块、重新排队、重新 prefill，产生重复计算；batch 变大单步耗时也变长，延迟恶化。吞吐必须和延迟一起看。<\/details>\n\n### 4. Llama-2 7B（32 层、32 个 KV 头、每头 128 维、FP16）一个 2048 token 的请求约占多少 KV 显存？\n<details><summary>查看答案<\/summary>每 token 每层 KV = 2×32×128×2 B = 16 KB；全模型 = 16 KB×32 层 = 512 KB/token；2048 token ≈ 1 GB。64 GB 卡减权重约 14 GB 后 (64−14)÷1 ≈ 50 个——这是忽略激活值等临时显存的粗算上界，实际并发更低。<\/details>\n\n### 5. 主链路里「采样出 1 个 token」发生在哪个进程？\n<details><summary>查看答案<\/summary>在 NPU Worker：V1 把 sampler 放进 model runner，随前向计算在设备端完成采样（按概率分布从词表挑下一个 token）。Engine Core 只接收采样结果、汇总并更新调度状态，自己不执行采样。<\/details>\n\n## 术语卡\n| 术语 | 解释 |\n| --- | --- |\n| prefill | 预填充：一次性计算整个 prompt，产生第一个新 token |\n| decode | 解码：每次用已有 KV cache 生成一个 token，直到结束符 |\n| KV cache | 每层注意力的 K、V 向量缓存，避免重复计算历史 token |\n| block | KV 缓存的最小分配单位（默认 16 token/块），类似内存分页 |\n| PagedAttention | vLLM 论文（SOSP 2023）提出的按块表寻址的注意力计算 |\n| chunked prefill | 把长 prompt 切成块分批 prefill，避免独占设备 |\n| token 预算 | 每步最多处理的 token 数（--max-num-batched-tokens） |\n| 抢占（preemption） | KV 不足时强制部分请求释放缓存、重新排队 |\n| FCFS | First-Come-First-Served，先来先服务，默认调度策略 |\n| prefix caching | 按内容哈希复用已算 KV 块，跳过共享前缀的 prefill |\n| 采样（sampling） | 按概率分布从词表挑出下一个 token，V1 中在 Worker 设备端完成 |\n| 哈希（hash） | 把任意内容压成固定长度指纹，便于快速比对 |\n| Engine Core | 运行调度器、管理 KV 缓存、协调 worker 的核心进程 |\n| vllm-ascend | 让 vLLM 运行在昇腾 NPU 上的官方社区插件 |\n\n## 下一步\n下一课「昇腾 NPU 架构与 CANN 生态」将展开本课反复提到的「NPU Worker」：达芬奇架构的计算单元、显存层级与 CANN 软件栈，看清 vLLM 的算子如何落到昇腾硬件上。\n\n## 来源\n1. vLLM Architecture Overview — https://docs.vllm.ai/en/latest/design/arch_overview/\n2. vLLM V1 用户指南 — https://docs.vllm.ai/en/latest/usage/v1_guide/\n3. Automatic Prefix Caching — https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/\n4. Efficient Memory Management for Large Language Model Serving with PagedAttention — https://arxiv.org/abs/2309.06180\n5. vLLM GitHub README — https://github.com/vllm-project/vllm\n6. vLLM Ascend Quickstart — https://docs.vllm.ai/projects/ascend/en/v0.23.0/quick_start.html", "review_md": "# 审校记录 · 2026-11-03-vllm-core\n\n## verdict\n\nrevise\n\n## summary\n\n概念与数学总体扎实：worked example 全部 4 步重算无误（16 KB/层、512 KB/token、2048 token≈1 GB、50 个请求、(64−14)÷1=50、2·N·P=1.4×10¹³、99×1.4×10¹³≈1.4×10¹⁵、100 TFLOPS≈14 秒）；版本事实经官方文档与仓库核对基本准确（V1 alpha 2025 年发布、V0 已完全废弃、vllm-ascend v0.23.0 对应 CANN 9.1.0、SHA-256 自 v0.10.2 起为默认哈希、API Server 负责分词均属实）；教学结构 8 要素齐全，4 条模块目标全覆盖。需改的地方：主链路把「采样」归给 Engine Core 有误（V1 中采样在 Worker 的 model runner 设备端完成，且这是模块目标 1 的主链路），另有多处未解释术语、个别估算缺关键限定、几处低风险细节可打磨。\n\n## issues\n\n### Issue 1\n\n- severity: high\n- claim: 主链路写「…→ NPU Worker 前向计算 → Engine Core 采样出 1 个 token → API Server 流式返回」，且核心概念里把 Engine Core 定义为「协调设备 worker 执行模型计算」、把前向计算归给 Worker\n- problem: V1 中采样（sampler）是在 Worker 进程的 model runner 里随前向计算在设备端完成的（vLLM V1 明确把 sampler 移入 model runner，官方文档只给 Worker 分配「执行前向计算」），Engine Core 接收采样结果并更新调度状态，自己不执行采样。主链路是模块目标之一，把采样归给 Engine Core 会让学生画错进程边界并固化成错误认知。\n- fix: 把主链路改为「HTTP 请求 → API Server 分词 → ZMQ → Engine Core 调度 → NPU Worker 前向计算并采样出 1 个 token → Engine Core 汇总结果、更新调度状态 → API Server 流式返回」，其余表述不变。\n\n### Issue 2\n\n- severity: medium\n- claim: 多处直接使用未解释的术语/缩写：采样、哈希（哈希缓存/哈希=父块哈希+token ID）、算子、SOSP、CANN、TorchNPU。\n- problem: 目标读者是基础较弱的工程师；「采样」出现在主链路、「哈希」是 prefix caching 机制的核心，不解释就跟不上；SOSP、CANN、TorchNPU 在昇腾落地段落裸用（CANN 下一课才展开）。\n- fix: 首次出现时各加一句括注：采样=按概率分布从词表挑出下一个 token；哈希=把任意内容压成固定长度指纹（便于快速比对）；算子=矩阵乘等底层计算单元；SOSP=操作系统领域顶会；CANN=昇腾异构计算架构（Compute Architecture for Neural Networks），下一课展开；TorchNPU=PyTorch 的昇腾后端。\n\n### Issue 3\n\n- severity: medium\n- claim: 第 3 步「64 GB 显存，减掉权重约 14 GB，最多同时装约 (64−14)÷1 = 50 个这样的请求」。\n- problem: 只扣了权重就除以单请求 KV，未扣激活值、工作区等临时显存。初学者会把这个数当成真实并发容量，实际能同时承载的请求数显著低于 50，「最多」二字挡不住误读。\n- fix: 在结果后补一句：「这是忽略激活值等临时显存占用的粗算上界，实际并发数会更低」，让学生把 50 理解为量级而非容量。\n\n### Issue 4\n\n- severity: low\n- claim: 课前自测只有 3 道题，没有答案。\n- problem: 自学者无法核对；Q2 的答案（99 次）藏在手算第 4 步，Q1、Q3 的答案分散在正文各处，自学闭环不完整。\n- fix: 文末加「自测答案」小节：Q1 页式按需分配、碎片接近零、支持大并发；Q2 约 99 次（第一次照算，其余命中缓存）；Q3 不一定——超出 KV 容量会频繁抢占、重复 prefill，吞吐与延迟要一起看。\n\n### Issue 5\n\n- severity: low\n- claim: 误区 3：「V1 有独立的 prefill 队列和 decode 队列。错：那是 V0 的设计」。\n- problem: V0 的队列是 waiting/running/swapped，并非字面上的 prefill/decode 两个队列；官方对比口径是 V1 的调度「不再严格分离 prefill 与 decode 阶段」。把「队列」说成 V0 事实会顺带教错一个 V0 细节。\n- fix: 改为：「V0 把 prefill 和 decode 分阶段分批调度、互不混批；V1 统一 token 预算，长 prompt 切成块（chunked prefill）与 decode 同批执行」。\n\n### Issue 6\n\n- severity: low\n- claim: 启动参数逐项读里写「--enable-prefix-caching 开前缀缓存」。\n- problem: 前缀缓存自 vLLM 0.11 起已默认开启（讲义自己锚定的 v0.23.0 同样默认开启），只字不提默认值，学生可能误以为不加这个参数就没有前缀缓存。\n- fix: 补一句：「新版默认已开启，显式传入无妨；用 --no-enable-prefix-caching 可关闭」。\n\n### Issue 7\n\n- severity: low\n- claim: prefix caching 机制写「默认 SHA-256 防碰撞」。\n- problem: 默认 SHA-256 属实（自 v0.10.2 起），但「防碰撞」略有绝对化——官方文档注明哈希结构并非 100% 无碰撞，SHA-256 只是把碰撞概率压到可忽略。\n- fix: 改为「默认 SHA-256（自 v0.10.2 起），碰撞概率可忽略」，不需要展开碰撞校验细节。\n", "term_count": 14, "source_count": 6, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-serving-basics", "date": "2026-11-03", "title": "第 5 课 · 推理服务基础：prefill/decode 与 KV cache", "main_thread": "说清一个请求在服务端经历的 prefill 和 decode 两个阶段 · 解释 KV cache 为什么让 decode 变快、代价是什么 · 解释 continuous batching 与 PagedAttention 解决什么问题，并区分 TTFT 与 TPOT", "domain": "推理框架", "module": "推理服务基础：prefill/decode 与 KV cache", "module_id": "serving-basics", "lesson_no": 5, "tags": ["推理服务", "KV cache", "PagedAttention", "性能指标", "vLLM", "昇腾"], "markdown": "# 第 5 课 · 推理服务基础：prefill/decode 与 KV cache\n\n> 学完今天，你能：\n> 1. 说清一个请求在服务端经历的 prefill 和 decode 两个阶段\n> 2. 解释 KV cache 为什么让 decode 变快、代价是什么\n> 3. 解释 continuous batching 与 PagedAttention 解决什么问题，并区分 TTFT 与 TPOT\n\n## 课前自测\n\n先回顾前置模块「Transformer 基础」的一句话：这类模型是自回归（autoregressive）生成——根据已生成的词元（token，文本切分后的最小单元），逐个预测下一个词元。带着它回答：\n\n1. 生成第 100 个 token 时，前 99 个 token 的中间结果能复用吗？靠什么？\n2. 服务端某一刻只有一个请求在跑，「批处理」就没有意义了吗？\n3. 为什么首 token 的时延通常远大于之后每个 token？背后是哪两个阶段？\n\n## 为什么需要它\n\nvLLM（开源的大语言模型推理服务框架）跑得快的秘密不在模型，而在管好推理的两个阶段和显存：KV cache、continuous batching、PagedAttention 是三块基石。对昇腾工程师，这直接对应 `--max-model-len`、`--gpu-memory-utilization` 调什么、`/metrics` 里 TTFT/TPOT/吞吐在说什么——不懂它们，调参只能靠猜。\n\n## 核心概念\n\n### prefill\n\n**定义**：把整个 prompt（用户输入的提示文本）一次性并行送入模型、产出首个新 token 的阶段（未启用 chunked prefill 时一次算完）。\n**直觉**：考试前先通读题目，才能开始答题。\n**机制**：prompt 的 n 个 token 拼成矩阵一次算完，每层注意力的 K（键）、V（值）全部存入 KV cache。这是「算力密集」阶段：吃满 NPU（昇腾 AI 处理器）矩阵单元，prompt 越长越久。\n**例子**：8 token 的 prompt 一次算完，产出第 9 个 token。\n\n### decode\n\n**定义**：逐 token 生成阶段：每步只算一个新 token，直到输出结束标记。\n**直觉**：成语接龙——每步只能接一个词，必须等上一步。\n**机制**：每步只为新 token 计算 Q、K、V（新 K/V 写入缓存），注意力中的历史 K/V 直接查 KV cache，真正新算的只有一个 token 的量。这是「访存密集」阶段：单步计算量小，但 200 token 要串行走 200 步，瓶颈是读 KV cache 的带宽而非算力。\n**例子**：生成 200 token = 200 次「接下一个词」。\n\n### KV cache\n\n**定义**：把每个历史 token 每层的 K、V 向量缓存在显存，避免每步重算历史。\n**直觉**：演草纸——中间结果记下来，下一步直接查。\n**机制**：注意力公式 softmax(QK^T/√d)·V（d 为每头维度）中，decode 时只有新 token 的 Q 是新的，历史 K/V 可完全复用；缓存与否数值结果一模一样，省的只是重复计算。代价是显存（量级见下文）。昇腾实践：共享长系统提示词时开 `--enable-prefix-caching`（相同前缀的 KV 块跨请求复用），省显存也省 prefill。\n**例子**：生成第 100 个 token 时，前 99 个的 K/V 直接查表、不重算。\n\n### continuous batching\n\n**定义**：在「迭代」（一批 token 提交给 NPU 计算的一轮）粒度批处理：新请求随时进批、完成的随时退批，不等整批结束。\n**直觉**：公交车随时上下客，而不是包车坐满才发车。\n**机制**：每轮迭代把正在 prefill 和 decode 的请求混在同一批提交 NPU，谁生成结束标记谁退出。它治的是静态批处理「短请求陪长请求等到底」的浪费；vLLM 还支持 chunked prefill（长 prompt 切块、与 decode 交错），避免一个长请求卡住整批。\n**例子**：短请求不必等长请求结束：随到随进批，出完即退批。\n\n### PagedAttention\n\n**定义**：把 KV cache 切成固定大小（默认 16 token）的块，从显存池按需分配，用一张「块表」记录每个请求用到哪些块。\n**直觉**：像操作系统的虚拟内存分页：散页拼起来用，不求连续整块。\n**机制**：各请求不再按最大长度连续预留显存，内部碎片被消除；并行采样（同一 prompt 生成多个结果）、束搜索（一次尝试多条候选路径、取概率最高者）时还能共享物理块。论文报告 KV cache 显存浪费从 60%–80% 降到 4% 以下。昇腾侧还有官方特性 KV Cache CPU Offload（KV 卸载到主机内存）。\n**例子**：300 token 的请求领 19 个 16-token 块，而非预留一段连续显存。\n\n### TTFT、TPOT 与吞吐\n\n**定义**：TTFT（Time To First Token）：请求到达服务端到首个输出 token 出现的时延；TPOT（Time Per Output Token）：其后每个输出 token 的平均时延；吞吐：单位时间产出的 token 数（或完成请求数）。\n**直觉**：TTFT 像第一道菜上桌时间，TPOT 像之后每道菜的间隔，吞吐像一天出菜量。\n**机制**：TTFT ≈ 排队时间 + prefill 时间——prefill 时间随 prompt 长度与可用算力变化，排队时间随系统负载变化；TPOT 主要由 decode 单步时长（同批请求数、KV 读取带宽）决定；吞吐 ≈ 同批请求数 ÷ 单步时长（同批都在 decode 时成立，混入 prefill 后只能当数量级估计）。三者互相拉扯，是调参的核心矛盾；`--max-num-seqs`（同批最大请求数）调的正是它。\n**例子**：聊天看重 TTFT，流式输出看重 TPOT，压测看重吞吐。\n\n## 一步一步理解\n\n拿 Llama-2-7B 算账：32 层、每层 32 头、每头 128 维，FP16（每数 2 字节）。请求：prompt 100 token、生成 200 token。\n\n**KV cache 占多少显存？** 每个 token 每层存 K、V 两组向量：2 × 32 头 × 128 维 × 2 字节 = 16 KB，乘 32 层 = 512 KB/token；300 token（100+200）≈ 150 MB。一个请求约 150 MB，几百个并发就能吃满 HBM（昇腾 910B 单卡 64 GB）。`--max-model-len`（单请求最长 prompt+输出）与 `--gpu-memory-utilization`（引擎允许占用的显存总比例；KV cache 实际分到的是扣除模型权重与激活后的剩余部分，调大它间接扩大 KV 池）正因此存在。\n\n**时延怎么拆？** 假设 prefill 100 token 耗时 300 ms，decode 每步 20 ms：\n\n- TTFT ≈ 300 ms（假设排队时间为 0：等 prefill 算完出首个 token）；\n- TPOT =（总时延 − TTFT）÷（200 − 1）≈ 20 ms，与单步 decode 一致；\n- 总时延 ≈ 300 + 20 × 200 = 4.3 s。\n\n**并发时吞吐怎么算？** 8 个请求同批 decode、每步 30 ms：每 30 ms 产出 8 个 token，吞吐 ≈ 8 ÷ 0.03 ≈ 267 token/秒，但每个人的 TPOT 恶化到 30 ms——并发拉高吞吐、也拉高每个人的 TPOT，调同批请求数必须接受这个交换。\n\n## 常见误区\n\n**误区 1：「KV cache 是缓存答案的缓存。」** 错。它只缓存中间向量 K/V，数值上与不缓存完全一致，省的是重复计算。\n\n**误区 2：「decode 慢是因为它每步都要把整个序列重新算一遍。」** 错。有 KV cache，decode 每步真正新算的只有一个 token；慢在串行——200 步必须一步一步出。\n\n**误区 3：「TTFT 慢说明 decode 慢。」** 错。TTFT 产生于 prefill 与排队：先查 prompt 是否过长、是否排队，而不是先查 decode。\n\n**误区 4：「TPOT 是固定值，优化它等于优化吞吐。」** 错。TPOT 是单个用户的体感时延，随并发变差；吞吐是系统整体产出，两者可同时上升，优化目标不同。\n\n## 一句话总结\n\n推理 = prefill 并行吃进 prompt，decode 串行吐出 token；KV cache 用显存换掉历史重算，continuous batching 与 PagedAttention 把算力和显存塞满；TTFT、TPOT、吞吐是三支温度计。\n\n## 自测题\n\n### 1. 一个请求 prompt 50 token、生成 100 token：为什么这 100 个输出必须 100 步串行算，不能像 prompt 那样一次并行算完？\n\n<details><summary>查看答案<\/summary>\n自回归有严格串行依赖：第 i+1 个 token 以「前 i 个 token」为条件，最后一个必须等第 i 步算完才知道，只能一步步出。KV cache 让每步不重算历史 K/V，但改变不了依赖链——这正是 TPOT 主要由单步 decode 时长决定的原因。<\/details>\n\n### 2. 「显存给得越多 KV cache 越好，把 `--gpu-memory-utilization` 调到 1.0 就够用」——错在哪？\n\n<details><summary>查看答案<\/summary>\n`--gpu-memory-utilization` 是引擎允许占用的显存总比例，权重、激活与 KV cache 都从这份配额里出，KV 池是扣除权重与激活后的剩余；调大它只是间接扩大 KV 池，调到 1.0 会挤占系统缓冲、有 OOM 风险。KV cache 也不是越大越有用：只有活跃请求用到它，更好的做法是 PagedAttention 按需分块，配合 `--max-model-len`、prefix caching 控制总量。<\/details>\n\n### 3. 请求 A（prompt 2000、输出 20）与 B（prompt 10、输出 1000）同时到达：静态批处理浪费了什么？continuous batching 如何改善？\n\n<details><summary>查看答案<\/summary>\n静态批处理整批同进同出：A 的 prefill 长，B 陪等；之后 B 的 decode 长，A 又陪等——快的陪慢的耗到底。continuous batching 迭代粒度随时进出：B 在 A 仍 prefill 时进批、生成完即退批；chunked prefill 把 A 的长 prompt 切块与 decode 交错，避免独占整批。<\/details>\n\n### 4. 同批最大请求数从 8 调到 64，TTFT、TPOT、吞吐分别怎么变？为什么？\n\n<details><summary>查看答案<\/summary>\n吞吐先升后平：同批 decode 请求越多，每步产出 token 越多，但 KV 带宽与算力打满后不再上升。TPOT 变差：每步要读的 KV 更多、单步更长。TTFT 也可能变差：新请求要等当前迭代结束才能进批，排队变长。这正是 `--max-num-seqs` 的权衡。<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| prefill | 一次性并行处理整个 prompt、产出首个 token 的阶段，算力密集 |\n| decode | 逐 token 生成的阶段，访存密集、必须串行 |\n| KV cache | 缓存每个 token 每层的 K/V 向量，用显存换掉对历史的重复计算 |\n| continuous batching | 迭代粒度随时进、退请求的批处理，解决静态批处理互相等待 |\n| PagedAttention | 把 KV cache 切成固定大小的块、按需分配的显存分页管理 |\n| TTFT | 首 token 时延，约等于排队时间加 prefill 时间 |\n| TPOT | 每个输出 token 的平均时延，主要由 decode 单步时长（并发）决定 |\n| 吞吐 | 单位时间产出的 token 数或完成请求数，随并发先升后平 |\n\n## 下一步\n\n第 6 课「vLLM 引擎架构」进入引擎内部：调度器、执行器与 KV cache 管理器如何把 prefill/decode 跑成流水线。\n\n## 来源\n\n- Architecture Overview（vLLM 官方文档）— https://docs.vllm.ai/en/latest/design/arch_overview/\n- PagedAttention 论文（arXiv:2309.06180，SOSP 2023）— https://arxiv.org/abs/2309.06180\n- LLM Inference Series（KV caching 章节，Hugging Face 博客）— https://huggingface.co/blog/llm-inference-series\n- vLLM Ascend 插件官方文档 — https://docs.vllm.ai/projects/ascend/en/latest/", "review_md": "# 审校记录 · 2026-11-03-serving-basics\n\n- **verdict**: revise\n- **summary**: 重算核验全部通过：2×32×128×2=16 KB/token·层 → ×32 层 = 512 KB/token → ×300 token ≈ 150 MB；TPOT = (4300−300)/199 ≈ 20.1 ms、总时延 4.3 s；8/0.03 ≈ 267 token/s，均正确。注意力公式、Llama-2-7B 配置（32 层/32 头/128 维）、PagedAttention 论文「60%–80% → <4%」、指标名 `vllm:time_to_first_token_seconds`/`vllm:time_per_output_token_seconds`、`--enable-prefix-caching`、`--max-num-seqs`、KV Cache CPU Offload 均属实。教学结构八要素齐全，四个模块目标全部覆盖，术语大多有即席解释。问题：1 处概念错误（--gpu-memory-utilization 被定义为「划给 KV 的显存比例」，实为引擎可占用的显存总比例）；3 处中等问题（TTFT 决定因素的「×」写法、decode「只算 Q」、\"几十个并发吃满 HBM\"与本课数字差一个数量级）；4 处初学者友好性可改进项。\n\n## issues\n\n### 1. high\n\n- **claim**: `--gpu-memory-utilization`（划给 KV 的显存比例）\n- **problem**: 概念错误。vLLM 的 --gpu-memory-utilization 是引擎允许占用的显存总比例，模型权重、激活与 KV cache 都从这份配额里出，不是「划给 KV 的比例」；KV cache 实际能用的显存是总配额减去权重与激活后的剩余部分。文中两处（「为什么需要它」和「一步一步理解」）都按错误定义解释，会直接误导昇腾工程师调参。\n- **fix**: 改为「引擎允许占用的显存总比例；KV cache 实际分到的是扣除模型权重与激活后的剩余部分，调大它间接扩大了 KV 池」。\n\n### 2. medium\n\n- **claim**: TTFT 主要由 prefill 时长（prompt 长度 × 排队）决定\n- **problem**: 「×」会被初学者读成乘法，而 prompt 长度与排队时间不是相乘关系；且 TTFT = 排队时间 + prefill 时间，负载高时排队可能占大头，「主要由 prefill 时长决定」过于绝对。\n- **fix**: 改为「TTFT ≈ 排队时间 + prefill 时间：prefill 时间随 prompt 长度与可用算力变化，排队时间随系统负载变化」。\n\n### 3. medium\n\n- **claim**: 每步只计算新 token 的 Q（查询）向量，与 KV cache 里的历史 K/V 做注意力\n- **problem**: 不准确：decode 每步也要为新 token 计算 K、V 并追加进 KV cache（否则后续步骤无从复用），只有历史 token 的 K/V 是查缓存复用的。基础弱的读者会误以为 decode 阶段完全不产生 K/V。\n- **fix**: 改为「每步只为新 token 计算 Q、K、V（新 K/V 写入缓存），注意力中历史 K/V 全部直接查 KV cache，真正新算的只有一个 token 的量」。\n\n### 4. medium\n\n- **claim**: 一个请求 150 MB，几十个并发就吃满 HBM\n- **problem**: 与本课自己的数字矛盾：几十个（如 50 个）并发 × 150 MB ≈ 7.5 GB，远小于昇腾 910B 的 64 GB HBM；按 150 MB/请求要约 400 个并发才吃满，差了一个数量级。\n- **fix**: 改为「几百个并发就能吃满 HBM」，或限定为「在 gpu-memory-utilization 划出的余量内，几十个并发已占掉相当比例」。\n\n### 5. low\n\n- **claim**: prefill 定义「把整个 prompt……一次性送入模型并行计算」，后文又说「vLLM 还支持 chunked prefill（把长 prompt 切块）」\n- **problem**: 前后看起来矛盾：初学者刚记住「一次性」，马上又看到「切块」，会困惑哪个才对。\n- **fix**: 在 prefill 定义处补一句「（未启用 chunked prefill 时是整个 prompt 一次算完；chunked prefill 是后文介绍的工程优化）」。\n\n### 6. low\n\n- **claim**: 吞吐 ≈ 同批请求数 ÷ 单步时长\n- **problem**: 该式只在同批请求全部处于 decode 时成立；continuous batching 恰恰是 prefill/decode 混批，混入 prefill 后单步时长与每步产出 token 数都会变化，公式只是粗近似，缺限定会误导手算。\n- **fix**: 加限定：「（同批都在 decode 时成立；混入 prefill 后只能当数量级估计）」。\n\n### 7. low\n\n- **claim**: 假设 prefill 100 token 耗时 300 ms，decode 每步 20 ms：TTFT = 300 ms\n- **problem**: 概念段刚说 TTFT 含排队时间，算例直接把 TTFT 等于 prefill 时长且未声明「假设无排队」，前后不一致，初学者会追问差在哪。\n- **fix**: 写成「TTFT ≈ 300 ms（假设排队时间为 0）」。\n\n### 8. low\n\n- **claim**: 「并行采样、束搜索时还能共享物理块」；「在『迭代』粒度上批处理」\n- **problem**: 「束搜索」「并行采样」「迭代」均未解释即使用，基础弱的读者会卡住。\n- **fix**: 首次出现时加注：束搜索＝一次尝试多条候选路径取概率最高者；并行采样＝同一 prompt 生成多个结果；迭代＝把一批 token 提交给 NPU 计算的一轮。\n", "term_count": 8, "source_count": 4, "briefs": {}, "coverage": {}, "generated": "2026-11-03"}, {"id": "2026-11-03-transformer-foundation-2", "date": "2026-11-03", "title": "第 4 课 · Transformer 与 decoder-only 范式（下）", "main_thread": "能解释 attention 在做什么（对比 RNN），写出缩放点积注意力公式并说明每一项 · 能说清 RoPE/RMSNorm/SwiGLU/GQA 各自解决什么问题 · 能理解主流为何收敛到 decoder-only，并会估算 KV cache 大小", "domain": "模型演进", "module": "Transformer 与 decoder-only 范式", "module_id": "transformer-foundation", "lesson_no": 4, "tags": ["transformer", "decoder-only", "RoPE", "GQA", "KV cache", "LLM 架构"], "markdown": "# 第 4 课 · Transformer 与 decoder-only 范式（下）\n\n> 学完今天，你能：\n> 1. 解释 attention 在做什么（对比 RNN），写出缩放点积注意力公式并说明每一项\n> 2. 说清 RoPE / RMSNorm / SwiGLU / GQA 各自解决什么问题\n> 3. 理解主流为何收敛到 decoder-only，并会估算 KV cache 大小\n\n## 课前自测\n\n1. 默写缩放点积注意力公式，并说明分母 √d 的作用。\n2. token 的顺序信息（「A 打 B」≠「B 打 A」）要怎样进入模型？说一种你知道的办法。\n3. 生成第 100 个 token 时，前 99 步算出的 K、V 不缓存会怎样？缓存大概多大？\n4. GQA 的 g 取 1、取 n_heads 时各是什么？它为什么能省显存？\n\n## 为什么需要它\n\n上集搭好了注意力骨架（Q/K/V、softmax 缩放、多头、残差），但要高效、稳定、低成本地训出并部署 LLM（大语言模型），还差四块：位置信息、深层训练稳定、前馈表达、KV 缓存成本。RoPE、RMSNorm、SwiGLU、GQA 各补一块，最后讨论「主流为何收敛到 decoder-only」。注意：这四项是效率/稳定性/质量改进，不是硬性前提——GPT-2/GPT-3 用学习式位置编码 + LayerNorm + GELU 同样训出了可用模型。\n\n对比 RNN 看 attention 在做什么：RNN 靠隐藏状态逐步传递，长距离易衰减、只能串行；attention 用 Q·K 直接算任意两位置的关联，路径短、可并行。Q 是「我想找什么」、K 是「我有什么」、V 是「实际取值」，点积大即相关，softmax 后按权重从 V 取值。你在昇腾 NPU（华为 AI 加速芯片）上跑的每个 vLLM（开源大模型推理引擎）服务，内部就是这些组件。\n\n## 核心概念\n\n### RoPE（旋转位置编码）\n定义：按 token 位置 m，把每头 Q、K 的相邻两维 (x₂ᵢ, x₂ᵢ₊₁) 当平面坐标旋转 m·θᵢ，θᵢ=10000^(−2i/d)（i 为维度对编号，d 为头维度）：x′₂ᵢ=x₂ᵢcos(mθᵢ)−x₂ᵢ₊₁sin(mθᵢ)；x′₂ᵢ₊₁=x₂ᵢsin(mθᵢ)+x₂ᵢ₊₁cos(mθᵢ)。\n直觉：不往 embedding（token 映射成的连续向量）里「加」位置，而是让 Q、K 随位置「转」一个角度——长度不变（内容不变），方向变。\n机制：把旋转前每对 (x₂ᵢ, x₂ᵢ₊₁) 写成极坐标 (r, α)（幅长、幅角），旋转后 q_m·k_n=Σᵢ r_q·r_k·cos(αᵢ+(m−n)θᵢ)，只依赖相对位置 m−n，绝对位置被消掉：「第 2 词看第 1 词」与「第 100 词看第 99 词」用同一套角度关系，也有利于长度外推。相比往 embedding 上加正弦值的绝对编码，RoPE 让分数显式携带相对距离。例子：下文 worked example 中 q₂ 转 90° 后与 k₀ 夹角 90°、点积为 0。\n\n### RMSNorm（均方根归一化）\n定义：LayerNorm（层归一化）是减均值、除标准差，再乘 γ 加 β。RMSNorm 只留后半：除 RMS(x)=√(mean(x²)+ε) 再乘 γ，不减均值、无 β；y=x/RMS(x)·γ（逐元素，ε 是防除零小常数）。\n直觉：训练不稳定主要来自「尺度失控」；把每个向量尺度压回 1（二阶矩）就解决大半，「减均值」（一阶矩）贡献小，可省。\n机制：少一次均值统计与减法、参数减半（无 β），更快、更省显存，稳定性与 LayerNorm 相当，LLaMA 全系都用它。例子：t0=[2,2,2,2] 的 RMS 是 2，归一后变 [1,1,1,1]。\n\n### SwiGLU（Swish 门控前馈）\n定义：传统 FFN（前馈网络）是 x→W₂·max(0, W₁x)。SwiGLU 用两个并行投影加逐元素乘 ⊙：SwiGLU(x)=(Swish(x·W_gate)⊙(x·W_up))·W_down，Swish(z)=z·σ(z)，σ 是 sigmoid（把实数压到 0~1 的 S 形函数），整体是 GLU（门控线性单元）的一种。\n直觉：「up 路」给候选值，「gate 路」给 0~1 软开关，决定每个候选通过多少；ReLU 是「负数直接掐掉」的硬开关，Swish 平滑。\n机制：负值不再硬置 0，保留小梯度、表达更强；代价是多一个权重矩阵（共 3 个），LLaMA 1/2 把中间维度从 4d 缩到约 8/3·d（取整到 256 的倍数），参数量与 ReLU 版持平（Llama 3 系比例不同）。例子：gate=[1,2] 经 Swish 变 ≈[0.73, 1.76]。\n\n### GQA（分组查询注意力）\n定义：MHA（多头注意力）每头各一套 K、V。GQA 把 n_heads 个 Q 头分成 g 组，每组共享一套 K、V：g=n_heads 即 MHA，g=1 即 MQA（全部共享）。LLaMA2-70B：64 个 Q 头、8 套 KV。\n直觉：书（K/V）只放 g 个书架，每个读者（Q 头）在本组书架里找；组数不太少时找书质量几乎不受影响（g=1 的 MQA 有可见损失），书的总量却从 64 套减到 8 套。\n机制：decode（逐个生成 token）阶段每步都读整个 KV cache（缓存的历史 K/V，免重算），且访存受限（卡在内存带宽而非算力）。KV cache 大小≈2×层数×n_kv_heads×head_dim×序列长×字节数×batch：2 是 K、V 各一份；head_dim 是每头维度；字节数是每元素字节数（fp16/bf16=2、fp32=4）；batch 是同时服务的请求数。例：64 层×8 套 KV×头维 128×序列 1024×2 字节×batch 1≈256MB。GQA 把 n_kv_heads 降到 g，省下的显存可换更大 batch。落到昇腾：vLLM 里组数写在模型配置 num_key_value_heads，由权重决定、不能运行时改；规划 NPU 内存与 batch 时按它而非 n_heads 估算。\n\n### decoder-only\n定义：只用 Transformer 的解码器堆叠：每层「因果注意力+FFN」，位置 i 只能看 ≤i（因果掩码），逐 token 自回归（把已生成输出当作下一步输入）预测下一个词。对比：encoder-decoder（如 T5）另有双向 encoder；encoder-only（如 BERT）只双向理解、不生成。\n直觉：语言建模就是「根据上文猜下一个词」，恰好就是因果结构本身；encoder 的「看全文」对生成没有直接收益，砍掉还省参数。\n机制：一个统一目标（next-token 预测）训练整张网，算力全服务生成；因果注意力与 KV cache 天然契合（每步只追加一个新 token 的 K/V）。GPT、LLaMA 用越来越大的规模证明这条路有效。注意：这是经验收敛而非理论必然，encoder 在理解类任务仍有用。例子：输入「今天天气」，模型按因果序先猜「很」再猜「好」。\n\n## 一步一步理解\n\n玩具模型：3 个 token（位置 0/1/2），d_model=4，2 个头（head_dim=2，每头 1 个旋转对），θ=π/4，d_ff=2（FFN 中间宽度）。为手算方便取 γ=1、W_Q=W_K=W_V=单位阵 I。输入 X（每行一个 token）：t0:[2,2,2,2]；t1:[0,2,2,0]；t2:[0,0,2,2]。\n\n① RMSNorm（γ=1）：t0:√(16/4)=2→[1,1,1,1]；t1:√(8/4)=√2→[0,√2,√2,0]；t2 同 t1→[0,0,√2,√2]。记作 X̂。\n② QKV：q=k=v=X̂；头 1 取维度 (0,1)，头 2 取 (2,3)。\n③ RoPE（只旋转 Q、K；v 保持 X̂ 不旋转）：θ=π/4，位置 0/1/2 转 0°/45°/90°。头 2 的 k：k₀=[1,1]；k₁=R(45°)[√2,0]=[1,1]；k₂=R(90°)[√2,√2]=[−√2,√2]（q 同 k；v 不旋转：v₀=[1,1]、v₁=[√2,0]、v₂=[√2,√2]）。\n④ 注意力（头 2 的 token 2，缩放 1/√2，因果掩码只看 ≤2）：s₀=q₂·k₀/√2=0；s₁=0；s₂=q₂·k₂/√2=4/√2≈2.83。softmax（把分数变成非负、和为 1 的权重）：e⁰=1、e⁰=1、e^2.83≈16.9 → 权重≈[0.05,0.05,0.89]（精确 0.053/0.053/0.894，用它算）：o₂=0.053·[1,1]+0.053·[√2,0]+0.894·[√2,√2]≈[1.39,1.32]。几何解释：q₂ 方向 135°（45° 再转 90°），与 k₀、k₁（45° 方向）夹角 90°→点积 0；与自己同向→点积 |q₂||k₂|=4。位置只以「角度差」进入分数——这就是 RoPE。其余行同法，注意力输出 O（每行=头1‖头2）：\n\n| token | 头 1 | 头 2 |\n| --- | --- | --- |\n| t0 | [1,1] | [1,1] |\n| t1 | [0.20,1.33] | [1.21,0.50] |\n| t2 | [0.33,0.80] | [1.39,1.32] |\n\n⑤ 残差（y=x+f(x)，梯度直通）再二次 RMSNorm：A=X̂+O：t0:[2,2,2,2]；t1:[0.20,2.74,2.62,0.50]；t2:[0.33,0.80,2.81,2.73]；再归一（γ=1）：t0→[1,1,1,1]；t1≈[0.10,1.43,1.37,0.26]；t2≈[0.16,0.40,1.40,1.36]。\n⑥ SwiGLU（t0 的 x=[1,1,1,1]）：W_gate 两列=[1,0,0,0]ᵀ、[0,0,0,2]ᵀ → gate=[1,2]，Swish(1)≈0.73、Swish(2)≈1.76；W_up 两列=[2,0,0,0]ᵀ、[0,0,0,1]ᵀ → up=[2,1]；门控相乘 y=[0.73×2, 1.76×1]=[1.46,1.76]；W_down 两行=[1,0,0,0]、[0,0,1,0] → FFN 输出=1.46·[1,0,0,0]+1.76·[0,0,1,0]=[1.46,0,1.76,0]。\n⑦ 二次残差：t0 最终输出=[1,1,1,1]+[1.46,0,1.76,0]=[2.46,1,2.76,1]。这就是一层 decoder 的完整数据流：RMSNorm→因果注意力(+RoPE)→残差→RMSNorm→SwiGLU→残差；输出送下一层，最后一层后接输出头映射到词表。\n\n## 常见误区\n\n1. 「RoPE 和正弦位置编码一样，只是往 embedding 上加随位置变化的数。」错。RoPE 不改 embedding，而是把 Q、K 旋转 mθ 角；它编码相对位置——q_m·k_n 只依赖 m−n。\n2. 「GQA 把 8 个头合并成 1 个，输出变少。」错。Q 头数不变，输出仍是 n_heads 个头拼接；共享的只是 K/V 投影与缓存，改变的是内存与带宽成本。\n3. 「RMSNorm 就是 LayerNorm 删掉 β。」不准确。它还删了「减均值」：只压尺度、不中心化到零均值，参数更少、更快，但数学上是不同运算。\n\n## 一句话总结\n\n现代 decoder-only LLM = 因果注意力（QKV·缩放·多头）+ RoPE 相对位置 + RMSNorm/SwiGLU 高效稳定组件 + GQA 省 KV 缓存，一环扣一环解决「位置、稳定、质量、成本」四个问题。\n\n## 自测题\n\n### 1. 默写缩放点积注意力公式，并说明分母 √d 的作用\n\n<details><summary>查看答案<\/summary>\n\nAttention(Q,K,V)=softmax(QKᵀ/√d)V。逐项：Q 查询（我想找什么）、K 键（我有什么），QKᵀ 逐对算相关性；d 是 Q、K 的维度，维度越大内积越大，÷√d 防止 softmax 饱和（权重被最大项垄断）；softmax 把分数变成非负、和为 1 的权重；再加权求和 V（值）。对比 RNN：RNN 靠隐藏状态逐步传递、长距离易衰减、只能串行；attention 用 Q·K 直接算任意两位置关联，路径短、可并行。\n\n<\/details>\n\n### 2. token 的顺序信息（「A 打 B」≠「B 打 A」）要怎样进入模型？\n\n<details><summary>查看答案<\/summary>\n\n三种办法：a) 绝对位置编码——把随位置变化的正弦值或可学习向量加到 embedding；b) 学习式位置向量（GPT-2/GPT-3 用）；c) 本课的 RoPE——不「加」，而是按位置把 Q、K 旋转 mθ 角。旋转后 q_m·k_n=Σᵢ r_q·r_k·cos(αᵢ+(m−n)θᵢ)，只依赖相对位置 m−n：绝对位置被消掉，也有利于长度外推。\n\n<\/details>\n\n### 3. 生成第 100 个 token 时，前 99 步的 K、V 不缓存会怎样？缓存多大？\n\n<details><summary>查看答案<\/summary>\n\n不缓存则每步从头重算全部历史 K、V，计算量随序列长平方增长。KV cache≈2×层数×n_kv_heads×head_dim×序列长×字节数×batch：2 是 K、V 各一份；head_dim 是每头维度；字节数按 dtype（fp16/bf16=2、fp32=4）；batch 是同时服务的请求数。例：64 层×8 套 KV×头维 128×序列 1024×2 字节×batch 1≈256MB。序列变长、batch 变大时线性增长，是显存规划的关键量。\n\n<\/details>\n\n### 4. GQA 的 g=1 与 g=n_heads 各是什么？它为什么能省显存？\n\n<details><summary>查看答案<\/summary>\n\ng=n_heads 是标准 MHA（每头一套 K/V）；g=1 是 MQA（全部共享一套），GQA 取中间（LLaMA2-70B：64 个 Q 头、8 套 KV）。decode 每步读整个 KV cache 且访存受限，cache 正比于 n_kv_heads；分组共享把显存省到 n_heads/g 分之一，可换更大 batch。代价：组数不太少时质量几乎不受影响，g=1 的 MQA 有可见损失。vLLM 中组数写死在配置 num_key_value_heads，运行时不能改。\n\n<\/details>\n\n## 术语卡\n\n| 术语 | 解释 |\n| --- | --- |\n| Q/K/V | 查询/键/值：Q·K 算相关性，softmax 后加权求和 V |\n| 缩放点积注意力 | softmax(QKᵀ/√d)V；÷√d 防内积过大、权重被最大项垄断 |\n| 多头注意力 | d_model 切 h 份并行算注意力再拼接，不同子空间学不同关系 |\n| 残差连接 | y=x+f(x)：子层输出加回输入，梯度直通 |\n| RoPE | 按位置把 Q/K 旋转 mθ 角，分数只依赖相对位置 |\n| RMSNorm | 只除 RMS(x) 再乘 γ，不中心化，替代 LayerNorm |\n| SwiGLU | Swish(z)=z·σ(z) 作门控的 GLU 前馈，替代 ReLU 的平滑非线性 |\n| GQA | 多个 Q 头分组合享 K/V，KV cache 缩小 n_heads/g 倍 |\n| KV cache | 缓存历史 K/V 免重算；大小估算与符号说明见 GQA 节 |\n| decoder-only | 只用带因果掩码的解码器堆叠，逐 token 自回归预测下一个词 |\n\n## 下一步\n\n下节课「推理服务基础：prefill/decode 与 KV cache」展开：prefill（一次性处理输入提示）与 decode 为什么一个算力受限、一个访存受限，vLLM 的 PagedAttention（按页管理 KV cache）怎么省碎片，以及这些如何映射到昇腾 NPU 上的 vLLM 参数。\n\n## 来源\n\n- 《Attention Is All You Need》 — https://arxiv.org/abs/1706.03762\n- 《RoFormer: Enhanced Transformer with Rotary Position Embedding》 — https://arxiv.org/abs/2104.09864\n- 《Root Mean Square Layer Normalization》 — https://arxiv.org/abs/1910.07467\n- 《GLU Variants Improve Transformer》 — https://arxiv.org/abs/2002.05202\n- 《GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints》 — https://arxiv.org/abs/2305.13245\n- 《LLaMA: Open and Efficient Foundation Language Models》 — https
