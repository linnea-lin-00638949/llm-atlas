<script>
(function(){
  const $ = s => document.querySelector(s);
  const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
  const state = { lid: DATA.days[0] ? DATA.days[0].id : null, date: DATA.days[0] ? DATA.days[0].date : null, tab: 'note', view: 'day', q: '', rid: 0, nid: 0, tid: 0, sid: 0 };
  try{
    const qp = new URLSearchParams(location.search);
    if(qp.get('view') === 'map') state.view = 'map';
    if(qp.get('lesson')){ const hit = DATA.days.find(d => d.id === qp.get('lesson')); if(hit){ state.lid = hit.id; state.date = hit.date; } }
    else if(qp.get('date')){ const hit = DATA.days.find(d => d.date === qp.get('date')); if(hit){ state.lid = hit.id; state.date = hit.date; } }
  }catch(e){}

  const domainById = {};
  DATA.domains.forEach(d => domainById[d.id] = d);

  function fmtDate(d){
    const [y,m,day] = d.split('-');
    return { y, m, day, short: m + '.' + day, long: y + ' 年 ' + Number(m) + ' 月 ' + Number(day) + ' 日' };
  }
  function weekday(d){
    const w = new Date(d + 'T12:00:00').getDay();
    return ['周日','周一','周二','周三','周四','周五','周六'][w];
  }
  function toast(msg){
    const t=$('#toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800);
  }

  /* ---------- markdown ---------- */
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    const codes=[];
    s = s.replace(/`([^`]+)`/g, (_,c)=>{ codes.push(esc(c)); return '\u0002IC'+(codes.length-1)+'\u0002'; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\u0002IC(\d+)\u0002/g, (_,n)=>'<code>'+codes[+n]+'</code>');
    return s;
  }
  function md2html(md){
    if(!md) return '';
    const codes=[];
    md = md.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_,lang,code)=>{
      codes.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>');
      return '\u0000CODE'+(codes.length-1)+'\u0000';
    });
    const tags=[];
    md = md.replace(/<\/?(details|summary)(\s[^>]*)?>/g, m=>{
      tags.push(m); return '\u0000TAG'+(tags.length-1)+'\u0000';
    });
    const lines = md.split('\n');
    const out=[];
    let i=0;
    const isBlock = l => /^(#{1,4}\s|>\s?|\s*[-*]\s+|\s*\d+\.\s+|\||---+\s*$)/.test(l) || /^\u0000TAG/.test(l) || /^\u0000CODE/.test(l);
    while(i < lines.length){
      let line = lines[i];
      if(!line.trim()){ i++; continue; }
      let m;
      if(m = line.match(/^(#{1,4})\s+(.*)$/)){
        const lv=m[1].length; out.push('<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'); i++; continue;
      }
      if(/^\s*---+\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
      if(/^\u0000TAG/.test(line)){ out.push(line); i++; continue; }
      if(/^\u0000CODE/.test(line)){ out.push(line); i++; continue; }
      if(/^\|/.test(line)){
        const rows=[];
        while(i<lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
        if(rows.length>=2 && /^\|?[\s:|-]+\|?$/.test(rows[1])){
          const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
          let html='<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
          for(let r=2;r<rows.length;r++){ html+='<tr>'+cells(rows[r]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; }
          out.push(html+'</tbody></table>');
        } else { out.push('<p>'+inline(rows.join(' '))+'</p>'); }
        continue;
      }
      if(/^\s*[-*]\s+/.test(line)){
        const items=[];
        while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
        out.push('<ul>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>'); continue;
      }
      if(/^\s*\d+\.\s+/.test(line)){
        const items=[];
        while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++; }
        out.push('<ol>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>'); continue;
      }
      if(/^>\s?/.test(line)){
        const q=[];
        while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote><p>'+q.map(inline).join('<br>')+'</p></blockquote>'); continue;
      }
      const para=[line]; i++;
      while(i<lines.length && lines[i].trim() && !isBlock(lines[i])){ para.push(lines[i]); i++; }
      out.push('<p>'+para.map(inline).join('<br>')+'</p>');
    }
    let html = out.join('\n');
    html = html.replace(/\u0000CODE(\d+)\u0000/g, (_,n)=>codes[+n]);
    html = html.replace(/\u0000TAG(\d+)\u0000/g, (_,n)=>tags[+n]);
    return html;
  }

  /* ---------- sidebar ---------- */
  function renderStats(){
    const st = DATA.stats || {lessons:0,modules:0,terms:0};
    $('#stats').innerHTML = [
      [st.lessons,'课程'],[st.modules,'已学模块'],[st.terms,'术语']
    ].map(([n,l])=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>').join('');
    $('#day-count').textContent = DATA.days.length ? DATA.days.length + ' 课' : '';
  }
  function renderDays(){
    const list=$('#day-list'); list.innerHTML='';
    const q=state.q.toLowerCase();
    const days=DATA.days.filter(d=>!q || (d.date+' '+d.title+' '+d.main_thread+' '+d.tags.join(' ')+' '+d.markdown).toLowerCase().includes(q));
    if(!days.length){ list.innerHTML='<div style="padding:12px 10px;font-size:12px;color:var(--faint)">没有匹配的课程</div>'; return; }
    days.forEach(d=>{
      const n=el('div','day-item'+(state.view==='day'&&d.id===state.lid?' active':''));
      n.innerHTML='<div class="day-date">'+fmtDate(d.date).short+'</div><div class="day-title">'+esc(d.title)+'</div>';
      n.onclick=()=>{ state.view='day'; state.lid=d.id; state.date=d.date; state.tab='note'; render(); closeSidebar(); };
      list.appendChild(n);
    });
  }
  function renderProgress(){
    const box=$('#progress'); box.innerHTML='';
    DATA.domains.forEach(d=>{
      const c=DATA.coverage[d.id]||{learned_modules:[]};
      const pct=Math.round(c.learned_modules.length/d.curriculum.length*100);
      const n=el('div','prog');
      n.innerHTML='<div class="prog-head"><b>'+d.emoji+' '+d.name+'</b><span>'+c.learned_modules.length+'/'+d.curriculum.length+'</span></div>'+
        '<div class="bar"><i style="--c:'+d.color+';width:'+pct+'%"></i></div>';
      box.appendChild(n);
    });
  }

  /* ---------- views ---------- */
  function hero(day){
    const f=fmtDate(day.date);
    const h=el('div','hero');
    const dom = (DATA.domains||[]).find(d=>d.folder===day.domain);
    h.innerHTML='<div class="eyebrow"><span>'+f.y+'.'+f.m+'.'+f.day+'</span><span>'+weekday(day.date)+'</span>'+
      (dom?'<span>'+(dom.emoji||'')+' '+esc(dom.name)+'</span>':'')+
      (day.module?'<span>'+esc(day.module)+'</span>':'')+
      '<span class="pill">COURSE'+(day.lesson_no?' · 第'+day.lesson_no+'课':'')+'</span></div>'+
      '<h2>'+esc(day.title)+'</h2>'+
      '<p class="thread">'+esc(day.main_thread)+'</p>'+
      '<div class="tags">'+day.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>';
    return h;
  }
  function tabs(day){
    const box=el('div','tabs');
    const items=[['note','课程笔记','◈']];
    if(day.review_md) items.push(['review','审校记录','✓']);
    items.forEach(([id,label,em])=>{
      const b=el('button','tab'+(state.tab===id?' active':''));
      b.innerHTML='<span class="em">'+em+'</span>'+esc(label);
      b.onclick=()=>{ state.tab=id; render(); };
      box.appendChild(b);
    });
    return box;
  }
  function renderDay(){
    const day=DATA.days.find(d=>d.id===state.lid) || DATA.days[0];
    if(!day){ $('#view').innerHTML='<div class="empty"><b>还没有课程笔记</b>运行每日工作流后，第一课会出现在这里。</div>'; return; }
    state.lid=day.id; state.date=day.date;
    const view=$('#view'); view.innerHTML='';
    view.appendChild(hero(day));
    view.appendChild(tabs(day));

    const dom = (DATA.domains||[]).find(d=>d.folder===day.domain);
    const meta=el('div','meta-row');
    meta.innerHTML='<span>领域 <b>'+esc(dom?dom.emoji+' '+dom.name:(day.domain||'—'))+'</b></span><span>模块 <b>'+esc(day.module||'—')+'</b></span><span>术语 <b>'+day.term_count+'</b></span><span>来源 <b>'+day.source_count+'</b></span>';
    view.appendChild(meta);

    const body=el('div','md');
    if(dom) body.style.setProperty('--dc',dom.color);
    if(state.tab==='note'){
      body.innerHTML=md2html(day.markdown.replace(/^#\s+[^\n]*\n+/, ''));
    } else if(state.tab==='review'){
      body.style.setProperty('--dc','var(--warn)');
      body.innerHTML=md2html(day.review_md || '本期没有审校记录。');
    }
    view.appendChild(body);
  }

  function renderList(items, emptyText, keyOf){
    const view=$('#view'); view.innerHTML='';
    if(!items.length){ view.innerHTML='<div class="empty"><b>'+emptyText+'</b></div>'; return; }
    const chips=el('div','tabs');
    items.forEach((it,i)=>{
      const b=el('button','tab'+(state[keyOf]===i?' active':''));
      b.innerHTML=esc(it.date? (it.date+' '):'')+esc(it.title);
      b.onclick=()=>{ state[keyOf]=i; render(); };
      chips.appendChild(b);
    });
    view.appendChild(chips);
    const it=items[Math.min(state[keyOf], items.length-1)] || items[0];
    const f=fmtDate(it.date);
    const h=el('div','hero');
    h.innerHTML='<div class="eyebrow"><span>'+f.y+'.'+f.m+'.'+f.day+'</span><span>'+weekday(it.date)+'</span><span class="pill">'+(it.type==='supplement'?'SUPPLEMENT':it.round?'REVIEW · R'+it.round: it.week?'NEWS · '+it.week:'NOTE')+'</span></div>'+
      '<h2>'+esc(it.title)+'</h2>'+
      '<div class="tags">'+(it.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>';
    view.appendChild(h);
    const body=el('div','md');
    body.style.setProperty('--dc','var(--warn)');
    body.innerHTML=md2html(it.markdown.replace(/^#\s+[^\n]*\n+/, ''));
    view.appendChild(body);
  }
  function renderReviews(){ renderList(DATA.reviews||[], '还没有串讲复习', 'rid'); }
  function renderSupplements(){ renderList(DATA.supplements||[], '还没有补充阅读', 'sid'); }
  function renderNews(){ renderList(DATA.news||[], '还没有动态简报', 'nid'); }
  function renderTopics(){
    const items = DATA.topics||[];
    const view=$('#view'); view.innerHTML='';
    if(!items.length){ view.innerHTML='<div class="empty"><b>还没有专题笔记</b>想深入一个主题直接说，例如「帮我整理 Mamba 家族的知识」。</div>'; return; }
    const chips=el('div','tabs');
    items.forEach((it,i)=>{
      const b=el('button','tab'+(state.tid===i?' active':''));
      b.innerHTML=esc(it.topic)+' · '+esc(it.part_title);
      b.onclick=()=>{ state.tid=i; render(); };
      chips.appendChild(b);
    });
    view.appendChild(chips);
    const it=items[Math.min(state.tid, items.length-1)]||items[0];
    const f=fmtDate(it.date);
    const h=el('div','hero');
    h.innerHTML='<div class="eyebrow"><span>'+f.y+'.'+f.m+'.'+f.day+'</span><span class="pill">TOPIC</span><span>'+esc(it.topic)+'</span></div>'+
      '<h2>'+esc(it.title)+'</h2>'+
      '<div class="tags">'+(it.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>';
    view.appendChild(h);
    const meta=el('div','meta-row');
    meta.innerHTML='<span>专题 <b>'+esc(it.topic)+'</b></span><span>视角 <b>'+esc(it.part_title)+'</b></span><span>术语 <b>'+it.term_count+'</b></span><span>来源 <b>'+it.source_count+'</b></span>';
    view.appendChild(meta);
    const body=el('div','md');
    body.style.setProperty('--dc','#b8a5ff');
    body.innerHTML=md2html(it.markdown.replace(/^#\s+[^\n]*\n+/, ''));
    view.appendChild(body);
  }
  function renderMap(){
    const view=$('#view'); view.innerHTML='';
    const h=el('div','hero');
    h.innerHTML='<div class="eyebrow"><span>KNOWLEDGE MAP</span><span class="pill">COURSE MAP</span></div>'+
      '<h2>四棵知识树，拼成一张全栈地图</h2>'+
      '<p class="thread">按课程路径推进：推理优先、昇腾 + vLLM 主栈。已学模块会标记日期；每 4 课一次串讲复习。</p>';
    view.appendChild(h);
    const grid=el('div','map-grid');
    DATA.domains.forEach(d=>{
      const c=DATA.coverage[d.id]||{learned_modules:[],first_seen:{}};
      const card=el('div','map-card');
      card.style.setProperty('--dc',d.color);
      let html='<h3><span>'+d.emoji+'</span>'+esc(d.name)+'</h3><p class="mission">'+esc(d.mission)+'</p>';
      d.curriculum.forEach(m=>{
        const done=c.learned_modules.includes(m.id);
        html+='<div class="module'+(done?' done':'')+'"><div class="state">'+(done?'✅':'⬜')+'</div><div class="name">'+esc(m.name)+'</div>'+(done?'<div class="date">'+esc(c.first_seen[m.id]||'')+'</div>':'')+'</div>';
      });
      card.innerHTML=html;
      grid.appendChild(card);
    });
    view.appendChild(grid);
    const legend=el('div','map-legend');
    legend.innerHTML='<span>✅ 已学 '+(Object.values(DATA.coverage).reduce((a,c)=>a+c.learned_modules.length,0))+'</span><span>⬜ 待学 '+(DATA.domains.reduce((a,d)=>a+d.curriculum.length,0)-Object.values(DATA.coverage).reduce((a,c)=>a+c.learned_modules.length,0))+'</span>';
    view.appendChild(legend);
  }

  function render(){
    renderDays(); renderProgress(); renderStats();
    document.querySelectorAll('.nav-item').forEach(n=>{
      n.classList.toggle('active', n.dataset.view===state.view);
    });
    $('#crumb').textContent = {day:'COURSE',map:'KNOWLEDGE MAP',reviews:'REVIEW',news:'NEWS',supplements:'EXTRA',topics:'TOPICS',questions:'MY QUESTIONS'}[state.view] || 'COURSE';
    updateQBadge();
    if(state.view==='map'){ renderMap(); }
    else if(state.view==='reviews'){ renderReviews(); }
    else if(state.view==='news'){ renderNews(); }
    else if(state.view==='supplements'){ renderSupplements(); }
    else if(state.view==='topics'){ renderTopics(); }
    else if(state.view==='questions'){ renderQuestions(); }
    else { renderDay(); }
    window.scrollTo({top:0,behavior:'instant'});
  }

  function closeSidebar(){ $('#sidebar').classList.remove('open'); }
  $('#menu-btn').onclick=()=>$('#sidebar').classList.toggle('open');
  $('#search').oninput=e=>{ state.q=e.target.value.trim(); renderDays(); };
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.onclick=()=>{ state.view=n.dataset.view; document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===n)); render(); closeSidebar(); };
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      if(state.view!=='day'){ return; }
      const idx=DATA.days.findIndex(d=>d.id===state.lid);
      const next=DATA.days[idx+(e.key==='ArrowLeft'?1:-1)];
      if(next){ state.view='day'; state.lid=next.id; state.date=next.date; state.tab='note'; render(); }
    }
    if(e.key==='Escape') closeSidebar();
  });


  /* ---------- 划词提问 ---------- */
  const QKEY='atlas.questions.v1';
  function loadQs(){ try{ return JSON.parse(localStorage.getItem(QKEY)||'[]'); }catch(e){ return []; } }
  function saveQs(a){ try{ localStorage.setItem(QKEY, JSON.stringify(a)); }catch(e){} }
  function updateQBadge(){ const b=$('#q-badge'); if(b) b.textContent=loadQs().length; }

  let selBtn=null, selQuote='';
  function ensureSelBtn(){
    if(selBtn) return selBtn;
    selBtn=document.createElement('button');
    selBtn.className='selbtn'; selBtn.type='button'; selBtn.textContent='＋ 标记疑问';
    selBtn.addEventListener('mousedown',e=>e.preventDefault());
    selBtn.addEventListener('touchstart',e=>e.preventDefault());
    selBtn.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); openQModal(selQuote); });
    selBtn.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); openQModal(selQuote); },{passive:false});
    document.body.appendChild(selBtn);
    return selBtn;
  }
  function hideSelBtn(){ if(selBtn) selBtn.style.display='none'; }
  let hideTimer=null;
  function scheduleHide(){
    clearTimeout(hideTimer);
    hideTimer=setTimeout(()=>{ const t=(document.getSelection()||{toString:()=>''}).toString().trim(); if(!t) hideSelBtn(); }, 800);
  }
  function onSelection(){
    const sel=document.getSelection();
    if(!sel || sel.rangeCount===0){ scheduleHide(); return; }
    const text=sel.toString().trim();
    if(text.length<6){ scheduleHide(); return; }
    const range=sel.getRangeAt(0);
    const node=range.commonAncestorContainer;
    const elem=node.nodeType===1?node:node.parentElement;
    if(!elem || !elem.closest('.md')){ scheduleHide(); return; }
    const rect=range.getBoundingClientRect();
    if(!rect || (!rect.width && !rect.height)){ scheduleHide(); return; }
    const b=ensureSelBtn();
    b.style.display='block';
    b.style.left=Math.max(8, Math.min(window.innerWidth-150, rect.left+rect.width/2-65))+'px';
    b.style.top=Math.min(window.innerHeight-64, rect.bottom+8)+'px';
    selQuote=text.slice(0,400);
  }
  document.addEventListener('selectionchange',()=>{ setTimeout(onSelection,60); });

  function currentLesson(){
    return DATA.days.find(d=>d.id===state.lid) || DATA.days[0] || {id:'', title:''};
  }
  function openQModal(quote){
    const day=currentLesson();
    const overlay=el('div','qmodal');
    overlay.innerHTML='<div class="qbox"><h3>标记疑问</h3>'+
      (quote? '<div class="qquote">'+esc(quote.slice(0,240))+'</div>':'')+
      '<textarea class="qta" placeholder="你在想什么？例如：为什么 Ā 要这样离散化？"></textarea>'+
      '<div class="qactions"><button class="qbtn ghost" data-a="cancel">取消</button><button class="qbtn primary" data-a="save">保存疑问</button></div>'+
      '<p class="qhint">保存在本机浏览器。之后在「我的疑问」里复制 / 下载，交给 Agent 讲解。</p></div>';
    document.body.appendChild(overlay);
    const ta=overlay.querySelector('.qta'); ta.focus();
    overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('[data-a="cancel"]').onclick=()=>overlay.remove();
    overlay.querySelector('[data-a="save"]').onclick=()=>{
      const comment=ta.value.trim();
      if(!comment){ ta.focus(); return; }
      const qs=loadQs();
      qs.unshift({id:'q'+Date.now(), lessonId:day.id, lessonTitle:day.title, quote:quote, comment:comment, ts:new Date().toISOString()});
      saveQs(qs); overlay.remove(); hideSelBtn(); updateQBadge();
      toast('已保存，去「我的疑问」查看');
      if(state.view==='questions') render();
    };
  }


  /* ---------- 批注模式（iPhone 更稳） ---------- */
  let annotate=false;
  function setAnnotate(on){
    annotate=on;
    document.body.classList.toggle('annotate',on);
    const b=$('#ann-btn');
    if(b){ b.classList.toggle('on',on); b.textContent=on?'✎ 批注中':'✎ 批注'; }
    if(on) toast('批注模式：点任意段落即可标记疑问');
  }
  function initAnnotate(){
    const b=$('#ann-btn');
    if(b) b.onclick=()=>setAnnotate(!annotate);
    document.addEventListener('click',e=>{
      if(!annotate) return;
      if(e.target.closest('.topbar,.sidebar,.qmodal,.selbtn')) return;
      if(e.target.closest('a')) return;
      const block=e.target.closest('.md p, .md li, .md h2, .md h3, .md td');
      if(!block) return;
      const quote=(block.innerText||'').trim().slice(0,400);
      if(!quote) return;
      e.preventDefault(); e.stopPropagation();
      openQModal(quote);
    }, true);
  }
  function qMarkdown(qs){
    const groups={};
    qs.forEach(q=>{ const g=groups[q.lessonId]||(groups[q.lessonId]={title:q.lessonTitle,items:[]}); g.items.push(q); });
    let md='# 学习疑问 · '+new Date().toISOString().slice(0,10)+'\n\n';
    Object.values(groups).forEach(g=>{
      md+='## '+g.title+'\n\n';
      g.items.forEach(q=>{
        if(q.quote && q.quote.trim()) md+='- 引用：「'+q.quote.replace(/\n/g,' ')+'」\n';
        md+='  - 我的问题：'+q.comment+'\n';
      });
      md+='\n';
    });
    md+='\n> 请 Agent 针对每条问题讲解，并指出我理解偏差在哪。\n';
    return md;
  }
  function renderQuestions(){
    const view=$('#view'); view.innerHTML='';
    const qs=loadQs();
    const h=el('div','hero');
    h.innerHTML='<div class="eyebrow"><span>MY QUESTIONS</span><span class="pill">'+qs.length+' 条</span></div>'+
      '<h2>我的疑问</h2>'+
      '<p class="thread">在文章里长按选中一段文字 → 点「＋ 标记疑问」→ 写下你的问题。问题存在这台设备，之后复制或下载交给 Agent 讲解。</p>';
    view.appendChild(h);
    if(!qs.length){
      const e=el('div','empty'); e.innerHTML='<b>还没有疑问</b>打开任意一课，选中一段文字，点「＋ 标记疑问」。';
      view.appendChild(e); return;
    }
    const bar=el('div','qbar');
    bar.innerHTML='<button class="qbtn primary" data-a="add">＋ 手写一条</button><button class="qbtn ghost" data-a="copy">复制全部</button><button class="qbtn ghost" data-a="download">下载 .md</button><button class="qbtn ghost" data-a="share">分享</button>';
    bar.querySelector('[data-a="add"]').onclick=()=>openQModal('');
    view.appendChild(bar);
    const md=qMarkdown(qs);
    bar.querySelector('[data-a="copy"]').onclick=()=>{
      if(navigator.clipboard) navigator.clipboard.writeText(md).then(()=>toast('已复制，粘贴给 Agent 即可')).catch(()=>toast('复制失败，请用下载'));
      else toast('当前浏览器不支持复制，请用下载');
    };
    bar.querySelector('[data-a="download"]').onclick=()=>{
      const blob=new Blob([md],{type:'text/markdown'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='疑问-'+new Date().toISOString().slice(0,10)+'.md';
      document.body.appendChild(a); a.click(); a.remove();
      toast('已下载到「文件」App');
    };
    bar.querySelector('[data-a="share"]').onclick=()=>{
      if(navigator.share){ navigator.share({title:'学习疑问', text:md}); }
      else { toast('当前浏览器不支持分享，请用下载'); }
    };
    qs.forEach(q=>{
      const it=el('div','qitem');
      it.innerHTML='<div class="qmeta">'+esc(q.lessonTitle)+' · '+new Date(q.ts).toLocaleString()+'</div>'+
        '<div class="qq">「'+esc((q.quote||'').slice(0,160))+'」</div>'+
        '<div class="qc">'+esc(q.comment)+'</div>'+
        '<button class="qdel">删除</button>';
      it.querySelector('.qdel').onclick=()=>{ saveQs(loadQs().filter(x=>x.id!==q.id)); render(); toast('已删除'); };
      view.appendChild(it);
    });
  }

  initAnnotate();
  render();
})();
</script>
</body>
</html>
